# Planted-state rates of the synthetic hospital (TB-DS-21 §3.1): archetype -> attribute -> state -> weight.
# The generator draws each state with these weights (in this order: the order is part of the deterministic draw),
# and tools.synth_hospital checks the observed shares against them. ``site.mix`` is the patient mix per site.
# Moved unchanged from the literals in generator.py (same seed -> same fixtures).
site:
  mix:
    gout: 0.3
    ra: 0.26
    onc: 0.04
    general: 0.4
  # the Japanese memory-clinic site of scenario J1 (T-503, ``Generator(mix="mix_jp_ad")``): early AD / MCI patients
  # beside the usual gout, RA and general patients. ``mix`` above stays the default (same seed -> same fixtures).
  mix_jp_ad:
    ad: 0.4
    gout: 0.1
    ra: 0.1
    general: 0.4
  # the Taiwanese rheumatology site of scenarios T1 to T3 (T-504, ``Generator(mix="mix_tw_ra")``): RA patients screened
  # for the JAK-inhibitor trial RA-JAK beside gout patients (GZQO, T1) and the usual RA patients (RA-COH, T3).
  mix_tw_ra:
    rajak: 0.45
    gout: 0.15
    ra: 0.05
    general: 0.35
