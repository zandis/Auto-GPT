# PHI planted in notes in gold mode only (tools.synth_hospital; TB-DS-21 §3.1, rates proposed there): the share of
# notes that carry PHI, then the chance of each span type in such a note (3.0 spans per PHI-bearing note on average).
phi:
  note_rate:
    carries: 0.7
    clean: 0.3
  types:
    name: 1.0
    date: 1.0
    chart: 0.4
    phone: 0.2
