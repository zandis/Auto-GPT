# The allow-list of the limits lint (tools/limits_lint.py; T-687, D-471; OD-10 of TB-PLAN-06.1).
#
# One line per (file, kind, value): `count` is how many such literals the file holds. Every reason names the scale
# review finding (F-nn, docs/reviews/2026-11-11-scale-timeouts.md) and the card that removes the literal, or says why
# the literal is "not a cut" (one row by key, the newest row, a small text helper, a call whose size does not grow
# with the hospital). A new literal, or a line whose literal is gone, fails the lint: the card that removes a limit
# removes its line here in the same pull request.
allow:
  # ---------------------------------------------------------------- time limits that grow with the hospital
  - {path: services/lake/client.py, kind: timeout, value: 330, count: 1,
     reason: "F-01: the site publish waits 330 s on a whole-lake rebuild (805 s at 50k), and every lake query (F-29); T-690 makes the rebuild a polled job, T-694 gives queries a limit per job type"}
  - {path: services/adapter/validate/validator.py, kind: timeout, value: 1800, count: 1,
     reason: "F-06 (rest): 1,800 s per validator run of 5,000 files; the sample's absolute cap per type is T-693"}
  - {path: services/orchestrator/twophase.py, kind: timeout, value: 600, count: 1,
     reason: "F-30: the swap client's 600 s on the one-card layout; T-698 (one lease of the card)"}
  - {path: services/gateway/swap.py, kind: timeout, value: 120, count: 1,
     reason: "F-30: 120 s for a model wake on the swap layout (a cold load can be longer); T-698"}
  - {path: services/embed_service/embedder.py, kind: timeout, value: 300, count: 1,
     reason: "F-15: 300 s per embedding batch, one try, on the CPU; T-701 (GPU, retry and progress)"}
  - {path: services/orchestrator/clients.py, kind: timeout, value: 3600, count: 1,
     reason: "F-27: the compiler's equivalence gate evaluates the whole lake inside 3,600 s; T-694"}
  # ---------------------------------------------------------------- time limits on calls whose size does not grow with the hospital
  - {path: services/adapter/load_fhir.py, kind: timeout, value: 600, count: 2,
     reason: "one FHIR batch POST / one delete batch of a fixed size: the time per call does not grow with the hospital, the number of calls does; not a cut (a failed batch fails the load loudly)"}
  - {path: services/criteria_compiler/compile_cql/translator.py, kind: timeout, value: 600, count: 1,
     reason: "one CQL translation of one protocol: protocol size, not patients; fails loudly; not a cut"}
  - {path: services/model_guard/__init__.py, kind: timeout, value: 900, count: 1,
     reason: "the guard's proxy read to the model server: the model's longest answer, as nginx 900 s (D-445); not a cut; the batch roles' read limit from max_tokens and the measured rate is T-698 (F-13)"}
  - {path: services/orchestrator/clients.py, kind: timeout, value: 900, count: 1,
     reason: "one protocol document parsed by doc-parser: document size, not patients; fails loudly; not a cut"}
  - {path: services/orchestrator/clients.py, kind: timeout, value: 300, count: 1,
