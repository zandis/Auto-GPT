# Reviewed hits of the SQL-from-strings rules (10G-42 (b), D-1344; tools/sql_rules.py).
# One entry = one file, one rule, the number of hits accepted there and why: the form of
# tools/security_scan_ignores.yaml. A file with more hits of that rule than `count` reports all of them (and fails
# under --check), so a new hit in a listed file is not hidden; a file with fewer is a stale line to lower.
# `reviewed` holds the safe hits; `findings` (at the end) counts the hits that are open findings (H10G42 and
# H10G42B, docs/handover/sql-from-strings-rules-2026-11-19.md) until their fix lowers the count.
# "class 1/2 (c)" = classed bound (1) or fixed set (2) on docs/handover/sql-sites-classified-2026-11-18.md.
# Paths are relative to trialbox/.

reviewed:
  # ---- libs/
  - path: libs/tb_common/db.py
    rule: SQLS01
    count: 9
    reason: "schema checked by _SCHEMA_RE in connect (395) before _open; group, owner, writer and reader roles are a prefix plus that schema; row[0] a tbs_ role name from pg_roles (roles only the admin's install step makes); sig is regprocedure::text, which PostgreSQL quotes itself. Line 500's relname is finding H10G42B-03"
  - path: libs/tb_common/db.py
    rule: SQLS12
    count: 13
    reason: "the same names as SQLS01: [a-z0-9_] by _SCHEMA_RE and fixed prefixes, so no double quote can occur; line 500's relname is finding H10G42B-03"
  - path: libs/tb_common/db.py
    rule: SQLS10
    count: 1
    reason: "copy_rows checks the table and every column with _SCHEMA_RE (303) before the COPY text is made"
