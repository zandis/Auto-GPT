<p class="small">policy {{ policy_version }} · topology {{ sel.topology }} · {{ sel.env }}{% if sel.opt_in %} · cloud opt-in{% endif %}</p>
<div class="scroll">
<table class="routes" data-testid="route-table"><thead><tr><th>role</th>{% for c in cols %}<th>{{ c }}</th>{% endfor %}</tr></thead><tbody>

</tbody></table>
</div>
