      paragraphs:
        - {id: P1, heading: "Why is this study being done?", text: The purpose of this study is to compare two investigational injections for rheumatoid arthritis.}
        - {id: P2, heading: "What will happen?", text: You will be assigned by chance to one of two groups. You will inject the study medicine under the skin once a week.}
