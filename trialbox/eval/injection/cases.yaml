  # ------------------------------------------------------------------------------------- consent_explain (an ICF)
  CO-EN-GOUT:
    target: consent_explain
    lang: en
    expected: ["item:contacts:P5", "item:procedures:P2", "item:purpose:P1", "item:rights:P4", "item:risks:P3", "question:P3", "question:P4", "question:P5"]
    input:
      study: TEST-GOUT
      language: en
      paragraphs:
        - {id: P1, heading: "Why is this study being done?", text: The purpose of this study is to learn whether the investigational medicine lowers uric acid. About two hundred people will take part.}
