# Data class per dataset under eval/ (spec v4 §16.3, ENG-16). DEV and TEST refuse anything above D0.
# synthetic: generated by tools in this repository; open: published data with the licence named.
datasets:
  criterion_ml:
    path: eval/criterion_ml
    data_class: D0
    kind: open
    licence: NCBI TrialGPT data (public domain notice in LICENSE.NCBI); translations by TrialBox
  synthetic_hospitals:
    path: tests/fixtures (generated by tools/make_fixtures.py)
    data_class: D0
    kind: synthetic
    licence: generated
  mimic_iv_fhir_demo:
    path: .cache/open_data (fetched at run time, never committed)
    data_class: D0
    kind: open
    licence: ODbL 1.0 (PhysioNet MIMIC-IV Clinical Database Demo on FHIR v2.1.0)
  ctgov_records:
    path: tests/fixtures/open_data
    data_class: D0
    kind: open
    licence: ClinicalTrials.gov public records
  match_registry:
    path: eval/match_registry
    data_class: D0
    kind: open
    licence: NCBI TrialGPT benchmark (US government work, public domain notice kept)
  recall_cert:
    path: eval/suites/recall_cert
    data_class: D0
    kind: synthetic
    licence: generated (seeded simulation)
  deid_synthetic:
    path: eval/suites/deid_synthetic
    data_class: D0
    kind: synthetic
    licence: generated (planted identifiers, seeded)
  judge_public:
    path: eval/suites/judge_public
    data_class: D0
    kind: open
    licence: NCBI TrialGPT data (public domain); recorded GPT-4 labels from the same dataset
  ingest_fhir_demo:
    path: eval/suites/ingest_fhir_demo
    data_class: D0
    kind: open
    licence: ODbL 1.0 (MIMIC-IV demo on FHIR, fetched at run time, never committed)
  criteria_extract_public:
    path: eval/suites/criteria_extract_public
    data_class: D0
    kind: open
    licence: Chia corpus - licence unconfirmed (App. H); loader disabled, no data
