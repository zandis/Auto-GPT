# Data class per dataset under eval/ (spec v4 §16.3, ENG-16). DEV and TEST refuse anything above D0.
# synthetic: generated by tools in this repository; open: published data with the licence named.
# register: the rows of docs/licences/register.csv the licence comes from; `python -m tools.licence_register --check`
# fails when an open set names none, or the licence stated here lacks a row's licence (card 10H-1).
datasets:
  criterion_ml:
    path: eval/criterion_ml
    data_class: D0
    kind: open
    licence: notes (notes_en.json) SIGIR 2016, CC BY-SA 4.0 (Koopman and Zuccon, CSIRO, https://researchdata.edu.au/a-test-collection-clinical-trials/664508); their zh-TW, ja and mixed translations by TrialBox are adaptations, CC BY-SA 4.0; criterion labels (annotations.jsonl) NCBI TrialGPT, U.S. Government work, public domain notice (LICENSE.NCBI); trial titles and criteria ClinicalTrials.gov terms; attribution in eval/criterion_ml/NOTICE.md (read 2026-11-18, H-37)
    register: [pubacc-sigir-2016, pubacc-trialgpt-criterion, ctgov-public-protocols]
  public_accuracy_key:
    path: eval/public_accuracy_key
    data_class: D0
    kind: open
    licence: ids and sha256 only, of SIGIR 2016 (CC BY-SA 4.0, CSIRO; NCBI TrialGPT copy, LICENSE.NCBI) and JMED-Personas (Sociocom (NAIST), CC BY 4.0)
    register: [pubacc-sigir-2016, pubacc-jmed-personas]
  trialgpt_compare:
    path: eval/trialgpt_compare
    data_class: D0
    kind: open
    licence: model answers on eval/criterion_ml, which quote its notes, SIGIR 2016, CC BY-SA 4.0 (CSIRO; as criterion_ml) and their translations; criterion labels NCBI TrialGPT, public domain notice; criterion routes labelled by TrialBox
    register: [pubacc-sigir-2016, pubacc-trialgpt-criterion]
  synthetic_hospitals:
    path: tests/fixtures (generated by tools/make_fixtures.py)
    data_class: D0
    kind: synthetic
    licence: generated
  mimic_iv_fhir_demo:
    path: .cache/open_data (fetched at run time, never committed)
    data_class: D0
    kind: open
    licence: ODbL 1.0 (PhysioNet MIMIC-IV Clinical Database Demo on FHIR v2.1.0)
    register: [mimic-iv-fhir-demo]
  ctgov_records:
    path: tests/fixtures/open_data
    data_class: D0
    kind: open
    licence: ClinicalTrials.gov public records
    register: [ctgov-public-protocols]
  match_registry:
    path: eval/match_registry
    data_class: D0
    kind: open
    licence: NCBI TrialGPT benchmark (US government work, public domain notice kept); its SIGIR 2016 cohort CC BY-SA 4.0 (CSIRO) and its TREC Clinical Trials 2021/2022 cohorts (NIST, no licence stated), fetched at run time, never committed
    register: [pubacc-sigir-2016, pubacc-trec-ct]
  recall_cert:
    path: eval/suites/recall_cert
    data_class: D0
    kind: synthetic
    licence: generated (seeded simulation)
  deid_synthetic:
    path: eval/suites/deid_synthetic
    data_class: D0
    kind: synthetic
    licence: generated (planted identifiers, seeded)
  judge_public:
    path: eval/suites/judge_public
    data_class: D0
    kind: open
    licence: as criterion_ml, notes SIGIR 2016, CC BY-SA 4.0 (CSIRO); criterion labels and the recorded GPT-4 labels NCBI TrialGPT, public domain notice
    register: [pubacc-sigir-2016, pubacc-trialgpt-criterion]
  ingest_fhir_demo:
    path: eval/suites/ingest_fhir_demo
    data_class: D0
    kind: open
    licence: ODbL 1.0 (MIMIC-IV demo on FHIR, fetched at run time, never committed)
    register: [mimic-iv-fhir-demo]
  criteria_extract_public:
    path: eval/suites/criteria_extract_public
    data_class: D0
    kind: open
    licence: Chia corpus, CC BY 4.0 (Kury et al., Sci Data 2020, figshare 10.6084/m9.figshare.11855817), as the chia entry; this suite's loader is not built yet, no data
    register: [pubacc-chia]
  trec_ct:
    path: eval/trec_ct (model answers and scores; NIST topics/qrels and NCBI corpus in .cache, never committed)
    data_class: D0
    kind: open
    licence: TREC Clinical Trials 2021/2022 topics and qrels (NIST, synthetic patient descriptions; NIST states no licence); trial texts from the NCBI TrialGPT corpus (ClinicalTrials.gov public records)
    register: [pubacc-trec-ct]
  qualification:
    path: eval/qualification (qualification records of `trialbox eval qualify` and the schema probes, D-313; hashes, counts and codes only)
    data_class: D0
    kind: synthetic
    licence: written for TrialBox (synthetic probes, no patient data)
  injection:
    path: eval/injection (the prompt-injection and false-positive suite, T-208, D-346; synthetic notes, charts, consent forms and protocols with planted instructions in en / ja / zh-TW)
    data_class: D0
    kind: synthetic
    licence: written for TrialBox (fictional text, no patient data)
  canary_local:
    path: eval/canary_local (answers of 4-bit GGUF builds on CPU to the orchestrator canary, services/orchestrator/canary; 2026-11-08)
    data_class: D0
    kind: synthetic
    licence: written for TrialBox (fictional notes, no patient data)
  accuracy:
    path: eval/accuracy (the note accuracy set per language and stratum, NEW-LLM-6, D-784; generated from a seed by tools/accuracy_set.py and pinned by MANIFEST.json, never committed; reports hold counts and rates only)
    data_class: D0
    kind: synthetic
    licence: written for TrialBox (fictional notes, no patient data)
  chat:
    path: eval/chat (front-desk chat check of the 2026-11-07 survey, 30 fictional staff requests in ja / zh-TW / en, model answers and scores)
    data_class: D0
    kind: synthetic
    licence: written for TrialBox (fictional requests, no patient data)
  phi_synth:
    path: eval/phi_synth (120 fictional clinical notes with planted PHI and look-alike decoys, generated by tools/phi_synth_gen.py; detector results)
    data_class: D0
    kind: synthetic
    licence: generated for TrialBox (fictional; no real person)
  phi_second_opinion:
    path: eval/phi_second_opinion (Presidio beside the note masker, D-1037; counts and span shapes, no values; tools/phi_second_opinion.py)
    data_class: D0
    kind: synthetic
    licence: generated for TrialBox (fictional) and the SIGIR notes (CC BY-SA 4.0, CSIRO; as criterion_ml)
    register: [pubacc-sigir-2016]
  medtxt:
    path: eval/medtxt (model answers and scores; MedTxt-CR/RR XML in .cache, never committed)
    data_class: D0
    kind: open
    licence: CC BY 4.0 (NTCIR-16 Real-MedNLP test collection, Sociocom NAIST; MedTxt-CR training split and MedTxt-RR)
    register: [medtxt]
  public_site:
    path: eval/public_site (site profiles of the two test protocols; the hospital is built at run time by tools/public_site.py from criterion_ml and medtxt, never committed)
    data_class: D0
    kind: open
    licence: SIGIR notes CC BY-SA 4.0 (CSIRO; as criterion_ml); MedTxt CC BY 4.0 (Sociocom NAIST); derived fields and test protocols are TrialBox's own
    register: [pubacc-sigir-2016, medtxt]
  complete_run:
    path: eval/complete_run (reports of tools/complete_run.py, D-139; screenshots are never committed)
    data_class: D0
    kind: synthetic
    licence: generated synthetic hospital (tools/synth_hospital), synthetic charts (tools/synth_charts) and the public site (see public_site); the D-141 scenarios also read mimic_iv_fhir_demo, medtxt and trec_ct (see those entries; only counts reach the report); reports are TrialBox's own
  hospital_sim:
    path: eval/hospital_sim (measured pipeline runs on generated hospitals and projections)
    data_class: D0
    kind: synthetic
    licence: generated (tools/synth via tools/hospital_sim.py)
  omop_parity:
    path: eval/omop_parity (tools/omop_parity.py, D-151; counts and verdict totals only, no patient row)
    data_class: D0
    kind: synthetic
    licence: generated synthetic hospital (tools/synth_hospital) and the public site and MIMIC-IV demo (see public_site and mimic_iv_fhir_demo; only counts reach the report); the report is TrialBox's own
  vec_parity:
    path: eval/vec_parity (tools/vec_parity.py, D-449; S2b counts per ruleset with the flag vec.s2b off and on, no patient row)
    data_class: D0
    kind: synthetic
    licence: generated synthetic hospital (tools/synth_hospital); the report is TrialBox's own
  parity:
    path: eval/parity (offline model-gate replay of recorded SIGIR/TREC answers and serving-configuration records, D-111)
    data_class: D0
    kind: open
    licence: derived scores of trialgpt_compare (SIGIR 2016 notes, CC BY-SA 4.0, CSIRO; NCBI criterion labels, public domain notice) and trec_ct (TREC topics and qrels, NIST, no licence stated) recordings (see those entries); serving records are configuration, no patient data
    register: [pubacc-sigir-2016, pubacc-trialgpt-criterion, pubacc-trec-ct]
  open_cohorts:
    path: eval/open_cohorts (model answers and scores; SIGIR/TREC 2023 topics, qrels and trial texts in .cache, never committed)
    data_class: D0
    kind: open
    licence: SIGIR 2016 cohort, CC BY-SA 4.0 (CSIRO), as redistributed by NCBI TrialGPT (public domain notice); TREC Clinical Trials 2023 topics and qrels (NIST, no licence stated); trial criteria from the ClinicalTrials.gov public API
    register: [pubacc-sigir-2016, pubacc-trec-ct, pubacc-ctgov-live]
  chia:
    path: eval/chia (route shares only; the Chia corpus is fetched to .cache at run time, never committed)
    data_class: D0
    kind: open
    licence: CC BY 4.0 (Kury et al., Sci Data 2020, figshare 10.6084/m9.figshare.11855817)
    register: [pubacc-chia]
  ad:
    path: eval/ad (Alzheimer's slice; model answers, router labels and scores; trial texts in .cache, never committed)
    data_class: D0
    kind: open
    licence: ClinicalTrials.gov public records; TREC Clinical Trials 2021/2022 topics and qrels (NIST, no licence stated)
    register: [pubacc-trec-ct, pubacc-ctgov-live]
  synthea:
    path: eval/synthea (cohort counts only; the Synthea CSV export is generated at run time, never committed)
    data_class: D0
    kind: synthetic
    licence: generated by Synthea (Apache-2.0), every patient fictional
  bakeoff:
    path: eval/bakeoff (the bake-off's results, D-111; scores, predictions and evidence sentence ids, no note text)
    data_class: D0
    kind: open
    licence: results of models on eval/criterion_ml, whose notes are SIGIR 2016, CC BY-SA 4.0 (CSIRO), with their translations; criterion labels NCBI TrialGPT, public domain notice; the results are this project's own
    register: [pubacc-sigir-2016, pubacc-trialgpt-criterion]
  public_accuracy_p1b:
    path: tests/fixtures/public_accuracy_p1b (slices of launch P1b, D-1104 and D-1111; model calls quote SIGIR note sentences)
    data_class: D0
    kind: open
    licence: SIGIR 2016 note sentences, CC BY-SA 4.0 (CSIRO), quoted in the model calls; criterion labels NCBI TrialGPT, public domain notice; protocol text ClinicalTrials.gov; JMED-Personas (Sociocom (NAIST), CC BY 4.0)
    register: [pubacc-sigir-2016, pubacc-trialgpt-criterion, pubacc-ctgov-live, pubacc-jmed-personas]
