# deid_synthetic: public synthetic code-mixed de-identification set (spec v4 PRIV-30, §7.14; S1-08).
# Items are generated by generate.py from this seed at test time; no item is committed. All identifiers are
# synthetic: random digits with valid check digits, reserved e-mail domains, invented addresses.
data_class: D0
seed: 20261025
items_per_language: 80
languages: [zh-TW, ja, en]
# site MRN pattern used for the suite (same form as deploy/settings.example.yaml mrn_regex)
mrn_regex: "^\\d{8}$"
# share of items with no planted identifier (clinical text with numbers), used for the false-positive rate
negative_share: 0.15
# CI floor until the IRB-built site set exists (PRIV-30: recall >= 0.98 for names and identifiers)
recall_floor: 0.98
# planted identifiers allowed to survive into the trace store
max_leaks: 0
# share of negative items (no planted identifier) that may receive any redaction (precision proxy)
max_negative_hit_rate: 0.05
