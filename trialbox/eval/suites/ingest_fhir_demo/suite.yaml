# ingest_fhir_demo: MIMIC-IV Clinical Database Demo on FHIR v2.1.0 through services/dataplat L0-L5 (spec v4 S1-04,
# S1-13, VV-12). The data is fetched at run time by tools/fetch_open_data.py into .cache/open_data (ODbL; never
# committed). The suite skips cleanly when the data is not fetched.
suite: ingest_fhir_demo
version: 1
dataset: mimic_iv_fhir_demo
data_class: D0
source_dir: .cache/open_data/mimic-iv-fhir-demo
expect:
  outcome: PUBLISH
  blocking_dq_errors: 0
  lineage_complete: true
  patients: 100
