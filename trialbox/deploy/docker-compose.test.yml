# Test/dev override: mail test servers and localhost-only port publishing for the test harness.
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --profile stub --profile test up -d
# Host ports: every published port can be moved with TB_HOST_<NAME>_PORT (deploy/.env; tests/stack.py).
# The test stack runs on synthetic data: the gateway is in the TEST environment (D0 ceiling) and the v1 services label
# their model calls D0 (TB_DATA_CLASS). llm-stub is not published: models are reached through the gateway only.
services:
  greenmail:
    image: ${GREENMAIL_IMAGE:-greenmail/standalone:2.1.3@sha256:d6db42a4fc258fec0948b1ae7b579fd06947cc92087c162ec0597972a6c36850}
    profiles: [test]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled -Dgreenmail.users=trialbox:trialbox@hospa.test -Dgreenmail.verbose=false
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_SMTP_PORT:-3025}:3025", "127.0.0.1:${TB_HOST_IMAP_PORT:-3143}:3143"]
  mailhog:
    image: ${MAILHOG_IMAGE:-mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea}
    profiles: [test]
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_MAILHOG_PORT:-8025}:8025"]
  mail-gateway:
    environment: {PORT: "8015", TB_SERVICE_NAME: mail-gateway, TB_AUDIT_DIR: /data/audit, TB_MAIL_DIR: /data/mail,
                  TB_MAIL_POLL_SECONDS: "5"}
    networks: [trialbox-net, egress-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_MAIL_GATEWAY_PORT:-8015}:8015"]
  orchestrator:
    networks: [trialbox-net, egress-net, host-net]
    environment: {TB_TODAY: "2026-10-05", TB_DATA_CLASS: "${TB_DATA_CLASS:-D0}"}  # fixtures' reference date (tools/synth)
    ports: ["127.0.0.1:${TB_HOST_ORCH_PORT:-8010}:8010"]
    volumes:
      - ${TB_SETTINGS_FILE:-./settings.example.yaml}:/etc/trialbox/settings.yaml:ro
      - orch-data:/data/orchestrator
      - audit-data:/data/audit
      - rulesets-data:/data/rulesets:ro
      - ../.cache/test-secrets:/run/secrets/trialbox
  fhir-store:
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_FHIR_PORT:-8080}:8080"]
  lake:
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_LAKE_PORT:-8013}:8013"]
  adapter:
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_ADAPTER_PORT:-8016}:8016"]
    volumes:  # test-only: a known site key so the harness can compute pids (production: TPM-sealed, in-box only)
      - ${TB_SETTINGS_FILE:-./settings.example.yaml}:/etc/trialbox/settings.yaml:ro
      - ${TB_SOURCE_DIR:-../tests/fixtures/synthetic_patients/site-a}:/data/source/site-a:ro
      - lake-data:/data/lake
      - audit-data:/data/audit
      - ../.cache/test-secrets:/run/secrets/trialbox
  doc-parser:
    environment: {TB_DATA_CLASS: "${TB_DATA_CLASS:-D0}"}
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_PARSER_PORT:-8011}:8011"]
  minio:
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_MINIO_PORT:-9000}:9000"]
  criteria-compiler:
    networks: [trialbox-net, egress-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_COMPILER_PORT:-8012}:8012"]
    environment: {TB_CTGOV_MODE: cassette, TB_DATA_CLASS: "${TB_DATA_CLASS:-D0}"}  # synthetic CT.gov (make_ctgov_cassettes)
  gateway:
    environment: {TB_ENV: "${TB_ENV:-TEST}"}
    networks: [trialbox-net, model-net, egress-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_GATEWAY_PORT:-8020}:8020"]
  workflow-db:   # host access for the outbox / recall-ledger Postgres tests (TB_PG_DSN)
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_WORKFLOW_DB_PORT:-5433}:5432"]
networks:
  host-net:
    name: trialbox-hostnet
