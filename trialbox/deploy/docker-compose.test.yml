# Test/dev override: mail test servers and localhost-only port publishing for the test harness.
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --profile stub --profile test up -d
# Host ports: every published port can be moved with TB_HOST_<NAME>_PORT (deploy/.env; tests/stack.py).
# The test stack runs on synthetic data: the gateway is in the TEST environment (D0 ceiling) and the v1 services label
# their model calls D0 (TB_DATA_CLASS). llm-stub is not published: models are reached through the gateway only.
services:
  greenmail:
    image: ${GREENMAIL_IMAGE:-greenmail/standalone:2.1.15@sha256:309ba544ea482e5d4265d09921cdab07c8dad2cc4481d715c9b8ff5d3f0a149f}
    profiles: [test]
    mem_limit: 1g   # T-108a (D-360): test servers have caps too
    pids_limit: 512
    logging: {driver: json-file, options: {max-size: "20m", max-file: "3"}}
    # H-58 (D-1337): the four controls. 999:999 is the image's own greenmail user (its /etc/passwd); GreenMail keeps
    # mail in memory and the JVM writes only under /tmp (hsperfdata, java.io.tmpdir), a tmpfs. Ports above 1024.
    user: "999:999"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled -Dgreenmail.users=trialbox:trialbox@hospa.test -Dgreenmail.verbose=false
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_SMTP_PORT:-3025}:3025", "127.0.0.1:${TB_HOST_IMAP_PORT:-3143}:3143"]
  # the sink for the box's outbound mail: SMTP 1025, web UI and API 8025 (D-348 replaced MailHog, DEP-021). The alias
  # keeps SMTP_HOST=mailhog of an older deploy/.env working; TB_HOST_MAILHOG_PORT keeps its name for the same reason.
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce}
    profiles: [test]
    mem_limit: 256m
    pids_limit: 256
    logging: {driver: json-file, options: {max-size: "20m", max-file: "3"}}
    # H-58 (D-1337): the image names no user (root); 65534:65534 (nobody) runs its one binary (/mailpit, 0755) on
    # ports above 1024. Exception (EXCEPTIONS of tests/unit/test_container_hardening.py): no read_only. With no
    # MP_DATABASE its message database is a file in /tmp: on a read-only root that would be a memory tmpfs under this
    # 256m cap, filled by every test mail.
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"       # like MailHog: any SMTP login is accepted, none is required
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"   # a login without TLS on the test network
      MP_MAX_MESSAGES: "5000"
    networks:
      trialbox-net: {aliases: [mailhog]}
      host-net: {}
    ports: ["127.0.0.1:${TB_HOST_MAILHOG_PORT:-8025}:8025"]
  mail-gateway:
    # TB_ENV TEST: a synthetic stack, so patient files may still go as a password zip that the tests open (D-369)
    environment: {PORT: "8015", TB_SERVICE_NAME: mail-gateway, TB_AUDIT_DIR: /data/audit, TB_MAIL_DIR: /data/mail,
                  TB_MAIL_POLL_SECONDS: "5", TB_ENV: "${TB_ENV:-TEST}"}
    networks: [trialbox-net, egress-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_MAIL_GATEWAY_PORT:-8015}:8015"]
  orchestrator:
    networks: [trialbox-net, egress-net, host-net]
    # TB_ENV TEST (D-640, as D-560 for embed-service): a synthetic stack says so. Unset is PRODUCTION, where no
    # shipped example ruleset is seeded or run; this stack's studies are the examples
    environment: {TB_TODAY: "2026-10-05", TB_DATA_CLASS: "${TB_DATA_CLASS:-D0}",  # fixtures' reference date (tools/synth)
                  TB_ENV: "${TB_ENV:-TEST}"}
    ports: ["127.0.0.1:${TB_HOST_ORCH_PORT:-8010}:8010"]
    volumes:
      - ${TB_SETTINGS_FILE:-./settings.example.yaml}:/etc/trialbox/settings.yaml:ro
      - orch-data:/data/orchestrator
      - audit-data:/data/audit
      - rulesets-data:/data/rulesets:ro
      - objects-data:/data/objects
      - ../.cache/test-secrets:/run/secrets/trialbox
  fhir-store:
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_FHIR_PORT:-8080}:8080"]
  lake:
    # TB_ENV TEST (D-639, as D-560 and D-640): a synthetic stack says so. Unset is PRODUCTION, where a service with
    # the example's placeholder token refuses every changing call (503): the harness could not start an ingest
    environment: {TB_ENV: "${TB_ENV:-TEST}"}
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_LAKE_PORT:-8013}:8013"]
  adapter:
    environment: {TB_ENV: "${TB_ENV:-TEST}"}  # D-639
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_ADAPTER_PORT:-8016}:8016"]
    volumes:  # test-only: a known site key so the harness can compute pids (production: TPM-sealed, in-box only)
      - ${TB_SETTINGS_FILE:-./settings.example.yaml}:/etc/trialbox/settings.yaml:ro
      - ${TB_SOURCE_DIR:-../tests/fixtures/synthetic_patients/site-a}:/data/source/site-a:ro
      - lake-data:/data/lake
      - audit-data:/data/audit
      - ../.cache/test-secrets:/run/secrets/trialbox
  embed-service:
    # ENG-002 (D-560): a synthetic stack says so. The base file leaves TB_ENV unset here, which is PRODUCTION, where
    # the stub embedder is refused (D-429): `make up-test` stopped on it for two nights
    environment: {TB_ENV: "${TB_ENV:-TEST}"}
    # ENG-003 (D-563): the hash embedder of a synthetic stack needs no library: the service image, not trialbox-embed
    image: ${TB_EMBED_IMAGE:-trialbox-py:1.0.0}
    build: {context: .., dockerfile: deploy/docker/python.Dockerfile}
  doc-parser:
    environment: {TB_DATA_CLASS: "${TB_DATA_CLASS:-D0}", TB_ENV: "${TB_ENV:-TEST}"}  # TB_ENV: D-639
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_PARSER_PORT:-8011}:8011"]
  criteria-compiler:
    networks: [trialbox-net, egress-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_COMPILER_PORT:-8012}:8012"]
    # TB_ENV TEST (D-640): the compiler seeds the shipped example rulesets only on a DEV or TEST box
    environment: {TB_CTGOV_MODE: cassette, TB_DATA_CLASS: "${TB_DATA_CLASS:-D0}",  # synthetic CT.gov (make_ctgov_cassettes)
                  TB_ENV: "${TB_ENV:-TEST}"}
  gateway:
    environment: {TB_ENV: "${TB_ENV:-TEST}"}
    networks: [trialbox-net, model-net, egress-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_GATEWAY_PORT:-8020}:8020"]
  db:   # host access for the outbox / recall-ledger Postgres tests (TB_PG_DSN, database trialbox_wf)
    networks: [trialbox-net, host-net]
    ports: ["127.0.0.1:${TB_HOST_WORKFLOW_DB_PORT:-5433}:5432"]
  # T-687 (D-471): the stub as the slow model stand-in of the scale gate when the shell asks for it (seconds per call,
  # an outage of 502 answers); unset, it answers at once as before
  llm-stub:
    environment: {TB_STUB_LATENCY_S: "${TB_STUB_LATENCY_S:-}", TB_STUB_OUTAGE_AFTER: "${TB_STUB_OUTAGE_AFTER:-}",
                  TB_STUB_OUTAGE_S: "${TB_STUB_OUTAGE_S:-}"}
volumes:
  objects-data:   # bind-mounted on the host so the integration tests read and write objects directly (D-121)
    driver: local
    driver_opts: {type: none, o: bind, device: "${TB_HOST_OBJECTS_DIR:-${PWD}/deploy/.objects}"}
networks:
  host-net:
    name: trialbox-hostnet
