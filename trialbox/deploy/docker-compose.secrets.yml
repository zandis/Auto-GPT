# Per-service secrets (D-128, review F-02; TB-PLAN-04 step 8, D-138). install.sh adds this file to every box:
#
#   docker compose --project-directory deploy -f deploy/docker-compose.yml -f deploy/docker-compose.secrets.yml \
#       [-f deploy/docker-compose.<gpu>.yml] --profile gpu up -d --wait
#
# * Each TrialBox service gets its own token, deploy/secrets/services/<service>.token (0600, made by
#   `trialbox secrets init`), mounted into that service only at /run/secrets/tb_service_token.
# * Every service reads the token registry (the sha256 of each token, not secret) from the mounted folder
#   deploy/secrets/services/public, and accepts only its own callers (tb_common.service_auth.CALLERS).
# * deploy/.env still reaches every TrialBox container through env_file (compose reads its settings there); the
#   names below clear what a service does not need (T-212d, D-450; OPS-057): the old shared token everywhere, the mail
#   passwords outside the mail gateway, the cloud-model keys and the local model servers' key (TB_LLM_API_KEY, D-177)
#   outside the gateway, the KEK passphrase and KMS token outside the two services that unwrap the site keys
#   (adapter, orchestrator), the EDC and REDCap API secrets outside the console and the orchestrator, and the host
#   tools' keys everywhere. The database passwords, and TB_DB_URL in the
#   services that never open it, are cleared in the base file itself (T-712, D-481).
#   tests/unit/test_compose_secret_reach.py renders every compose file set and fails when a secret reaches a service
#   that is not on its list.
# * The model servers' key (D-177) is the file deploy/secrets/model/llm.key (`trialbox secrets init`, rotated with
#   `secrets rotate --service model`; T-212b, D-437): a compose secret of the gateway and model-guard only
#   (TB_LLM_API_KEY_FILE); TB_LLM_API_KEY is cleared in every container here. vLLM has no *_FILE setting, so the vLLM
#   servers read it from their own env file deploy/secrets/model/vllm.env (VLLM_API_KEY, written with llm.key by
#   `trialbox secrets`; T-212d, D-450), in every compose file that defines them; not from deploy/.env.
# * The orchestrator alone mounts deploy/secrets/services/actor (the key that verifies the console's signed
#   X-TB-Actor-Assertion, review 2026-11-09 S-09, D-143): a token holder that is not the console cannot name a user.
#   The console alone mounts the signing key, deploy/secrets/services/actor-sign.key (T-717, D-485): a random
#   secret of its own, not a function of the console's token, which every service the console calls receives.
# Rotate with `sudo python3 -m tools.trialbox secrets rotate [--service X]` (RUNBOOK §5, "Secrets").

x-tokens: &tokens
  TB_SERVICE_TOKEN: ""
  TB_SERVICE_TOKEN_FILE: /run/secrets/tb_service_token
  TB_SERVICE_TOKENS: /etc/trialbox/service-tokens/tokens.json
  # the database passwords are cleared in the base file (docker-compose.yml, x-no-db-passwords; T-712, D-481): a
  # stack started without this overlay must not hold them either
  # the host tools' keys (bake-off, GPU profile, REDCap recording, demo, KEK re-key, acceptance mail, the
  # model-quality suites' key to the local model servers, H-113): no service
  TB_BAKEOFF_API_KEY: ""
  TB_LLM_EVAL_KEY: ""
  TB_GPU_KEY: ""
  TB_RC_CASSETTE_TOKEN: ""
  TB_DEMO_PASSWORD: ""
  TB_KEK_NEW_PASSPHRASE: ""
  TB_ACCEPTANCE_MAIL_PASSWORD: ""
  TB_ACCEPTANCE_MAIL_KEYSTORE_PASSWORD: ""

x-no-kek: &nokek   # the KEK's passphrase or KMS token: only the adapter and the orchestrator unwrap the site keys
  TB_KEK_PASSPHRASE: ""
  TB_KMS_TOKEN: ""

x-no-mail: &nomail
  IMAP_PASS: ""
  SMTP_PASS: ""

x-no-cloud: &nocloud
  CLOUD_LLM_API_KEY: ""
  OPENROUTER_API_KEY: ""   # the PoC's cloud route (docker-compose.poc.yml gives it to the gateway)
  TB_LLM_API_KEY: ""   # D-177: the local model servers' key, for the gateway only

# EDC and REDCap API secrets (D-1041, D-1042). The console receives events, signs in the EDC and calls tools.
# The console and the orchestrator read projects. Every other service holds none of these.
x-no-edc-door: &noedcdoor
  TB_EDC_EVENT_SECRET: ""
  TB_EDC_OIDC_CLIENT_SECRET: ""
  TB_EDC_TOOL_TOKEN: ""

x-no-edc: &noedc
  TB_EDC_EVENT_SECRET: ""
  TB_EDC_OIDC_CLIENT_SECRET: ""
  TB_EDC_TOOL_TOKEN: ""
  TB_EDC_INTERNAL_TOKEN: ""
  TB_REDCAP_API_TOKEN: ""
  TB_REDCAP_PROJECT_TOKENS: ""

x-registry: &registry ./secrets/services/public:/etc/trialbox/service-tokens:ro

services:
  lake:
    environment: {<<: [*tokens, *nomail, *nocloud, *nokek, *noedc]}
    secrets: [{source: token_lake, target: tb_service_token}]
    volumes: [*registry]
  embed-service:
    environment: {<<: [*tokens, *nomail, *nocloud, *nokek, *noedc]}
    secrets: [{source: token_embed-service, target: tb_service_token}]
    volumes: [*registry]
  doc-parser:
    environment: {<<: [*tokens, *nomail, *nocloud, *nokek, *noedc]}
    secrets: [{source: token_doc-parser, target: tb_service_token}]
    volumes: [*registry]
  criteria-compiler:
    environment: {<<: [*tokens, *nomail, *nocloud, *nokek, *noedc]}
    secrets: [{source: token_criteria-compiler, target: tb_service_token}]
    volumes: [*registry]
  adapter:
    environment: {<<: [*tokens, *nomail, *nocloud, *noedc]}
    secrets: [{source: token_adapter, target: tb_service_token}]
    volumes: [*registry]
  orchestrator:
    environment: {<<: [*tokens, *nomail, *nocloud, *noedcdoor], TB_ACTOR_KEYS_FILE: /etc/trialbox/actor/keys}
    secrets: [{source: token_orchestrator, target: tb_service_token}]
    volumes: [*registry, ./secrets/services/actor:/etc/trialbox/actor:ro]
  mail-gateway:
    environment: {<<: [*tokens, *nocloud, *nokek, *noedc]}
    secrets: [{source: token_mail-gateway, target: tb_service_token}]
    volumes: [*registry]
  gateway:
    environment: {<<: [*tokens, *nomail, *nokek, *noedc], TB_LLM_API_KEY: "", TB_LLM_API_KEY_FILE: /run/secrets/tb_llm_key}
    secrets: [{source: token_gateway, target: tb_service_token}, {source: model_key, target: tb_llm_key}]
    volumes: [*registry]
  model-guard:   # profile gpu (docker-compose.yml): the key from the file, not from deploy/.env (D-437)
    environment: {<<: *noedc, TB_LLM_API_KEY: "", TB_LLM_API_KEY_FILE: /run/secrets/tb_llm_key}
    secrets: [{source: model_key, target: tb_llm_key}]
  console:   # T-717 (D-485): the one service that signs people, with a key of its own (never its token)
    environment: {<<: [*tokens, *nomail, *nocloud, *nokek], TB_ACTOR_SIGN_KEY_FILE: /run/secrets/tb_actor_sign_key}
    secrets: [{source: token_console, target: tb_service_token}, {source: actor_sign_key, target: tb_actor_sign_key}]
    volumes: [*registry]
  audit-writer:   # D-394: serves no HTTP and calls no service, so no token; it reads the journal, writes the chain
    environment: {<<: [*tokens, *nomail, *nocloud, *nokek, *noedc]}
  llm-stub:   # profile stub: a stand-in for vLLM, no token, no database, no secret (D-450)
    environment: {<<: [*tokens, *nomail, *nocloud, *nokek, *noedc], TB_SERVICE_TOKEN_FILE: "", TB_SERVICE_TOKENS: ""}

secrets:
  token_lake: {file: ./secrets/services/lake.token}
  token_embed-service: {file: ./secrets/services/embed-service.token}
  token_doc-parser: {file: ./secrets/services/doc-parser.token}
  token_criteria-compiler: {file: ./secrets/services/criteria-compiler.token}
  token_adapter: {file: ./secrets/services/adapter.token}
  token_orchestrator: {file: ./secrets/services/orchestrator.token}
  token_mail-gateway: {file: ./secrets/services/mail-gateway.token}
  token_gateway: {file: ./secrets/services/gateway.token}
  token_console: {file: ./secrets/services/console.token}
  model_key: {file: ./secrets/model/llm.key}
  actor_sign_key: {file: ./secrets/services/actor-sign.key}
