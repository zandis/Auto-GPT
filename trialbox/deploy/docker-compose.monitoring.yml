# Monitoring (T-209a, D-379; review OPS-027): Prometheus on the box, scraping the console's /metrics, with the
# health thresholds as alert rules. Optional; the health line in the morning mail and the daily health mail work
# without it. Add it after the base file and the secrets overlay:
#
#   sudo python3 -m tools.trialbox ops metrics-token     # once: deploy/secrets/metrics.token (never printed)
#   docker compose --project-directory deploy -f deploy/docker-compose.yml -f deploy/docker-compose.secrets.yml \
#       -f deploy/docker-compose.monitoring.yml up -d --wait
#
# (or append it to COMPOSE_FILE in deploy/.env). RUNBOOK "Box health and monitoring" has the steps.
#
# * Prometheus listens on the box's loopback only (TB_PROMETHEUS_BIND, TB_PROMETHEUS_PORT); hospital IT reaches it
#   over SSH or points its own Prometheus at the console's /metrics with the same token.
# * /metrics carries ages, counts and percentages only: no patient, no user name. The token is the only key it needs.
# * The data stays 30 days or 2 GB in the prometheus-data volume; it is not part of the backup (nothing to restore).

services:
  console:
    environment:
      TB_METRICS_TOKEN_FILE: /run/secrets/tb_metrics_token
    volumes:
      - ./secrets/metrics.token:/run/secrets/tb_metrics_token:ro

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996}
    restart: unless-stopped
    init: true
    networks: [trialbox-net]
    logging: {driver: json-file, options: {max-size: "50m", max-file: "5"}}
    mem_limit: ${TB_MEM_PROMETHEUS:-512m}
    pids_limit: 256
    labels: {tb.watchdog: restart}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=:9090
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - ./secrets/metrics.token:/etc/prometheus/metrics.token:ro
      - prometheus-data:/prometheus
    ports: ["${TB_PROMETHEUS_BIND:-127.0.0.1}:${TB_PROMETHEUS_PORT:-9090}:9090"]
    depends_on:
      console: {condition: service_started}

volumes:
  prometheus-data:
