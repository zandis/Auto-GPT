# pgBackRest for the box's one PostgreSQL server (WS-08.6, D-187; RUNBOOK §5 "Point-in-time restore").
# Mounted read-only into the db container at /etc/pgbackrest/pgbackrest.conf. The repository is
# /var/lib/pgbackrest in the container: TB_PGBACKREST_REPO on the host, which must be the hospital share (off-box).
# The repository is encrypted: repo1-cipher-pass is NOT here. It is in deploy/secrets/pgbackrest/cipher.conf
# (0600, owned by the container's postgres user, mounted at /etc/pgbackrest/conf.d), and hospital IT keeps a copy
# with the backup key: without it the repository cannot be read.
# Schedule: a full backup weekly and a differential nightly (`trialbox backup-nightly`), WAL archived continuously
# (archive_command in deploy/docker-compose.yml), so the database restores to any second inside the retention.

[global]
repo1-path=/var/lib/pgbackrest
repo1-type=posix
repo1-cipher-type=aes-256-cbc
# two full backups and their differentials and WAL: about two weeks of point-in-time restore
repo1-retention-full-type=count
repo1-retention-full=2
repo1-retention-diff=7
# CPU zstd, as everywhere on the box (dataflow review §7.3, D-149)
compress-type=zst
compress-level=3
process-max=4
start-fast=y
archive-check=y
# logs name files and WAL segments, never rows; the file log stays off (the container's own log is enough)
log-level-console=warn
log-level-stderr=warn
log-level-file=off

[trialbox]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=hapi
