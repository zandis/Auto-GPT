# The site's host baseline (T-634, D-408). Copy to deploy/site/hardening.conf (the site's own file: an update never
# replaces it) and fill it in with hospital IT. Shell syntax, read by deploy/hardening/*.sh and ospatch.py; values
# only, no secret goes here. The ranges below are documentation ranges (RFC 5737), not a real network.

# 443 (the console) answers only from these ranges: the clinic and office networks, space separated, IPv4 or IPv6
CLINIC_RANGES="192.0.2.0/24 198.51.100.0/24"
# SSH: off (the service is stopped and disabled) or it (port 22 from IT_RANGES only, keys only, no root login)
SSH=off
IT_RANGES="203.0.113.0/28"

# Where the KEK of the site keys lives (D-347, D-408): tpm (default: a host+TPM2 sealed systemd credential, opened at
# boot by trialbox-unseal.service; the disk itself opens only in the hospital), shamir (stewards' shares on removable
# media; the box needs two stewards after every restart), passphrase (typed at every restart; the install takes it from
# --kek-passphrase-file, a file only root can read, or --kek-passphrase-stdin, never from the environment: H-96)
KEK_BACKEND=tpm
# shamir only: where the share files are written (removable media, never the box's disk)
KEK_SHARES_OUT=""

# Disk unlock (deploy/hardening/disk-unlock.sh): the hospital's Tang servers. The LUKS volume opens at boot only when
# the TPM of this board AND one of these servers answer, so a moved disk, or the whole box off the hospital network,
# asks for the recovery passphrase (kept in the hospital's sealed envelope)
TANG_URLS="http://tang1.hospital.invalid"

# After an OS patch bundle (tools/apply_update.sh ospatch): the commands that must pass. Default: doctor and the
# orchestrator's selftest (the canary of RUNBOOK §24)
# CANARY_CMD="python3 -m tools.trialbox doctor --env-file deploy/.env && docker compose --project-directory deploy exec -T orchestrator python -m orchestrator.selftest"
