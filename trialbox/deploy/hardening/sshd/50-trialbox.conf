# TrialBox SSH baseline (deploy/hardening/apply.sh with SSH=it; T-634, D-408). Port 22 answers only from IT_RANGES
# (the input firewall); here: keys only, no root, no forwarding, short logins. Generated from the release: change the
# site's choice in deploy/site/hardening.conf, not this file.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
AuthenticationMethods publickey
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
