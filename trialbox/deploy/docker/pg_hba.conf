# The box's database access file (P2-06, ASSESS-1-ADDENDUM D3/D4). deploy/docker-compose.yml mounts it read-only and
# names it with hba_file on every start, so it holds on a new volume and on an old one alike (the file initdb wrote in
# the volume is no longer read). No line says trust.
# * local: the server's own socket, in the db container's tmpfs (mode 0770, owner postgres): only a process inside
#   that container reaches it, which is `docker exec db ...` from the host's tools (backup, update, secrets, doctor).
#   They run as postgres (uid 999, the container's user); peer checks that, and the map lets it name its role.
# * hostssl: every TCP client (the services, the FHIR store, the backup container) with its role's password, over
#   TLS; a client that refuses TLS is refused. There is no plain `host` line.
# TYPE   DATABASE  USER  ADDRESS  METHOD
local    all       all            peer map=tb_local
hostssl  all       all   all      scram-sha-256
