    reason: The JRE ships unmodified; the Classpath exception covers the jars run on it; listed in the notices
    review_by: 2027-05-01
  # From the trialbox-embed image (ENG-003, D-563): wheels whose metadata has no licence field, so Syft reads
  # none. The licence is the one the wheel's own files state (read in the built image, 2026-11-12).
  - package: markdown-it-py
    class: unknown
