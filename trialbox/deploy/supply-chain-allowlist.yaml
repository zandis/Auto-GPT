    package: stdlib
    image: authelia/authelia
    reason: "Not reachable: the flaw is in net/http's file serving (FileServer, ServeContent, ServeFile); none of them, nor net/http's server, is in the Authelia binary, which serves with fasthttp"
    review_by: 2026-12-10
    owner: security owner (to assign)
  - id: CVE-2026-97031
    package: stdlib
    image: authelia/authelia
    reason: "Not reachable: the flaw is in the TLS server handshake (ECH); on the box Authelia listens in plain HTTP on tcp://0.0.0.0:9091 inside trialbox-net with no server.tls, and Caddy ends TLS; Authelia accepts no TLS connection"
    review_by: 2026-12-10
    owner: security owner (to assign)
  - id: CVE-2026-97054
    package: stdlib
    image: authelia/authelia
    reason: "Not reachable: the race is in net/http's HTTP/1 server response when MaxBytesReader trips; net/http's server and its response type are not in the Authelia binary (fasthttp serves), so MaxBytesReader there has no such response to mark"
    review_by: 2026-12-10
    owner: security owner (to assign)

licences:
  # The eight LGPL packages of the layer-2 review (docs/reviews/2026-11-09-component-review-layer2-verification.md
  # section 3). Installed unmodified from PyPI wheels into images the hospital controls; the library can be
  # replaced; the licence texts go in THIRD_PARTY_NOTICES (WS-14.6). Never vendor or patch them.
  - package: psycopg
    class: lgpl
    reason: LGPL-3.0-only; used unmodified as an installed package, replaceable, licence text shipped in the notices
    review_by: 2027-05-01
  - package: psycopg-binary
    class: lgpl
    reason: LGPL-3.0-only; unmodified wheel (bundles libpq and OpenSSL under their own permissive licences); notices
    review_by: 2027-05-01
  - package: docxtpl
    class: lgpl
    reason: LGPL-2.1-only; used unmodified as an installed package, replaceable, licence text shipped in the notices
    review_by: 2027-05-01
  - package: py7zr
    class: lgpl
    reason: LGPL-2.1-or-later; unmodified; 7z attachments only; goes away if R-12 replaces attachments with links
    review_by: 2027-05-01
  - package: pybcj
    class: lgpl
    reason: LGPL-2.1-or-later; unmodified dependency of py7zr; goes away with py7zr (R-12); notices
