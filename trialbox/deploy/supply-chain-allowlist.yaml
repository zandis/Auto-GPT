    reason: Reads the embedder's weights; the wheel ships the Apache-2.0 text and names it only in a classifier
    review_by: 2027-05-01
  - package: tokenizers
    class: unknown
    licence: Apache-2.0 (trialbox-embed; the wheel's classifier, the publisher's repository LICENSE)
    reason: The embedder's tokenizer; the wheel names Apache-2.0 only in a classifier and ships no licence file
    review_by: 2027-05-01

# Licence budgets: open licence flags counted per image and ecosystem (tools/supply_chain/licences.py evaluate). A
# count above its budget fails, so every new component is reviewed; when a count drops, lower the budget.
budgets:
  # trialbox-postgres (T-110b): gosu and its Go modules in the postgres:16-trixie base, Syft reads no licence from a
  # Go binary (gosu is Apache-2.0, its modules BSD-3-Clause and Apache-2.0)
  - image: trialbox-postgres
    ecosystem: golang
    max: 3
    reason: gosu and its Go modules from the official postgres base image, counted because Go binaries carry no licence data
    review_by: 2027-02-01
  # trialbox-backup (PERF-010, D-968): restic and its Go modules, built from source in the nightly backup's own image.
  # The owner's yes of 2026-11-16 (D-1038) is for this licence count only, at most 86; it is no vulnerability waiver.
  - image: trialbox-backup
    ecosystem: golang
    max: 86
    reason: restic and its Go modules, built from source; Syft reads no licence from a Go binary (restic BSD-2-Clause; module licences listed in dist/sbom/licences.md); D-1038
    review_by: 2027-02-01
  # Our images: Syft reads no licence from most jars (pom.properties only), so they are counted, not named.
  # The jars are the HL7 validator and the CQL translator with their dependencies (tools/fetch_jvm_deps.sh).
  - image: trialbox-jvm
    ecosystem: maven
    # 71 since T-672: HL7 FHIR core 6.9.12 brings okhttp-jvm 5.3.2, okio 3.16.4 and okio-jvm 3.16.4 (Apache-2.0 in
    # their Maven Central poms; Syft reads no licence from the jars)
