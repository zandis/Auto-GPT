  # Authelia, the hospital-account sign-in (identity overlay, profile oidc; off unless TB_OIDC_ENABLED=1). Same ruling,
  # with the owner's condition for the login front: each entry says why the finding is not reachable in how the box
  # runs Authelia. The facts they rest on (D-574): it listens in plain HTTP/1 on 9091 inside trialbox-net with no
  # published port and no server.tls; only Caddy and the console reach it; its one outbound connection is LDAPS to
  # the hospital's directory (egress rules); and the named code is or is not in the binary of the pinned image,
  # checked on 2026-11-12. No fixed upstream image exists (4.39.28 is the newest). CVE-2026-111943 (crypto/x509) has
  # NO entry: it cannot be argued unreachable (the LDAPS client verifies certificates) and is with the owner.
