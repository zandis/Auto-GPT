  # Authelia, the hospital-account sign-in (identity overlay, profile oidc; off unless TB_OIDC_ENABLED=1). Same ruling,
  # with the owner's condition for the login front: each entry says why the finding is not reachable in how the box
  # runs Authelia. The facts they rest on (D-574): it listens in plain HTTP/1 on 9091 inside trialbox-net with no
  # published port and no server.tls; only Caddy and the console reach it; the only outbound connection the egress
  # rules allow it is LDAPS to the hospital's directory (its start-up time check is blocked); and the named code is or is not in the binary of the pinned image,
  # checked on 2026-11-12. No fixed upstream image exists (4.39.28 is the newest). CVE-2026-111943 (crypto/x509) was
  # reachable through the LDAPS client's public roots; since D-722 (AUTHELIA-CA) the container's root list is the
  # hospital's directory CA only, and by the owner's yes of 2026-11-15 its entry is "not reachable" like the others
  # (D-820).
  - id: CVE-2026-111943
    package: stdlib
    image: authelia/authelia
    reason: "Not reachable: for the image pinned at sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54, the container's root list is the hospital's directory CA only (TB_LDAP_CA, D-722): SSL_CERT_FILE names that file and SSL_CERT_DIR a path nothing is mounted at, so no public root or intermediate can chain to a trusted root on the one certificate check Authelia makes (LDAPS to the hospital's directory). A PRODUCTION or VALIDATION box with the hospital sign-in on does not start without a usable file (pre-start, doctor ldap_ca); with it off Authelia makes no LDAPS connection"
    review_by: 2026-12-10
    owner: security owner (to assign)
