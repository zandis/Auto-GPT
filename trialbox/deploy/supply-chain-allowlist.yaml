# Supply-chain allow-list (D-186). The pip-audit, Trivy and licence gates fail on a finding unless an entry here
# accepts it. Format and rules: tools/supply_chain/allowlist.py. Checked by `make allowlist-check` (CI):
#   - every entry has a reason of at least 20 characters that a reviewer can check;
#   - every entry has review_by (YYYY-MM-DD), at most 180 days ahead; once it passes, the gates fail until the
#     entry is reviewed (new date and reason) or removed;
#   - a vulnerability entry names one package and matches its id or any alias (CVE, GHSA, PYSEC);
#   - a licence entry matches a package and one flag: lgpl, gpl, agpl, unknown (records the licence a person
#     verified in `licence`) or dual (names the permissive branch taken in `chosen`); every flag of a package
#     needs its own entry, so a stricter licence (LGPL to GPL) fails again;
#   - a key given twice, or a list given as anything else, is refused.
# Change this file in a pull request the security owner approves.

