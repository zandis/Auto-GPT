# An image whose OS package list the scanner cannot read (tools/supply_chain/allowlist.py, D-574). The owner's ruling
# of 2026-11-12: one dated entry per image, by name; no blanket rule. The image's other packages are gated as always,
# and an entry for an image that has become readable is refused.
os_packages_unreadable:
  - image: authelia/authelia
    reason: The pinned image (a cut-down Ubuntu 26.04) ships no package database, so Trivy reads no OS package; its Go binary is scanned and gated, and Syft's SBOM lists the 13 Debian packages it finds
    review_by: 2026-12-10
    owner: security owner (to assign)
