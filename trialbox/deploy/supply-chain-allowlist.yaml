    image: authelia/authelia
    reason: "Not reachable: the advisory is for golang.org/x/crypto/openpgp, and that package is not in the Authelia binary (no openpgp symbol; the binary links bcrypt, chacha20, cryptobyte, hkdf, md4, ocsp only)"
