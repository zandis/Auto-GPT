  # No licence the report can read from the SBOM (no field, a hash of the text, or a free name). Each was read in
  # the installed metadata and licence file of the locked version on 2026-11-09.
  - package: duckdb
    class: unknown
    licence: MIT (classifier "MIT License"; dist-info/licenses/LICENSE is the MIT text)
    reason: Permissive licence verified in the wheel; the SBOM carries no licence field for it
    review_by: 2027-05-01
  - package: jinja2
    class: unknown
    licence: BSD-3-Clause (classifier "BSD License"; dist-info/licenses/LICENSE.txt is the 3-clause text)
    reason: Permissive licence verified in the wheel; the SBOM carries no licence field for it
    review_by: 2027-05-01
  - package: kiwisolver
    class: unknown
    licence: BSD-3-Clause ("Modified BSD License" in dist-info/licenses/LICENSE; classifier "BSD License")
    reason: Permissive licence verified in the wheel; the SBOM gives only a hash of the licence text
    review_by: 2027-05-01
  - package: matplotlib
    class: unknown
    licence: Matplotlib licence, PSF-based (classifier "Python Software Foundation License"); bundled DejaVu and STIX fonts under their own font licences
    reason: Permissive licence verified in the wheel; the SBOM gives only a hash of the licence text
    review_by: 2027-05-01
  - package: pycryptodomex
    class: unknown
    licence: BSD-2-Clause and public domain (LICENSE.rst; classifiers "BSD License", "Public Domain")
    reason: Permissive licence and public-domain parts verified in the wheel; "BSD, Public Domain" is not an SPDX id
    review_by: 2027-05-01
  # From the python:3.12-slim base image (Syft scan of the pinned digest, both platforms, 2026-11-09).
  - package: python
    class: unknown
    licence: PSF-2.0 (the CPython interpreter of the official python image, /usr/local/bin/python3.12)
    reason: The interpreter of the base image, unmodified; Syft finds the binary but no licence field
    review_by: 2027-05-01
  - package: Simple Launcher
    class: unknown
    licence: PSF-2.0 / distlib (pip/_vendor/distlib/t32.exe etc.; Windows launchers vendored by pip)
    reason: Windows .exe launchers inside pip in the base image; never run on Linux; licence of distlib
    review_by: 2027-05-01
  - package: reportlab
