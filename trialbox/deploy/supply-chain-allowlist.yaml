  - image: caddy
    ecosystem: "*"
    max: 148
    reason: Official Caddy image unmodified (Apache-2.0 project); Go modules of its binary carry no licence data for Syft (D-574)
    review_by: 2027-02-01
  - image: authelia/authelia
    ecosystem: "*"
    max: 88
    reason: Authelia image unmodified (Apache-2.0 project); Go modules of its binary carry no licence data for Syft (D-574)
    review_by: 2027-02-01
  - image: greenmail/standalone
    ecosystem: "*"
    max: 36
    reason: GreenMail test mail server image unmodified (Apache-2.0 project); test and POC profiles only
