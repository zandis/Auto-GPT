# NVIDIA GB10 (DGX Spark class, aarch64, 128 GB unified memory) override: the medium tier (TB-PLAN-04 step 1, D-124).
#
#   cd deploy && docker compose -f docker-compose.yml -f docker-compose.gb10.yml --profile gpu up -d --wait
#   deploy/install.sh <bundle> --mode gpu            # auto-detected on aarch64 (deploy/gpu_profile.sh)
#
# The measured pair of every TrialBox box (D-95, D-124): llm-service serves the judge (j-workhorse: Gemma 4 26B-A4B-it
# NVFP4) and llm-verifier the verifier (v-verifier: Qwen3.5-9B AWQ 4-bit, thinking off), both resident (no sleep
# mode, TB_MODEL_SWAP=off) at 16k context; a note criterion excludes a patient only when both agree. gpt-oss-120b
# is no longer the Spark judge (TB-PLAN-04 §3: the 2026-11-08 measurements chose this pair). Pin the weights first
# (tools/pin_model.py, builds gemma-4-26b-a4b-it-spark on endpoint `serving`, qwen3.5-9b-spark on `verifier`) or the
# gateway routes nothing to them. Knobs: JUDGE_MODEL_DIR, JUDGE_MODEL, VERIFIER_MODEL_DIR, VERIFIER_MODEL.
#
# Unified-memory budget (128 GB shared by CPU and GPU). Not measured on a Spark: the Spark is measured only when a
# site orders one (owner decision 4, 2026-11-08), and install.sh starts this profile only on a record from
# tools/serving_config.py measured gb10, or with TB_ACCEPT_UNMEASURED_GPU=1 for that first boot.
#   llm-service   JUDGE_GPU_MEM_UTIL 0.30     weights 17.1 GiB + KV at 16k
#   llm-verifier  VERIFIER_GPU_MEM_UTIL 0.15  weights 7.5 GiB + KV at 16k
#   rest (~55%)                               OS, HAPI (HAPI_XMX 6g), Postgres, DuckDB, embedder, services
# vLLM sizes its pool as a fraction of the whole device and checks free memory at start, so llm-verifier starts only
# after llm-service is healthy.
#
# Host prerequisites (deploy/check_host.sh --gb10 checks them):
#   * NVIDIA driver 580.142 exactly. Hold the package (apt-mark hold); the later 580.x builds regress vLLM on GB10
#     (see the SPEC reference "GB10 driver regression note"). Do not take driver updates outside a signed update bundle.
#   * nvidia-container-toolkit; Docker Engine 27+; cgroup v2.
#   * TrialBox images built multi-arch (make images-multiarch) or arm64 (make images PLATFORM=linux/arm64).
#
# Every third-party image is pinned by digest. The pins below are multi-arch indexes (arm64 included) or arm64
# manifests. Unified memory is shared with HAPI, DuckDB and the embedder, so vLLM takes a smaller fraction than on
# a discrete 32 GB GPU.
x-arm: &arm
  platform: linux/arm64

services:
  llm-service:
    <<: *arm
    # GB10 build of vLLM (aarch64, CUDA 13, sm_121). Station release 2026-10-01, arm64 manifest digest.
    image: ${VLLM_GB10_IMAGE:-eugr/spark-vllm:station-20261001@sha256:f5700fdbb43e1bb254d8a559505ce95e4f8c0b8ba9d666f7ed1b5e25bf8c4d82}
    entrypoint: ["vllm", "serve"]
    command:
      - /models/${JUDGE_MODEL_DIR:-gemma-4-26b-a4b-it-4bit}
      - --served-model-name=${JUDGE_MODEL:-local/gemma-4-26b-a4b-nvfp4}
      - --max-model-len=${JUDGE_MAX_LEN:-16384}
      - --max-num-seqs=${JUDGE_MAX_SEQS:-8}
      - --enforce-eager
      - --gpu-memory-utilization=${JUDGE_GPU_MEM_UTIL:-0.30}
      - --limit-mm-per-prompt={"image":0,"audio":0,"video":0}
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_API_KEY: "${TB_LLM_API_KEY:-}"   # D-177: vLLM checks it on /v1 only; model-guard checks every call
    healthcheck:
      start_period: 600s  # first load from NVMe into unified memory

  llm-verifier:
    <<: *arm
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}
    profiles: [gpu]
    image: ${VLLM_GB10_IMAGE:-eugr/spark-vllm:station-20261001@sha256:f5700fdbb43e1bb254d8a559505ce95e4f8c0b8ba9d666f7ed1b5e25bf8c4d82}
    entrypoint: ["vllm", "serve"]
    command:
      - /models/${VERIFIER_MODEL_DIR:-qwen3.5-9b-4bit}
      - --served-model-name=${VERIFIER_MODEL:-local/qwen3.5-9b-awq}
      - --max-model-len=${VERIFIER_MAX_LEN:-16384}
      - --max-num-seqs=${VERIFIER_MAX_SEQS:-8}
      - --enforce-eager
      - --gpu-memory-utilization=${VERIFIER_GPU_MEM_UTIL:-0.15}
      - --limit-mm-per-prompt={"image":0,"video":0}
      - --default-chat-template-kwargs={"enable_thinking":false}
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_API_KEY: "${TB_LLM_API_KEY:-}"   # D-177: vLLM checks it on /v1 only; model-guard checks every call
    volumes: ["${TB_MODELS_DIR:-./models}:/models:ro"]
    ipc: host
    networks: {model-backend-net: {aliases: [llm-verifier-vllm]}}   # behind model-guard (D-177)
    restart: unless-stopped
    depends_on:
      llm-service: {condition: service_healthy}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 900s

  # TrialBox services: the same images, arm64 variant (multi-arch tag or the local arm64 build).
  mail-gateway: *arm
  orchestrator:
    <<: *arm
    environment:
      TB_MODEL_SWAP: "off"   # one pass per run with both models (orchestrator/twophase.py)
      TB_SCREEN_LLM_CONCURRENCY: "${JUDGE_MAX_SEQS:-8}"   # SCREEN calls in flight: vLLM --max-num-seqs (D-142)
  criteria-compiler: *arm
  adapter: *arm
  lake: *arm
  embed-service:
    <<: *arm
    environment:
      TB_EMBED_DEVICE: ${TB_EMBED_DEVICE:-cuda}  # bge-m3 on the GPU; falls back to CPU when CUDA is absent
  doc-parser: *arm
  gateway:
    <<: *arm
    environment:
      TB_MODEL_SWAP: "off"   # both resident (services/gateway/swap.py)
      TB_PROFILE: P-GB10
  llm-stub: *arm
  model-guard: *arm
  # Third-party services: multi-arch digests from docker-compose.yml resolve to their arm64 manifests here.
  db: *arm
  fhir-store:
    <<: *arm
    environment:
      # same flags as the base file; explicit heap so HAPI does not size itself from the 128 GB of unified memory
      JAVA_TOOL_OPTIONS: "-Xmx${HAPI_XMX:-6g} -Duser.timezone=${TB_TZ:?set TB_TZ in deploy/.env to site.tz (D-315)}"
