# NVIDIA GB10 (DGX Spark class, aarch64, 128 GB unified memory) override: the medium tier (TB-PLAN-04 step 1, D-124).
#
#   cd deploy && docker compose -f docker-compose.yml -f docker-compose.gb10.yml --profile gpu up -d --wait
#   deploy/install.sh <bundle> --mode gpu            # auto-detected on aarch64 (deploy/gpu_profile.sh)
#
# The measured pair of every TrialBox box (D-95, D-124): llm-service serves the judge (j-workhorse: Gemma 4 26B-A4B-it
# NVFP4) and llm-verifier the verifier (v-verifier: Qwen3.5-9B AWQ 4-bit, thinking off), both resident (no sleep
# mode, TB_MODEL_SWAP=off) at 16k context; a note criterion excludes a patient only when both agree. gpt-oss-120b
# is no longer the Spark judge (TB-PLAN-04 §3: the 2026-11-08 measurements chose this pair). Pin the weights first
# (tools/pin_model.py, builds gemma-4-26b-a4b-it-spark on endpoint `serving`, qwen3.5-9b-spark on `verifier`) or the
# gateway routes nothing to them. Knobs: JUDGE_MODEL_DIR, JUDGE_MODEL, JUDGE_CHAT_TEMPLATE, VERIFIER_MODEL_DIR, VERIFIER_MODEL.
#
# Unified-memory budget (128 GB shared by CPU and GPU). Not measured on a Spark: the Spark is measured only when a
# site orders one (owner decision 4, 2026-11-08), and install.sh starts this profile only on a record from
# tools/serving_config.py measured gb10, or with TB_ACCEPT_UNMEASURED_GPU=1 for that first boot. The verifier's share,
# the adapter's and the orchestrator's caps were measured on a B200 with GB10-like limits; the rest are planning values.
#   llm-service   JUDGE_GPU_MEM_UTIL 0.30     weights 17.1 GiB + KV at 16k
#   llm-verifier  VERIFIER_GPU_MEM_UTIL 0.12  15.36 GiB: the model 7.8 GiB with overhead; its KV cache held about
#                                             804k tokens in 26 GiB, so 8 sequences x 16k (131k tokens) need about
#                                             4.3 GiB of KV, about 12.1 GiB in all (measured on a B200)
#   rest (~55%)                               OS, HAPI (HAPI_XMX 6g), Postgres, DuckDB, embedder, services
# vLLM sizes its pool as a fraction of the whole device and checks free memory at start, so llm-verifier starts only
# after llm-service is healthy.
# Every service has a memory limit (mem_limit, GiB), so no one service can starve the models of unified memory
# (OPS-063). The limits are deploy/gb10-profile.yaml's, unmeasured on a Spark until a Spark run records each peak
# (D-373);
# tests/unit/test_two_device_config.py keeps the two equal. The two-device form: deploy/two-device/ (T-214).
#
# Host prerequisites (deploy/check_host.sh --gb10 checks them):
#   * NVIDIA driver 580.142 exactly. Hold the package (apt-mark hold); the later 580.x builds regress vLLM on GB10
#     (see the SPEC reference "GB10 driver regression note"). Do not take driver updates outside a signed update bundle.
#     The hold is dated and re-tested every 28 days on the bench Spark (D-373, deploy/gb10-profile.yaml driver_hold).
#   * nvidia-container-toolkit; Docker Engine 27+; cgroup v2.
#   * TrialBox images built multi-arch (make images-multiarch) or arm64 (make images PLATFORM=linux/arm64).
#
# Limits (T-108a, D-360): the base file's caps hold here too; a cap counts the host side of unified memory a
# container maps, so the vLLM caps (TB_MEM_LLM, TB_MEM_VERIFIER, 48g each) leave room for the weights' page cache.
# Not measured on a Spark (T-214 measures them).
#
# Every third-party image is pinned by digest in deploy/images.lock (D-348). The pins are multi-arch indexes that
# include arm64. Unified memory is shared with HAPI, DuckDB and the embedder, so vLLM takes a smaller fraction than on
# a discrete 32 GB GPU.
x-arm: &arm
  platform: linux/arm64

services:
  llm-service:
    <<: *arm
    mem_limit: 42g   # deploy/gb10-profile.yaml (unmeasured, D-373)
    # D-348: the official vLLM release of every profile (deploy/images.lock), its arm64 manifest. Built for CUDA 13 and
    # sm_120, which runs on the GB10's sm_121 (check_host.sh --gb10 checks the device and the driver against the lock).
    # It replaced a community build for the DGX Station (sm_103a, DEP-003). To be confirmed on a Spark (T-214).
    image: ${VLLM_GB10_IMAGE:-vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34}
    entrypoint: ["vllm", "serve"]
    command:
      - /models/${JUDGE_MODEL_DIR:-gemma-4-26b-a4b-it-4bit}
      - --served-model-name=${JUDGE_MODEL:-local/gemma-4-26b-a4b-nvfp4}
      # the developer's chat template at a pinned revision, not the quantised folder's (DEP-007, D-392)
      - --chat-template=/models/${JUDGE_CHAT_TEMPLATE:-chat-templates/gemma-4-26b-a4b-it/chat_template.jinja}
      - --chat-template-content-format=string  # D-880: strings, as the template's string path renders them
      - --max-model-len=${JUDGE_MAX_LEN:-16384}
      - --max-num-seqs=${JUDGE_MAX_SEQS:-8}
      - --enforce-eager
      - --gpu-memory-utilization=${JUDGE_GPU_MEM_UTIL:-0.30}
      - --${TB_LLM_PREFIX_CACHING:-no-enable}-prefix-caching   # H-146 (D-1462): off unless chosen
      - --limit-mm-per-prompt={"image":0,"audio":0,"video":0}
    # D-177 / D-450: VLLM_API_KEY from the vLLM servers' own env file (`trialbox secrets` writes it with
    # secrets/model/llm.key); vLLM checks it on /v1 only, model-guard on every call. Never from deploy/.env. A box
    # without the file runs the server open behind model-guard, and doctor --serving (install, update) FAILs it.
    env_file: [{path: ./secrets/model/vllm.env, required: false}]
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_LOGGING_LEVEL: WARNING   # no request or prompt lines in the log at any vLLM version (T-605, LLM-042)
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    healthcheck:
      start_period: 600s  # first load from NVMe into unified memory

  llm-verifier:
    <<: *arm
    # H-58 (D-1337): no privilege gain, as llm-service (the same image); read_only, user and cap_drop are written
    # exceptions with llm-service's reasons (H10G1-02)
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${TB_MEM_VERIFIER:-27g}   # deploy/gb10-profile.yaml (the 0.12 share + the host process; D-373)
    logging:
      driver: json-file
      options: {max-size: "${TB_LOG_MAX_SIZE:-100m}", max-file: "${TB_LOG_MAX_FILE:-10}"}  # D-389
    profiles: [gpu]
    image: ${VLLM_GB10_IMAGE:-vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34}
    entrypoint: ["vllm", "serve"]
    command:
      - /models/${VERIFIER_MODEL_DIR:-qwen3.5-9b-4bit}
      - --served-model-name=${VERIFIER_MODEL:-local/qwen3.5-9b-awq}
      - --max-model-len=${VERIFIER_MAX_LEN:-16384}
      - --max-num-seqs=${VERIFIER_MAX_SEQS:-8}
      - --enforce-eager
      # 0.12 of 128 GiB = 15.36 GiB: the model 7.8 GiB with overhead + about 4.3 GiB of KV for 8 x 16k (131k tokens,
      # from about 804k tokens in 26 GiB), about 12.1 GiB, with margin (deploy/gb10-profile.yaml)
      - --gpu-memory-utilization=${VERIFIER_GPU_MEM_UTIL:-0.12}
      - --${TB_LLM_PREFIX_CACHING:-no-enable}-prefix-caching   # H-146 (D-1462): off unless chosen
      - --limit-mm-per-prompt={"image":0,"video":0}
      - --default-chat-template-kwargs={"enable_thinking":false}
    # D-177 / D-450: VLLM_API_KEY from the vLLM servers' own env file (`trialbox secrets` writes it with
    # secrets/model/llm.key); vLLM checks it on /v1 only, model-guard on every call. Never from deploy/.env. A box
    # without the file runs the server open behind model-guard, and doctor --serving (install, update) FAILs it.
    env_file: [{path: ./secrets/model/vllm.env, required: false}]
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      VLLM_LOGGING_LEVEL: WARNING   # no request or prompt lines in the log at any vLLM version (T-605, LLM-042)
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes: ["${TB_MODELS_DIR:-./models}:/models:ro"]
    ipc: host
    networks: {model-backend-net: {aliases: [llm-verifier-vllm]}}   # behind model-guard (D-177)
    restart: unless-stopped
    pids_limit: 4096
    labels: {tb.watchdog: restart}   # the host's watchdog restarts a hung server (OPS-029)
    depends_on:
      llm-service: {condition: service_healthy}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 900s

  # TrialBox services: the same images, arm64 variant (multi-arch tag or the local arm64 build).
  mail-gateway: {<<: *arm, mem_limit: 1g}
  orchestrator:
    <<: *arm
    # deploy/gb10-profile.yaml: a 48,000-patient SCREEN peaked near 4.0 GiB (the machine-profile finding); memcaps
    # (install.sh --overlay) writes TB_MEM_ORCH only above this, for a larger hospital
    mem_limit: ${TB_MEM_ORCH:-6g}
    environment:
      TB_MODEL_SWAP: "off"   # one pass per run with both models (orchestrator/twophase.py)
      TB_SCREEN_LLM_CONCURRENCY: "${JUDGE_MAX_SEQS:-8}"   # SCREEN calls in flight: vLLM --max-num-seqs (D-142)
  criteria-compiler: {<<: *arm, mem_limit: 1g}
  adapter: {<<: *arm, mem_limit: 6g}   # gb10-profile.yaml: a 50,000-patient ingest peaked at 3,842 MiB (x 1.5 = 5,763); 3g was killed
  lake: {<<: *arm, mem_limit: 6g}
  embed-service:
    <<: *arm
    mem_limit: 6g   # deploy/gb10-profile.yaml (unmeasured, D-373; 6g since D-890)
    environment:
      # ENG-003 (D-563): trialbox-embed carries torch's CPU build, which stops at start when asked for cuda. A
      # profile that gives the embedder the card needs its own image and lock first
      TB_EMBED_DEVICE: ${TB_EMBED_DEVICE:-cpu}
  doc-parser: {<<: *arm, mem_limit: 2g}
  gateway:
    <<: *arm
    mem_limit: 2g   # deploy/gb10-profile.yaml (unmeasured, D-373)
    environment:
      TB_MODEL_SWAP: "off"   # both resident (services/gateway/swap.py)
      TB_PROFILE: P-GB10
  llm-stub: {<<: *arm, mem_limit: 1g}
  console: {<<: *arm, mem_limit: 2g}
  audit-writer: {<<: *arm, mem_limit: 256m}   # D-394; deploy/gb10-profile.yaml
  model-guard: {<<: *arm, mem_limit: 1g}
  # Third-party services: multi-arch digests from docker-compose.yml resolve to their arm64 manifests here.
  db: {<<: *arm, mem_limit: 8g}
  fhir-store:
    <<: *arm
    mem_limit: ${TB_MEM_FHIR:-8g}   # the 6g heap below plus the JVM's own (T-108a, D-360); gb10-profile.yaml (D-373)
    environment:
      # same flags as the base file; explicit heap so HAPI does not size itself from the 128 GB of unified memory
      JAVA_TOOL_OPTIONS: "-Xmx${HAPI_XMX:-6g} -Duser.timezone=${TB_TZ:?set TB_TZ in deploy/.env to site.tz (D-315)}"
