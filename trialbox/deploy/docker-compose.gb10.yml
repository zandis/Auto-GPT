# NVIDIA GB10 (DGX Spark class, aarch64, 128 GB unified memory) override — SPEC §2, §7.1; DECISIONS D-79.
#
#   cd deploy && docker compose -f docker-compose.yml -f docker-compose.gb10.yml --profile gpu up -d --wait
#   make spark-e2e     # the whole stack end to end with the pinned local model (docs/RUNBOOK.md section 8)
#
# Two local models (the recommended DGX Spark pair, docs/RUNBOOK.md section 8): llm-service serves the judge
# (j-workhorse: gpt-oss-120b, MXFP4) and llm-verifier the verifier (v-verifier: Gemma 4 26B-A4B-it), and a criterion
# blocks only when both agree. Both are reached only by the gateway (model-net); pin their weights first
# (tools/pin_model.py, endpoints `serving` and `verifier`) or the gateway routes nothing to them. Knobs: JUDGE_MODEL_DIR,
# JUDGE_MODEL, VERIFIER_MODEL_DIR, VERIFIER_MODEL (directories under deploy/models and vLLM served names; LLM_MODEL in
# deploy/.env is the legacy direct-client setting and does not apply here). Qwen3.5-35B-A3B on llm-service alone stays
# the documented alternative (JUDGE_MODEL_DIR=JUDGE_MODEL=qwen3.5-35b-a3b-q4, JUDGE_MAX_LEN=32768, --scale
# llm-verifier=0; RUNBOOK section 8).
#
# Unified-memory budget (128 GB shared by CPU and GPU; TO BE CONFIRMED on hardware with `trialbox bench`, NFR-B17 (f)):
#   llm-service   JUDGE_GPU_MEM_UTIL 0.60     gpt-oss-120b MXFP4 weights ~61-65 GB + KV for 64k context (front desk)
#   llm-verifier  VERIFIER_GPU_MEM_UTIL 0.25  Gemma 4 26B-A4B-it at FP8 ~26-28 GB + KV at 32k (BF16 ~52 GB: no fit)
#   rest (~15%)                               OS, HAPI (HAPI_XMX 6g), Postgres x2, DuckDB, MinIO, embedder, services
# vLLM sizes its pool as a fraction of the whole device and checks free memory at start, so llm-verifier starts only
# after llm-service is healthy. Lower VERIFIER_MAX_LEN / --max-num-seqs before raising the fractions.
#
# Host prerequisites (deploy/check_host.sh --gb10 checks them):
#   * NVIDIA driver 580.142 exactly. Hold the package (apt-mark hold); the later 580.x builds regress vLLM on GB10
#     (see the SPEC reference "GB10 driver regression note"). Do not take driver updates outside a signed update bundle.
#   * nvidia-container-toolkit; Docker Engine 27+; cgroup v2.
#   * TrialBox images built multi-arch (make images-multiarch) or arm64 (make images PLATFORM=linux/arm64).
#
# Every third-party image is pinned by digest. The pins below are multi-arch indexes (arm64 included) or arm64
# manifests. Unified memory is shared with HAPI, DuckDB and the embedder, so vLLM takes a smaller fraction than on
# a discrete 32 GB GPU.
x-arm: &arm
  platform: linux/arm64

services:
  llm-service:
    <<: *arm
    # GB10 build of vLLM (aarch64, CUDA 13, sm_121). Station release 2026-10-01, arm64 manifest digest.
    image: ${VLLM_GB10_IMAGE:-eugr/spark-vllm:station-20261001@sha256:f5700fdbb43e1bb254d8a559505ce95e4f8c0b8ba9d666f7ed1b5e25bf8c4d82}
    entrypoint: ["vllm", "serve"]
    command:
      - /models/${JUDGE_MODEL_DIR:-gpt-oss-120b}
      - --served-model-name=${JUDGE_MODEL:-gpt-oss-120b}
      - --max-model-len=${JUDGE_MAX_LEN:-65536}   # f-frontdesk is this build at 64k (NFR-B20)
      - --max-num-seqs=64
      - --gpu-memory-utilization=${JUDGE_GPU_MEM_UTIL:-0.60}
      - --guided-decoding-backend=${GUIDED_BACKEND:-outlines}
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    healthcheck:
      start_period: 1200s  # first load of a 120B MoE from NVMe into unified memory

  llm-verifier:
    <<: *arm
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}
    profiles: [gpu]
    image: ${VLLM_GB10_IMAGE:-eugr/spark-vllm:station-20261001@sha256:f5700fdbb43e1bb254d8a559505ce95e4f8c0b8ba9d666f7ed1b5e25bf8c4d82}
    entrypoint: ["vllm", "serve"]
    command:
      - /models/${VERIFIER_MODEL_DIR:-gemma-4-26b-a4b-it}
      - --served-model-name=${VERIFIER_MODEL:-gemma-4-26b-a4b-it}
      - --max-model-len=${VERIFIER_MAX_LEN:-32768}
      - --max-num-seqs=32
      - --gpu-memory-utilization=${VERIFIER_GPU_MEM_UTIL:-0.25}
      - --guided-decoding-backend=${GUIDED_BACKEND:-outlines}
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes: ["${TB_MODELS_DIR:-./models}:/models:ro"]
    ipc: host
    networks: [model-net]
    restart: unless-stopped
    depends_on:
      llm-service: {condition: service_healthy}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 900s

  # TrialBox services: the same images, arm64 variant (multi-arch tag or the local arm64 build).
  mail-gateway: *arm
  orchestrator: *arm
  criteria-compiler: *arm
  adapter: *arm
  lake: *arm
  embed-service:
    <<: *arm
    environment:
      TB_EMBED_DEVICE: ${TB_EMBED_DEVICE:-cuda}  # bge-m3 on the GPU; falls back to CPU when CUDA is absent
  doc-parser: *arm
  gateway: *arm
  llm-stub: *arm
  # Third-party services: multi-arch digests from docker-compose.yml resolve to their arm64 manifests here.
  minio: *arm
  fhir-db: *arm
  workflow-db: *arm
  fhir-store:
    <<: *arm
    environment:
      # same flags as the base file; explicit heap so HAPI does not size itself from the 128 GB of unified memory
      JAVA_TOOL_OPTIONS: "-Xmx${HAPI_XMX:-6g} -Duser.timezone=${TB_TZ:-Asia/Taipei}"
