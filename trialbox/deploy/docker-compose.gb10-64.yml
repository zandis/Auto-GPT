# 64 GB unified-memory class (gb10-64). A later file on docker-compose.gb10.yml.
#
#   deploy/install.sh <bundle> --mode gpu --gpu gb10-64
#
# Memory limits only, from deploy/gb10-64-profile.yaml (planning values, not measured). Images, commands, the 16k
# context and the sequence counts stay the 128 GB file's planning defaults; they are not a measurement of a 64 GB
# host, and this file does not restate them. Anchors do not cross compose files, so this overlay sets no <<: *arm.
services:
  llm-service: {mem_limit: 23g}
  llm-verifier: {mem_limit: 13g}
  gateway:
    mem_limit: 256m
    environment:
      TB_PROFILE: P-GB10-64
  model-guard: {mem_limit: 256m}
  db: {mem_limit: 1g}
  fhir-store:
    mem_limit: 3.5g
    environment:
      # Fixed 2g. ${HAPI_XMX} would take a 6g heap left from the 128 GB profile and pass this cap. Not measured.
      # The cap stays at least 1 GiB above the heap (T-108a).
      JAVA_TOOL_OPTIONS: "-Xmx2g -Duser.timezone=${TB_TZ:?set TB_TZ in deploy/.env to site.tz (D-315)}"
  lake: {mem_limit: 2g}
  embed-service: {mem_limit: 6g}   # D-890: the CPU embedder is unchanged; one load about 3.5 GB, 4g was too tight
  orchestrator: {mem_limit: 1g}
  adapter:
    mem_limit: 4g   # the validator heap below plus 1 GiB for the adapter process; not measured
    environment:
      TB_VALIDATOR_XMX: 3g
  doc-parser: {mem_limit: 512m}
  criteria-compiler: {mem_limit: 256m}
  console: {mem_limit: 256m}
  mail-gateway: {mem_limit: 256m}
  audit-writer: {mem_limit: 256m}
  llm-stub: {mem_limit: 256m}
