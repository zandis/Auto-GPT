# TrialBox's own volumes (the appliance's named volumes). On the platform's encrypted storage class (a site overlay
# sets storageClassName; doctor --platform checks every claim uses TB_PLATFORM_STORAGE_CLASS). Volumes several
# services mount are ReadWriteMany; the sizes are a starting point the site survey (question 25) replaces.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: lake-data, labels: {app.kubernetes.io/component: storage}}
spec: {accessModes: [ReadWriteMany], resources: {requests: {storage: 100Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: audit-data, labels: {app.kubernetes.io/component: storage}}
spec: {accessModes: [ReadWriteMany], resources: {requests: {storage: 20Gi}}}
