# The TrialBox services (the appliance's compose services, the same images and commands; D-211). Each service
# runs as uid 10001 with its own token (Secret trialbox-token-<service>, key `token`) and reads the token registry
# (ConfigMap trialbox-service-tokens: hashes, not secret), as docker-compose.secrets.yml gives them on the appliance.
# Database passwords, mail passwords and the cloud key reach only the services that use them. Requests are scheduling
# floors, not measurements; their sum is the quota minimum doctor --platform checks.
---
apiVersion: v1
kind: Service
metadata: {name: lake, labels: {app.kubernetes.io/component: lake}}
spec:
  selector: {app.kubernetes.io/component: lake}
  ports: [{name: http, port: 8013, targetPort: 8013}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: lake, labels: {app.kubernetes.io/component: lake, trialbox.io/tier: app}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/component: lake}}
  template:
    metadata: {labels: {app.kubernetes.io/component: lake, trialbox.io/tier: app}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: lake
          image: trialbox-py
          command: ["uvicorn", "lake.app:app", "--host", "0.0.0.0", "--port", "8013", "--workers", "2"]
          envFrom: [{configMapRef: {name: trialbox-env}}]
          env:
            - {name: PORT, value: "8013"}
            - {name: TB_SERVICE_NAME, value: lake}
            - {name: TB_LAKE_DIR, value: "/data/lake"}
            - {name: TB_LAKE_EMBEDDER, value: "http"}
            - {name: TB_DB_URL, valueFrom: {secretKeyRef: {name: trialbox-db, key: TB_DB_URL}}}
          ports: [{containerPort: 8013}]
          readinessProbe: {httpGet: {path: /healthz, port: 8013}, periodSeconds: 15, timeoutSeconds: 5, failureThreshold: 10}
          resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {memory: 8Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: settings, mountPath: /etc/trialbox/settings.yaml, subPath: settings.yaml, readOnly: true}
            - {name: token, mountPath: /run/secrets/tb_service_token, subPath: token, readOnly: true}
            - {name: token-registry, mountPath: /etc/trialbox/service-tokens, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: lake-data, mountPath: /data/lake}
      volumes:
        - {name: settings, configMap: {name: trialbox-settings}}
        - {name: token, secret: {secretName: trialbox-token-lake, defaultMode: 0440}}
        - {name: token-registry, configMap: {name: trialbox-service-tokens}}
        - {name: tmp, emptyDir: {}}
        - {name: lake-data, persistentVolumeClaim: {claimName: lake-data}}
---
