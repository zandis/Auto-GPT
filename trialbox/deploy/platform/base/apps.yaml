apiVersion: v1
kind: Service
metadata: {name: gateway, labels: {app.kubernetes.io/component: gateway}}
spec:
  selector: {app.kubernetes.io/component: gateway}
  ports: [{name: http, port: 8020, targetPort: 8020}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, labels: {app.kubernetes.io/component: gateway, trialbox.io/tier: app}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/component: gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/component: gateway, trialbox.io/tier: app}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: trialbox-py
          command: ["uvicorn", "--factory", "gateway.app:create_app", "--host", "0.0.0.0", "--port", "8020"]
          envFrom: [{configMapRef: {name: trialbox-env}}]
          env:
            - {name: PORT, value: "8020"}
            - {name: TB_SERVICE_NAME, value: gateway}
            - {name: TB_AUDIT_DIR, value: "/data/audit"}
            - {name: TB_TRACESTORE, value: "on"}
            # the site's pins: written by the pin job (overlays/shared-quota/pin.yaml, tools/pin_model.py --install)
            - {name: TB_REGISTRY_OVERRIDE, value: "/data/pins/registry.site.yaml"}
            - {name: TB_GATEWAY_INTERACTIVE_TIMEOUT_S, value: "30"}
            - {name: TB_DB_URL, valueFrom: {secretKeyRef: {name: trialbox-db, key: TB_DB_URL}}}
            - {name: CLOUD_LLM_API_KEY, valueFrom: {secretKeyRef: {name: trialbox-cloud, key: CLOUD_LLM_API_KEY, optional: true}}}
            # D-177, D-409: the model servers' key (model-guard wants it on every call); only the gateway holds it
            - {name: TB_LLM_API_KEY, valueFrom: {secretKeyRef: {name: trialbox-model-key, key: TB_LLM_API_KEY}}}
          ports: [{containerPort: 8020}]
          readinessProbe: {httpGet: {path: /healthz, port: 8020}, periodSeconds: 15, timeoutSeconds: 5, failureThreshold: 10}
          resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: settings, mountPath: /etc/trialbox/settings.yaml, subPath: settings.yaml, readOnly: true}
            - {name: token, mountPath: /run/secrets/tb_service_token, subPath: token, readOnly: true}
            - {name: token-registry, mountPath: /etc/trialbox/service-tokens, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: audit-data, mountPath: /data/audit}
            - {name: traces-data, mountPath: /data/traces}
            - {name: pins, mountPath: /data/pins, readOnly: true}
      volumes:
        - {name: settings, configMap: {name: trialbox-settings}}
        - {name: token, secret: {secretName: trialbox-token-gateway, defaultMode: 0440}}
        - {name: token-registry, configMap: {name: trialbox-service-tokens}}
        - {name: tmp, emptyDir: {}}
        - {name: audit-data, persistentVolumeClaim: {claimName: audit-data}}
        - {name: traces-data, persistentVolumeClaim: {claimName: traces-data}}
        - {name: pins, persistentVolumeClaim: {claimName: model-pins, readOnly: true}}
---
