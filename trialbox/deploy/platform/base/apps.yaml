  selector: {matchLabels: {app.kubernetes.io/component: console}}
  template:
    metadata: {labels: {app.kubernetes.io/component: console, trialbox.io/tier: app}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: console
          image: trialbox-py
          command: ["uvicorn", "--factory", "console.app:create_app", "--host", "0.0.0.0", "--port", "8090", "--proxy-headers", "--forwarded-allow-ips", "*"]
          envFrom: [{configMapRef: {name: trialbox-env}}]
          env:
            - {name: PORT, value: "8090"}
            - {name: TB_SERVICE_NAME, value: console}
            - {name: TB_CONSOLE_DIR, value: "/data/console"}
            - {name: TB_AUDIT_DIR, value: "/data/audit"}
            - {name: TB_RULESETS_DIR, value: "/data/rulesets"}
            # T-717 (D-485): the console's own key that signs people (Secret trialbox-actor-sign), never its token
            - {name: TB_ACTOR_SIGN_KEY_FILE, value: "/etc/trialbox/actor-sign/key"}
            - {name: TB_DB_URL, valueFrom: {secretKeyRef: {name: trialbox-db, key: TB_DB_URL}}}
          ports: [{containerPort: 8090}]
          readinessProbe: {httpGet: {path: /healthz, port: 8090}, periodSeconds: 15, timeoutSeconds: 5, failureThreshold: 10}
          resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: settings, mountPath: /etc/trialbox/settings.yaml, subPath: settings.yaml, readOnly: true}
            - {name: token, mountPath: /run/secrets/tb_service_token, subPath: token, readOnly: true}
            - {name: token-registry, mountPath: /etc/trialbox/service-tokens, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: console-data, mountPath: /data/console}
            - {name: audit-data, mountPath: /data/audit}
            - {name: rulesets-data, mountPath: /data/rulesets, readOnly: true}
            - {name: tb-terminology, mountPath: /data/terminology, readOnly: true}  # D-991: read-only in the readers
            - {name: objects-data, mountPath: /data/objects}
            - {name: actor-sign, mountPath: /etc/trialbox/actor-sign, readOnly: true}
      volumes:
        - {name: settings, configMap: {name: trialbox-settings}}
        - {name: token, secret: {secretName: trialbox-token-console, defaultMode: 0440}}
        - {name: actor-sign, secret: {secretName: trialbox-actor-sign, defaultMode: 0440}}
        - {name: token-registry, configMap: {name: trialbox-service-tokens}}
        - {name: tmp, emptyDir: {}}
        - {name: console-data, persistentVolumeClaim: {claimName: console-data}}
        - {name: audit-data, persistentVolumeClaim: {claimName: audit-data}}
        - {name: rulesets-data, persistentVolumeClaim: {claimName: rulesets-data}}
        - {name: tb-terminology, persistentVolumeClaim: {claimName: tb-terminology, readOnly: true}}
        - {name: objects-data, persistentVolumeClaim: {claimName: objects-data}}
