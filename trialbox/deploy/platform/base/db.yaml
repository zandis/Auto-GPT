# One PostgreSQL server (the appliance's `db`): databases hapi and trialbox_wf (db-init), the same flags.
apiVersion: v1
kind: Service
metadata: {name: db, labels: {app.kubernetes.io/component: db}}
spec:
  selector: {app.kubernetes.io/component: db}
  ports: [{name: pg, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, labels: {app.kubernetes.io/component: db, trialbox.io/tier: data}}
spec:
  serviceName: db
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/component: db}}
  template:
    metadata: {labels: {app.kubernetes.io/component: db, trialbox.io/tier: data}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: db
          image: postgres
          args: ["-c", "wal_compression=zstd", "-c", "default_toast_compression=lz4", "-c", "archive_mode=off"]
          env:
            - {name: POSTGRES_DB, value: hapi}
            - {name: POSTGRES_USER, value: hapi}
            - {name: POSTGRES_INITDB_ARGS, value: --data-checksums}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: trialbox-db, key: POSTGRES_PASSWORD}}}
            - {name: POSTGRES_WF_PASSWORD, valueFrom: {secretKeyRef: {name: trialbox-db, key: POSTGRES_WF_PASSWORD}}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U hapi -d hapi && psql -U hapi -d hapi -tAc \"SELECT 1 FROM pg_database WHERE datname='trialbox_wf'\" | grep -q 1"]}
            periodSeconds: 10
          resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {memory: 4Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: db-pg, mountPath: /var/lib/postgresql/data}
            - {name: db-init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - {name: db-init, configMap: {name: trialbox-db-init}}
        - {name: run, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: db-pg}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 50Gi}}}
