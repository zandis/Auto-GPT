score_id: rheum.cdai
name: {en: Clinical Disease Activity Index, ja: CDAI, zh_tw: 臨床疾病活動指數 CDAI}
version: 1
formula_kind: sum
inputs:
  - {role: tjc, item: rheum.tjc28, unit: "{count}", required: true, window_days: 0, anchor: true}
  - {role: sjc, item: rheum.sjc28, unit: "{count}", required: true, window_days: 0}
  - {role: ptga, item: rheum.ptga_0_10, unit: "{score}", required: true, window_days: 0, note: "0-10 scale, 0.5 steps allowed; a 0-100 mm VAS is divided by 10 and flagged"}
  - {role: evga, item: rheum.evga_0_10, unit: "{score}", required: true, window_days: 0}
formula: "tjc + sjc + ptga + evga"
output: {unit: "{score}", min: 0, max: 76}
rounding: "one decimal"
edge_cases:
  - "any component missing: no row (no imputation)"
  - "global assessments recorded in cm on a 10 cm VAS are already 0-10"
interpretation:
  remission: "≤ 2.8"
  low: "> 2.8 to ≤ 10"
  moderate: "> 10 to ≤ 22"
  high: "> 22"
examples:
  - inputs: {tjc: 8, sjc: 6, ptga: 7, evga: 6}
    expected: {cdai: 27, band: high}
    source: "R package 'cliot' documentation, cdai_rheumatoid_arthritis examples (rdrr.io, read 2026-11-09)"
    source_grade: calculator
  - inputs: {tjc: 0, sjc: 0, ptga: 1, evga: 0.5}
    expected: {cdai: 1.5, band: remission}
    source: "same"
    source_grade: calculator
sources:
  - "Aletaha D, Smolen JS. Clin Exp Rheumatol 2005;23(S39):S100-S108"
  - "LOINC 75847-4 Total score [CDAI] (verified 2026-11-09)"
licence: "published index; no licence known; LOINC code under the LOINC licence"
verified: yes
