score_id: rheum.asdas_crp
name: {en: ASDAS-CRP, ja: ASDAS-CRP, zh_tw: ASDAS-CRP}
version: 1
formula_kind: weighted_sqrt_log
inputs:
  - {role: back_pain, item: "local (BASDAI q2)", unit: "{score 0-10}", required: true, anchor: true}
  - {role: morning_stiffness_duration, item: "local (BASDAI q6)", unit: "{score 0-10}", required: true}
  - {role: patient_global, item: "local (0-10)", unit: "{score 0-10}", required: true}
  - {role: peripheral_pain_swelling, item: "local (BASDAI q3)", unit: "{score 0-10}", required: true}
  - {role: crp, item: lab.crp, unit: mg/L, required: true, window_days: 7}
formula: "0.12*back_pain + 0.06*morning_stiffness_duration + 0.11*patient_global + 0.07*peripheral_pain_swelling + 0.58*ln(crp + 1)"
coefficients: {back_pain: 0.12, morning_stiffness_duration: 0.06, patient_global: 0.11, peripheral_pain_swelling: 0.07, crp: 0.58}
output: {unit: "{score}", min: 0, max: "about 10"}
rounding: "one decimal"
edge_cases:
  - "crp < 2 mg/L (or below detection): use 2 mg/L (ASAS convention; DESIR cohort recommendation quoted 2026-11-09)"
  - "ASDAS-ESR is a different formula (sqrt(ESR) term) - separate definition if needed"
interpretation:
  inactive: "< 1.3"
  low_formerly_moderate: "1.3 to < 2.1 (ASAS renamed 'moderate' to 'low' in 2018)"
  high: "2.1 to 3.5"
  very_high: "> 3.5"
  improvement: "clinically important ≥ 1.1; major ≥ 2.0"
examples:
  - inputs: {cut_offs: true}
    expected: {inactive_below: 1.3, high_from: 2.1, very_high_above: 3.5}
    source: "Machado P et al. Ann Rheum Dis 2011;70:47-53 (quoted in web search 2026-11-09)"
    source_grade: primary
  - inputs: {crp_mg_L: 1.0}
    expected: {crp_used: 2.0}
    source: "DESIR cohort recommendation (Machado et al.) quoted 2026-11-09"
    source_grade: secondary
    note: "no published worked numeric example found today; owner or rheumatologist to supply before approval"
sources:
  - "Lukas C et al. Ann Rheum Dis 2009;68:18-24 (development)"
  - "Machado P et al. Ann Rheum Dis 2011;70:47-53 (cut-offs)"
  - "Machado PM et al. Ann Rheum Dis 2018;77:1539-1540 (nomenclature)"
licence: "published formula (ASAS); free"
verified: partial
