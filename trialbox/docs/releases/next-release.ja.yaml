# The Japanese release note and change-impact sheet of the next release (10K-7, D-1363).
# tools/make_bundle.sh reads this file (python -m tools.release_note build) and puts RELEASE-NOTE.ja.md and
# CHANGE-IMPACT.json into the signed bundle; a class left unstated stops the bundle. The pull request that sets the
# version rewrites this file for that release, as it moves CHANGELOG.md's "Unreleased" lines (the English record).
# The classes are those of docs/validation/change-control.md §2. Synthetic wording only: no site, person or patient.
format: trialbox-release-note/1
title_ja: TrialBox 次回リリースのお知らせ
summary_ja: |
  このリリースでは、印刷する日付の書式（和暦・西暦）と年度での集計、設定ウィザードの国別の初期値、
  データベースのロールと監査の強化、エクスポートでの数式の無害化などが変わります。
  設置済みの施設の設定は更新では変わりません。詳しい英語の記録は同梱の CHANGELOG.md にあります。
changes:
  CC1:
    changed: false
  CC2:
    changed: true
    what_ja: 日本の施設でSS-MIX2を取り込み元として選べるようになり、カルテ番号の照合規則が厳しくなりました。
  CC3:
    changed: false
  CC4:
    changed: true
    what_ja: 印刷する日付の書式と年度での集計、設定ウィザードの質問の順序、画面の文言が変わります。
  CC5:
    changed: true
    what_ja: データベースのロールとパスワード、監査の記録、エクスポートでの数式の無害化を強化しました。
  CC6:
    changed: false
impact:
  downtime_minutes: 30
  database_migration: true
  ruleset_reapproval: false
  site_actions_ja:
    - 静かな時間帯（既定は 05:00 から 2 時間）に適用するよう、運用画面から予約してください。
    - 適用の翌朝、運用画面で更新の結果と doctor の結果を確認し、変更記録に記入してください。
