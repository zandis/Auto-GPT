# The plan calendar as data (TB-PLAN-06 card T-662; deep review PLAN-011, PLAN-012, PLAN-013, PLAN-016).
#
# Check:      python -m tools.gen_calendar --check
# Print:      python -m tools.gen_calendar             (one Markdown table, by date)
# Count:      python -m tools.gen_calendar --span TW 2027-03-29 2027-04-23
# Re-verify:  python -m tools.gen_calendar --verify-sources   (downloads the official files; network)
#
# Milestones are build milestones only (D-311: no IRB, committee, ethics or sign-off milestones).
# Each milestone lists the sites whose days off it must avoid. "day" is the weekday the plan prints;
# the check fails when it is wrong.
#
# Holidays are the official days off from 2026-11-01 to 2027-06-30, copied from the source named per
# country and year. A year whose source could not be fetched is marked "unverified", never guessed.
# kind "holiday" is a public holiday or a substitute day off; kind "closure" is a statutory office
# closure that is not a public holiday (Japan's 年末年始).

window:
  start: 2026-11-01
  end: 2027-06-30

sites:
  TW: Taiwan (CGMH)
  JP: Japan

milestones:
  - date: 2026-11-27
    day: Fri
    id: GP-0
    what: PoC build freeze, tag poc-1
    sites: [TW, JP]
  - date: 2026-12-04
    day: Fri
    id: G1
    what: The 50k run
    sites: [TW, JP]
  - date: 2026-12-11
    day: Fri
    id: G1b
    what: B200 qualified on the owner's host
    sites: [TW, JP]
  - date: 2027-01-08
    day: Fri
    id: G2
    what: Platform freeze (design freeze)
    sites: [TW, JP]
  - date: 2027-02-26
    day: Fri
    id: G3
    what: Feature complete
    sites: [TW, JP]

