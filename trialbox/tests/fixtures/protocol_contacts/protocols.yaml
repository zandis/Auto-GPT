# Protocol front pages with contact sections (T-606, D-359; review LLM-035). Three per language, written in the
# shape of public protocol synopses (title page, sponsor, medical monitor and coordinating investigator with telephone
# and e-mail, then the eligibility sections). Everything here is invented: no real study, person, site, telephone
# number or address. The headings are ones the parser's heuristic does not know, so the criteria locator (ie_locate)
# is called, as it is for an unusual protocol; `inclusion` and `exclusion` are the counts it must find.
protocols:
  - id: EN-1
    lang: en
    inclusion: 3
    exclusion: 2
    text: |
      A Phase 2 Study of Drug TBX-101 in Adults with Gout
      Protocol number TBX-101-201, version 2.0
      Sponsor medical monitor: Dr. Alan Example, tel +81-3-5555-0101, monitor@example.org
      Coordinating investigator: Dr. Grace Sample, phone 02-2555-0102
      ## Inclusion
      1. Age 18 to 75 years at screening.
      2. At least two gout flares in the past 12 months.
      3. Serum urate 7.0 mg/dL or higher at screening.
      ## Exclusion
      1. eGFR below 30 mL/min/1.73m2.
      2. Pregnancy or breastfeeding.
      ## Study contacts
      Study office: tel +1-555-0103, office@example.org
  - id: EN-2
    lang: en
    inclusion: 2
    exclusion: 2
    text: |
      An Open-Label Extension Study of TBX-202 in Rheumatoid Arthritis
      Medical Monitor: Dr. Ruth Placeholder (tel 03-5555-0201)
      ## Inclusion
      1. Completed the parent study TBX-202-301.
      2. DAS28-CRP above 3.2 at the last visit.
      ## Exclusion
      1. Active tuberculosis.
      2. Hepatitis B surface antigen positive.
      ## Emergency contact
      24-hour line: +81-3-5555-0202. E-mail: safety@example.org
  - id: EN-3
    lang: en
    inclusion: 2
