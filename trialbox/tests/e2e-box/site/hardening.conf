# e2e-box test VM: the site's host baseline as hospital IT fills it in (deploy/hardening/hardening.example.conf).
# The VM's only network is the user-mode one: the host reaches it from 10.0.2.2 (console and SSH forwards).
CLINIC_RANGES="10.0.2.0/24"
SSH=it
IT_RANGES="10.0.2.2/32"
