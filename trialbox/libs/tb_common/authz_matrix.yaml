# The permission matrix (T-102a, D-366): every console role x every action, as data. ``tb_common.authz.permit`` is
# the one function that reads it; the older helpers of ``tb_common.authz`` (``study_tasks``, ``edc_allowed``,
# ``edc_role_may``, ``can_request``, ``role_allowed``, ``sae_allowed``, ``admin_allowed``) and the role properties of
# ``console.auth.User`` are thin wrappers over ``permit``. A different answer is a change to one cell here.
#
# Rules of this file (``tests/unit/test_authz_matrix.py`` holds them):
# * ``roles`` equals ``console.auth.ROLES``; a role not listed here is refused every action.
# * the matrix is total: every action names every role.
# * a cell is ``true`` (the role may), ``false`` (it may not) or a list of conditions; any one condition grants:
#     pi            the account is the study's PI (the console's standing: the logged PI, or before the study's
#                   delegation log names one, an investigator of the study)
#     task:<t>      the account holds study task <t> in this study (``study_tasks`` with the delegation log)
#     logged_pi     the study's delegation log names a PI and the account is that PI
#     logged_tick   the study's delegation log names a PI and the PI ticked this row's task for the account
#     unlogged      the study's delegation log names no PI yet
# * ``permit`` is pure: no audit, no I/O. The caller audits.
#
# Sources: D-93, D-101, D-104, D-108, D-143, D-146, D-147, D-160, D-162, D-178, D-191, D-280 (OD-5), D-349 (T-512).
# D-280: the administrator has no patient-level row; one patient or one job only through break-glass
# (``console.breakglass``, the ``breakglass.*`` rows). The steward keeps no study task here (T-102b adds the steward's
# own pages).

version: 1
roles: [admin, coordinator, investigator, viewer, cro, steward]

actions:
  # ---------------------------------------------------------------- console role rights (console.auth.User)
  request.prepare:
    what: start requests and edit the registry (User.can_request; D-93)
    admin: true
    coordinator: true
    investigator: false
    viewer: false
    cro: false
    steward: false
  phi.view:
    what: read patient-level results in the browser, the CASE sheet and the pseudonymous rows (User.can_view_phi; D-101, D-280)
    admin: false
    coordinator: true
    investigator: true
    viewer: false
    cro: false
    steward: false
  id.reveal:
    what: see and reveal chart numbers, audited and rate-limited (User.can_reveal; D-143, D-280)
    admin: false
    coordinator: true
    investigator: true
    viewer: false
    cro: false
    steward: false
  list.mark:
    what: mark weekly-list patients Approach, Not suitable, Need info (User.can_mark; D-104)
    admin: false
    coordinator: false
    investigator: true
    viewer: false
    cro: false
    steward: false
  criteria.approve:
    what: approve a study's criteria (User.can_approve; S20, D-108)
    admin: false
    coordinator: false
    investigator: true
    viewer: false
    cro: false
    steward: false
  report.aggregate_only:
    what: a restriction, not a right; the account sees aggregate reports only, suppressed for CRO (User.aggregate_only; D-104)
    admin: false
    coordinator: false
    investigator: false
    viewer: true
    cro: true
    steward: false

  # ---------------------------------------------------------------- study tasks of the delegation log (D-147, D-349)
  # A coordinator has its row in every study. An investigator: before the study's log names a PI, the "unlogged" row
  # (screen, approach, refer); after, the logged PI has every task and a sub-investigator the ones the PI ticked.
  task.screen:
    what: see the candidate list of a study
    admin: false
    coordinator: true
    investigator: [unlogged, logged_pi, logged_tick]
    viewer: false
    cro: false
    steward: false
  task.approach:
    what: mark Approach on a patient
    admin: false
    coordinator: false
    investigator: [unlogged, logged_pi, logged_tick]
    viewer: false
    cro: false
    steward: false
  task.refer:
    what: ask a treating doctor
    admin: false
    coordinator: false
    investigator: [unlogged, logged_pi, logged_tick]
    viewer: false
    cro: false
    steward: false
  task.enter_data:
    what: enter trial data
    admin: false
    coordinator: true
    investigator: [logged_pi, logged_tick]
    viewer: false
    cro: false
    steward: false
  task.run:
    what: start the runs of the command.* rows that say task:run (a sub-investigator; T-512)
    admin: false
    coordinator: false
    investigator: [logged_pi, logged_tick]
    viewer: false
    cro: false
    steward: false

  # ---------------------------------------------------------------- jobs a console account may start (D-146, D-349)
  # The orchestrator checks the best case (``role_allowed``: as the study's PI with every task); the console adds the
  # study's delegation log (``can_request``). The investigator's FEAS, SCREEN and CASE rows are T-512's
  # INVESTIGATOR_RUNS: "pi" the study's PI, "task:run" a sub-investigator ticked for ``run``.
  command.FEAS:
    what: feasibility run
    admin: true
    coordinator: true
    investigator: [pi, task:run]
    viewer: false
    cro: false
    steward: false
  command.SCREEN:
    what: screening run
    admin: true
    coordinator: true
    investigator: [pi, task:run]
    viewer: false
    cro: false
    steward: false
  command.CASE:
    what: one case question
    admin: true
    coordinator: true
    investigator: [pi, task:run]
    viewer: false
    cro: false
    steward: false
  command.COHORT:
    what: cohort run
    admin: true
    coordinator: true
    investigator: false
    viewer: false
    cro: false
    steward: false
  command.NAV:
    what: navigation run
    admin: true
    coordinator: true
    investigator: false
    viewer: false
    cro: false
    steward: false
  command.MICROBATCH:
    what: the Monday re-screen
    admin: true
    coordinator: true
    investigator: false
    viewer: false
    cro: false
    steward: false
  command.STATUS:
    what: job status
    admin: true
    coordinator: true
    investigator: true
    viewer: false
    cro: false
    steward: false
  command.CANCEL:
    what: cancel a job
    admin: true
    coordinator: true
    investigator: false
    viewer: false
    cro: false
    steward: false
  command.CONSENT:
    what: consent draft
    admin: true
    coordinator: true
    investigator: false
    viewer: false
    cro: false
    steward: false
  command.RELEASE:
    what: release a deliverable
    admin: true
    coordinator: true
    investigator: false
    viewer: false
    cro: false
    steward: false
  command.FEEDBACK:
    what: feedback on a deliverable
    admin: true
    coordinator: true
    investigator: false
    viewer: false
    cro: false
    steward: false
  command.APPROVE:
    what: approve the criteria (the console asks criteria.approve on top; D-108)
    admin: false
    coordinator: false
    investigator: true
    viewer: false
    cro: false
    steward: false

  # ---------------------------------------------------------------- EDC prefill (D-160, D-162)
  edc.view:
    what: read the study's prefill pages
    admin: [task:enter_data]
    coordinator: [task:enter_data]
    investigator: [task:enter_data, pi]
    viewer: false
    cro: false
    steward: [task:enter_data]
  edc.map:
    what: map the CRF fields
    admin: [task:enter_data]
    coordinator: [task:enter_data]
    investigator: [task:enter_data]
    viewer: false
    cro: false
    steward: [task:enter_data]
  edc.draft:
    what: make prefill drafts
    admin: [task:enter_data]
    coordinator: [task:enter_data]
    investigator: [task:enter_data]
    viewer: false
    cro: false
    steward: [task:enter_data]
  edc.review:
    what: review a draft
    admin: [task:enter_data]
    coordinator: [task:enter_data]
    investigator: [task:enter_data]
    viewer: false
    cro: false
    steward: [task:enter_data]
  edc.sign:
    what: sign reviewed drafts
    admin: [task:enter_data]
    coordinator: [task:enter_data]
    investigator: [task:enter_data]
    viewer: false
    cro: false
    steward: [task:enter_data]
  edc.send:
    what: send signed drafts to the EDC
    admin: [task:enter_data]
    coordinator: [task:enter_data]
    investigator: [task:enter_data]
    viewer: false
    cro: false
    steward: [task:enter_data]
  edc.export:
    what: export ODM
    admin: [task:enter_data]
    coordinator: [task:enter_data]
    investigator: [task:enter_data]
    viewer: false
    cro: false
    steward: [task:enter_data]
  edc.switch_on:
    what: turn prefill on (the PI holds the sponsor's acknowledgement)
    admin: false
    coordinator: false
    investigator: [pi]
    viewer: false
    cro: false
    steward: false
  edc.switch_off:
    what: turn prefill off (stop at once)
    admin: true
    coordinator: false
    investigator: [pi]
    viewer: false
    cro: false
    steward: false

  # ---------------------------------------------------------------- the SAE register (D-191, D-280)
  sae.view:
    what: read the SAE register (pseudonym, dates, parties; never the AE term)
    admin: false
    coordinator: true
    investigator: true
    viewer: false
    cro: false
    steward: false
  sae.record:
    what: record a report sent, a receipt or a follow-up
    admin: false
    coordinator: true
    investigator: false
    viewer: false
    cro: false
    steward: false

  # ---------------------------------------------------------------- operations and accounts (D-178)
  ops.view:
    what: read the operations pages
    admin: true
    coordinator: false
    investigator: false
    viewer: false
    cro: false
    steward: false
  ops.backup:
    what: ask for a backup now
    admin: true
    coordinator: false
    investigator: false
    viewer: false
    cro: false
    steward: false
  ops.backup_check:
    what: check the newest backups
    admin: true
    coordinator: false
    investigator: false
    viewer: false
    cro: false
    steward: false
  ops.update_check:
    what: verify a staged update bundle
    admin: true
    coordinator: false
    investigator: false
    viewer: false
    cro: false
    steward: false
  ops.update_apply:
    what: apply a staged, signed bundle
    admin: true
    coordinator: false
    investigator: false
    viewer: false
    cro: false
    steward: false
  ops.logs:
    what: collect yesterday's service logs
    admin: true
    coordinator: false
    investigator: false
    viewer: false
    cro: false
    steward: false
  ops.network:
    what: write the network sheet again
    admin: true
    coordinator: false
    investigator: false
    viewer: false
    cro: false
    steward: false
  account.reset:
    what: a new one-time password for an account
    admin: true
    coordinator: false
    investigator: false
    viewer: false
    cro: false
    steward: false
  account.disable:
    what: disable an account
    admin: true
    coordinator: false
    investigator: false
    viewer: false
    cro: false
    steward: false
  account.enable:
    what: enable a disabled account again
    admin: true
    coordinator: false
    investigator: false
    viewer: false
    cro: false
    steward: false

  # ---------------------------------------------------------------- break-glass (D-280, OD-5; page: console.breakglass)
  # Recorded here for the matrix; ``console.breakglass`` still checks the role itself (T-102c moves the call sites).
  breakglass.open:
    what: open or end one 60-minute grant for one patient or one job
    admin: true
    coordinator: false
    investigator: false
    viewer: false
    cro: false
    steward: false
  breakglass.review:
    what: review every grant (never one's own)
    admin: false
    coordinator: false
    investigator: false
    viewer: false
    cro: false
    steward: true
  breakglass.read:
    what: read the grant list (admin its own, steward all, a study's PI that study's)
    admin: true
    coordinator: false
    investigator: [pi]
    viewer: false
    cro: false
    steward: true
