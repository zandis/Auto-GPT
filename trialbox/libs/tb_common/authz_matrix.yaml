# The permission matrix (T-102a, D-366; T-102b, D-380): every console role x every action, as data.
# ``tb_common.authz.permit`` is the one function that reads it; the older helpers of ``tb_common.authz``
# (``study_tasks``, ``edc_allowed``, ``edc_role_may``, ``can_request``, ``role_allowed``, ``sae_allowed``,
# ``admin_allowed``) and the role properties of ``console.auth.User`` are thin wrappers over ``permit``. The role
# descriptions on ``/ops/users`` are generated from this file (``tb_common.authz.role_rights``). A different answer
# is a change to one cell here.
#
# Rules of this file (``tests/unit/test_authz_matrix.py`` holds them):
# * ``roles`` equals ``console.auth.ROLES``; a role not listed here is refused every action.
# * the matrix is total: every action names every role.
# * a cell is ``true`` (the role may), ``false`` (it may not) or a list of conditions; any one condition grants:
#     pi            the account is the PI the study's delegation log names (D-380: no PI named, nobody is PI)
#     task:<t>      the account holds study task <t> in this study (``study_tasks`` with the delegation log)
#     logged_pi     the study's delegation log names a PI and the account is that PI
#     logged_tick   the study's delegation log names a PI and the PI ticked this row's task for the account
#     unlogged      the study's delegation log names no PI yet (no row uses it since D-380)
#     monitor       the account holds a monitor grant in this study today (a ``monitor`` entry of the delegation
#                   log, inside its visit dates; FIT-002)
# * ``permit`` is pure: no audit, no I/O. The caller audits.
#
# Sources: D-93, D-101, D-104, D-108, D-143, D-146, D-147, D-160, D-162, D-178, D-191, D-280 (OD-5), D-349 (T-512),
# D-380 (T-102b), D-386 (T-622), D-395 (T-310b), D-425 (T-102c), D-440 (T-204), D-443 (T-112b), D-434 (T-302c).
# D-280: the administrator (the IT operator) has no patient-level row; one patient or one job only through
# break-glass (``console.breakglass``, the ``breakglass.*`` rows). D-380: the data steward and the privacy office
# keep the opt-out register and the staff directory, and nobody else; the steward writes a study's first PI entry;
# a CRO account reads a study's enrolled subjects only under a monitor grant.

version: 1
roles: [admin, coordinator, investigator, viewer, cro, steward, privacy]

