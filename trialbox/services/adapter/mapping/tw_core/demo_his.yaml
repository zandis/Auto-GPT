# Site mapping: synthetic CGRD-like HIS export -> FHIR R4 (TW Core 1.0.0 profiles where they exist).
# Used by both source types: csv (one <table>.csv per table) and cgrd_sql (one SQL table per table).
# Copy this file to onboard a site; only table/column names, code-system URIs and lookups should change.
version: 1
name: demo_his
tz: Asia/Taipei
# T-619a (STD-011): TW Core output. The elements marked `when: {fhir_profiles: tw-core}` fill TW Core 1.0.0's slices
# with TW Core's own code systems (ICD-10-CM TW edition, NHI drug and service codes, NHI departments). They sit beside
# the codings the lake reads (always first), so a mapping that extends this one for another profile set (JP Core sets
# `fhir_profiles: jp-core`) does not carry them. tools/twcore_check.py validates a sample with the HL7 validator in CI.
fhir_profiles: tw-core
systems:
  icd10cm: http://hl7.org/fhir/sid/icd-10-cm
  icd9cm: http://hl7.org/fhir/sid/icd-9-cm  # NEW-STD-1: Taiwan's NHI diagnoses before 2016-01-01
  loinc: http://loinc.org
  ucum: http://unitsofmeasure.org
  atc: http://www.whocc.no/atc
  snomed: http://snomed.info/sct
  nhi_drug: https://trialbox.local/fhir/CodeSystem/nhi-drug
  # NEW-STD-5 (D-689): the reference data's name for the same NHI 藥品代號 (its nhi_drug_atc map, D-170); only the
  # map is asked under it, the medication keeps its code under nhi_drug
  nhi_drug_list: urn:tw:nhi:drug
  nhi_order: https://trialbox.local/fhir/CodeSystem/nhi-order
  department: https://trialbox.local/fhir/CodeSystem/department
  score: https://trialbox.local/fhir/CodeSystem/clinical-score
  lab_local: https://hospa.test/fhir/CodeSystem/lab-local
  exam_local: https://hospa.test/fhir/CodeSystem/exam-local
  pid: https://trialbox.local/fhir/sid/pid
  apply_type: https://trialbox.local/fhir/CodeSystem/nhi-apply-type
  staff: https://hospa.test/fhir/sid/staff-id
  encounter_id: https://trialbox.local/fhir/sid/encounter
  actcode: http://terminology.hl7.org/CodeSystem/v3-ActCode
  obs_category: http://terminology.hl7.org/CodeSystem/observation-category
  condition_category: http://terminology.hl7.org/CodeSystem/condition-category
  condition_clinical: http://terminology.hl7.org/CodeSystem/condition-clinical
  condition_verification: http://terminology.hl7.org/CodeSystem/condition-ver-status
  v2_0203: http://terminology.hl7.org/CodeSystem/v2-0203
  # TW Core 1.0.0 code systems (T-619a, STD-011)
  tw_icd10cm_2014: https://twcore.mohw.gov.tw/ig/twcore/CodeSystem/icd-10-cm-2014-tw
  tw_icd10cm_2023: https://twcore.mohw.gov.tw/ig/twcore/CodeSystem/icd-10-cm-2023-tw
  tw_nhi_drug: https://twcore.mohw.gov.tw/ig/twcore/CodeSystem/medication-nhi-tw
  tw_service: https://twcore.mohw.gov.tw/ig/twcore/CodeSystem/medical-service-payment-tw
  tw_department: https://twcore.mohw.gov.tw/ig/twcore/CodeSystem/medical-consultation-department-nhi-tw
# D-149, D-334: the unit a feed result with a number and no unit is read in, per analyte (LOINC -> UCUM). It is the
# unit the lab lookup writes (its `ucum` column), so a lab row without a unit and a FHIR result without one land in
# the same unit; `tools/mapping_check.py` fails when the two disagree. Change both together.
unit_defaults:
  "3084-1": mg/dL     # urate
  "2160-0": mg/dL     # creatinine
  "4548-4": "%"       # HbA1c (NGSP)
  "1742-6": U/L       # ALT
  "4537-7": mm/h      # ESR
  "1988-5": mg/L      # CRP
  "8302-2": cm        # body height
  "29463-7": kg       # body weight
# logical table -> source table; `delta` = change-tracking column used by `adapter run --since`
tables:
  patient: {source: patient, key: mrn, identity: {name: name, national_id: id_no}}  # identity: pid map only
  practitioner: {source: practitioner, key: staff_id}
  encounter: {source: encounter, key: enc_no, delta: updated_at}
  appointment: {source: appointment, key: appt_no}
  diagnosis: {source: diagnosis, key: diag_no, delta: updated_at}
  lab: {source: lab, key: lab_no, delta: updated_at}
  vital: {source: vital, key: vital_no, delta: updated_at}
  medication: {source: medication, key: rx_no, delta: updated_at}
  procedure: {source: procedure, key: proc_no, delta: updated_at}
  report: {source: report, key: rpt_no, delta: updated_at}
  note: {source: note, key: note_no, delta: updated_at}
  claim: {source: claim, key: claim_no, delta: updated_at}
  registry: {source: registry, key: mrn}  # research-contact consent; settings.registry_source may point elsewhere
lookups:
  lab: {file: lab_local_to_loinc.csv, key: local_code}
  # SDR2 (lane M): the hospital's department code -> TrialBox's department code (the criteria's system). The shipped
  # file holds TrialBox's own codes only; a site's table is its profile's `used_by: [mapping.department]`. Optional:
  # a mapping copied without the file loads and writes the hospital's code as before
  department: {file: department_to_trialbox.csv, key: dept_code, optional: true, columns: [dept_code, code]}
static:
  - resourceType: Organization
    id: hospital
    identifier: [{system: "https://trialbox.local/fhir/sid/site", value: "{site_id}"}]
    name: "{site_id}"
  - resourceType: Organization
    id: nhi
    name: National Health Insurance Administration
resources:
  - type: Patient
    table: patient
    id: {pid: mrn}
    profile: https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Patient-twcore
    elements:
      identifier[0].system: {template: "{sys.pid}/{site_id}"}
      identifier[0].value: {pid: mrn}
      # the identifier is TrialBox's pseudonym, never the hospital's record number: v2-0203 ANON (no TW Core slice)
      identifier[0].type.coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/v2-0203", code: ANON}, when: {fhir_profiles: tw-core}}
      gender: {column: sex, map: {M: male, F: female}, default: unknown}
      # F9 (D-811): a birth date more than 122 years (the longest verified life) before the death, or before today, is
      # left out and counted; the patient is kept
      birthDate: {column: birth_date, type: date, lived_at_most: {years: 122, until: death_date}}
      deceasedDateTime: {column: death_date, type: datetime}
  - type: Coverage
    table: patient
    id: {hid: mrn}
    elements:
      status: {const: active}
      beneficiary.reference: {ref: {type: Patient, pid: mrn}}
      payor[0].reference: {const: Organization/nhi}
  - type: Practitioner
    table: practitioner
    id: {column: staff_id}
    profile: https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Practitioner-twcore
    elements:
      identifier[0].system: {template: "{sys.staff}"}
      identifier[0].value: {column: staff_id}
      identifier[0].type.coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/v2-0203", code: EI}}
      name[0].text: {column: name}  # the clinician's name as the HIS holds it (D-120): the lists show it
  - type: Encounter
    table: encounter
    id: {hid: enc_no}
    profile: https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Encounter-twcore
    elements:
      identifier[0].system: {template: "{sys.encounter_id}"}
      identifier[0].value: {hid: enc_no}
      status: {const: finished}
      # NEW-DIN-7 (D-587): a visit type the map does not know is unknown (v3 NullFlavor UNK), never out-patient by
      # default; none at all is out-patient, as before
      class.system: {column: enc_type, map: {OPD: "http://terminology.hl7.org/CodeSystem/v3-ActCode", IPD: "http://terminology.hl7.org/CodeSystem/v3-ActCode", ER: "http://terminology.hl7.org/CodeSystem/v3-ActCode"}, default: "http://terminology.hl7.org/CodeSystem/v3-ActCode", unmapped: "http://terminology.hl7.org/CodeSystem/v3-NullFlavor"}
      class.code: {column: enc_type, map: {OPD: AMB, IPD: IMP, ER: EMER}, default: AMB, unmapped: UNK}
      # SDR2 (lane M): the department table's TrialBox code when it has a row; else the hospital's code as written
      serviceType.coding[0]: {builder: coding, column: dept_code, system: department, when: {lookup: {name: department, key: dept_code, field: code}, not_empty: false}}
      serviceType.coding[0].system: {template: "{sys.department}", when: {lookup: {name: department, key: dept_code, field: code}, not_empty: true}}
      serviceType.coding[0].code: {lookup: {name: department, key: dept_code, field: code}}
      # TW Core slice TWMedicalConsultationDepartment: the NHI 就醫科別 of a local department. TW Core binds this slice
      # to the departments SNOMED CT has no code for (血液腫瘤科 AF among them); the others are SNOMED CT coded there,
      # which TrialBox does not ship (no SNOMED CT licence, D-342), so they keep the local coding only
      serviceType.coding[1].system: {template: "{sys.tw_department}", when: [{fhir_profiles: tw-core}, {column: dept_code, in: [ONC]}]}
      serviceType.coding[1].code: {column: dept_code, map: {ONC: AF}, when: [{fhir_profiles: tw-core}, {column: dept_code, in: [ONC]}]}
      subject.reference: {ref: {type: Patient, pid: mrn}}
      participant[0].individual.reference: {ref: {type: Practitioner, column: staff_id}}
      period.start: {column: visit_datetime, type: datetime}
  - type: Appointment
    table: appointment
    id: {hid: appt_no}
    # NEW-DIN-7 (D-587): a booking whose status the map does not know is left out (and counted), never shown as
    # booked; no status at all is booked, as before
    where: [{column: status, known: [B, A, C, N]}]
    elements:
      status: {column: status, map: {B: booked, A: arrived, C: cancelled, N: noshow}, default: booked}
      serviceType[0].coding[0]: {builder: coding, column: dept_code, system: department}
      start: {column: appt_datetime, type: instant}
      end: {column: appt_datetime, type: instant, add_minutes: duration_min}
      participant[0].actor.reference: {ref: {type: Patient, pid: mrn}}
      participant[0].status: {const: accepted}
      participant[1].actor.reference: {ref: {type: Practitioner, column: staff_id}}
      participant[1].status: {const: accepted}
  - type: Condition
    table: diagnosis
    id: {hid: diag_no}
    profile: https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Condition-twcore
    elements:
      # NEW-DIN-7 (D-587): a status the map does not know (a site's code for deleted or ruled out) is never
      # "active": the diagnosis has no clinical status and is unconfirmed, which the lake keeps out of the coded
      # table as it does a suspected one (D-142). No status at all is active, as before
      clinicalStatus.coding[0].system: {template: "{sys.condition_clinical}", when: {column: status, known: [A, R]}}
      clinicalStatus.coding[0].code: {column: status, map: {A: active, R: resolved}, default: active, unmapped: ~}
      verificationStatus.coding[1].system: {template: "{sys.condition_verification}", when: {column: status, unknown_to: [A, R]}}
      verificationStatus.coding[1].code: {const: unconfirmed, when: {column: status, unknown_to: [A, R]}}
      # D-142: a suspected diagnosis (疑い / 疑似) is provisional; the lake keeps it out of the coded table
      verificationStatus.coding[0].system: {template: "{sys.condition_verification}", when: {column: suspected, in: [Y, y, "1"]}}
      verificationStatus.coding[0].code: {column: suspected, map: {Y: provisional, y: provisional, "1": provisional}}
      category[0].coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/condition-category", code: encounter-diagnosis}}
      # NEW-STD-1 (D-586): which edition the code is in. The row's own `diag_code_system` (icd9cm / icd10cm) wins.
      # Else the day the code was keyed (`recorded_date`), and only when the row has none the day of the diagnosis
      # (`diag_date`), against the site's `params.icd9cm_before` (Taiwan's NHI: 2016-01-01): a code keyed in 2019
      # for an illness of 2014 is an ICD-10-CM code. A mapping that sets no such parameter has no ICD-9-CM years:
      # every diagnosis is ICD-10-CM, as before. With the parameter set, a diagnosis with neither date and no
      # system gets no code (unknown, never a guess)
      code.coding[0]: {builder: coding, column: icd10, system: icd10cm, when: &icd10cm {any: [[{column: diag_code_system, in: [icd10cm]}], [{column: diag_code_system, not_empty: false}, {column: recorded_date, date_from: {param: icd9cm_before}}], [{column: diag_code_system, not_empty: false}, {column: recorded_date, not_empty: false}, {column: diag_date, date_from: {param: icd9cm_before}}]]}}
      # D-593: a diagnosis of the ICD-9-CM years gains its ICD-10-CM code first (the lake reads the first code)
      # only where the reference data's map (the CMS GEMs, D-592) has exactly one entry and calls it the same code;
      # else it stays ICD-9-CM alone and is counted (`map:icd9cm->icd10cm`). No reference data: nothing is mapped
      code.coding[3]: {builder: mapped_coding, column: icd10, from: icd9cm, to: icd10cm, dotted: icd9, when: &icd9cm {any: [[{column: diag_code_system, in: [icd9cm]}], [{column: diag_code_system, not_empty: false}, {column: recorded_date, date_before: {param: icd9cm_before}}], [{column: diag_code_system, not_empty: false}, {column: recorded_date, not_empty: false}, {column: diag_date, date_before: {param: icd9cm_before}}]]}}
      code.coding[4]: {builder: coding, column: icd10, system: icd9cm, when: *icd9cm}
      # TW Core slices icd10-cm-2014 / icd10-cm-2023: the NHI edition by the date of the diagnosis (2023 from 2025-01-01)
      code.coding[1]: {builder: coding, column: icd10, system: tw_icd10cm_2014, when: [{fhir_profiles: tw-core}, *icd10cm, {column: diag_date, date_before: "2025-01-01"}]}
      code.coding[2]: {builder: coding, column: icd10, system: tw_icd10cm_2023, when: [{fhir_profiles: tw-core}, *icd10cm, {column: diag_date, date_from: "2025-01-01"}]}
      subject.reference: {ref: {type: Patient, pid: mrn}}
      encounter.reference: {ref: {type: Encounter, hid: enc_no}}
      onsetDateTime: {column: diag_date, type: date}
      recordedDate: {column: recorded_date, type: date}
  - type: Observation
    table: lab
    id: {hid: lab_no}
    where: [{lookup: {name: lab, key: local_code, field: code}, not_empty: true}]
    profile: {lookup: {name: lab, key: local_code, field: profile}}
    elements:
      # D-275: the result's own status (optional column `result_status`, FHIR words; the SS-MIX2 reader fills it from
      # OBX-11). Written in error or cancelled: not counted; a code the map does not know: `unknown` (no usable value);
      # none at all: `unknown` tagged "not recorded" (counts, as it did; never invented as `final`)
      status: {column: result_status, map: {final: final, amended: amended, corrected: corrected, preliminary: preliminary, registered: registered, cancelled: cancelled, entered-in-error: entered-in-error}, default: unknown, unmapped: unknown}
      meta.tag[0]: {const: {system: "urn:trialbox:status-source", code: not-recorded}, when: {column: result_status, not_empty: false}}
      category[0].coding[0].system: {template: "{sys.obs_category}"}
      category[0].coding[0].code: {lookup: {name: lab, key: local_code, field: category}}
      code.coding[0].system: {template: "{sys.loinc}", when: {lookup: {name: lab, key: local_code, field: system}, equals: loinc}}
      code.coding[0].code: {lookup: {name: lab, key: local_code, field: code}, when: {lookup: {name: lab, key: local_code, field: system}, equals: loinc}}
      code.coding[0].display: {lookup: {name: lab, key: local_code, field: display}, when: {lookup: {name: lab, key: local_code, field: system}, equals: loinc}}
      code.coding[1].system: {template: "{sys.score}", when: {lookup: {name: lab, key: local_code, field: system}, equals: score}}
      code.coding[1].code: {lookup: {name: lab, key: local_code, field: code}, when: {lookup: {name: lab, key: local_code, field: system}, equals: score}}
      code.coding[1].display: {lookup: {name: lab, key: local_code, field: display}, when: {lookup: {name: lab, key: local_code, field: system}, equals: score}}
      code.coding[2]: {builder: coding, column: local_code, system: lab_local, display_column: item_name}
      subject.reference: {ref: {type: Patient, pid: mrn}}
      effectiveDateTime: {column: sample_datetime, type: datetime}
      $merge: {builder: lab_value, lookup: lab, key: local_code, column: result_value, unit_column: unit}  # R-31, D-215
  - type: Observation
    table: vital
    id: {hid: vital_no, suffix: "-HT"}
    where: [{column: height_cm, not_empty: true}]
    profile: https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Observation-body-height-twcore
    elements:
      status: {const: final}
      category[0].coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/observation-category", code: vital-signs}}
      code.coding[0]: {const: {system: "http://loinc.org", code: 8302-2, display: Body height}}
      subject.reference: {ref: {type: Patient, pid: mrn}}
      effectiveDateTime: {column: measure_datetime, type: datetime}
      valueQuantity.value: {column: height_cm, type: decimal}
      valueQuantity.unit: {const: cm}
      valueQuantity.system: {template: "{sys.ucum}"}
      valueQuantity.code: {const: cm}
  - type: Observation
    table: vital
    id: {hid: vital_no, suffix: "-WT"}
    where: [{column: weight_kg, not_empty: true}]
    profile: https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Observation-body-weight-twcore
    elements:
      status: {const: final}
      category[0].coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/observation-category", code: vital-signs}}
      code.coding[0]: {const: {system: "http://loinc.org", code: 29463-7, display: Body weight}}
      subject.reference: {ref: {type: Patient, pid: mrn}}
      effectiveDateTime: {column: measure_datetime, type: datetime}
      valueQuantity.value: {column: weight_kg, type: decimal}
      valueQuantity.unit: {const: kg}
      valueQuantity.system: {template: "{sys.ucum}"}
      valueQuantity.code: {const: kg}
  - type: Observation
    table: vital
    id: {hid: vital_no, suffix: "-BP"}
    where: [{column: sbp, not_empty: true}, {column: dbp, not_empty: true}]
    profile: https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Observation-bloodPressure-twcore
    elements:
      status: {const: final}
      category[0].coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/observation-category", code: vital-signs}}
      code.coding[0]: {const: {system: "http://loinc.org", code: 85354-9, display: Blood pressure panel with all children optional}}
      subject.reference: {ref: {type: Patient, pid: mrn}}
      effectiveDateTime: {column: measure_datetime, type: datetime}
      component[0].code.coding[0]: {const: {system: "http://loinc.org", code: 8480-6, display: Systolic blood pressure}}
      component[0].valueQuantity.value: {column: sbp, type: decimal}
      component[0].valueQuantity.unit: {const: mmHg}
      component[0].valueQuantity.system: {template: "{sys.ucum}"}
      component[0].valueQuantity.code: {const: "mm[Hg]"}
      component[1].code.coding[0]: {const: {system: "http://loinc.org", code: 8462-4, display: Diastolic blood pressure}}
      component[1].valueQuantity.value: {column: dbp, type: decimal}
      component[1].valueQuantity.unit: {const: mmHg}
      component[1].valueQuantity.system: {template: "{sys.ucum}"}
      component[1].valueQuantity.code: {const: "mm[Hg]"}
  # CGRD-A8 (D-846): a systolic or diastolic pressure with no partner at that time is an observation of its own,
  # never a blood-pressure panel with one half (the profile needs both)
  - type: Observation
    table: vital
    id: {hid: vital_no, suffix: "-SBP"}
    where: [{column: sbp, not_empty: true}, {column: dbp, not_empty: false}]
    elements:
      status: {const: final}
      category[0].coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/observation-category", code: vital-signs}}
      code.coding[0]: {const: {system: "http://loinc.org", code: 8480-6, display: Systolic blood pressure}}
      subject.reference: {ref: {type: Patient, pid: mrn}}
      effectiveDateTime: {column: measure_datetime, type: datetime}
      valueQuantity.value: {column: sbp, type: decimal}
      valueQuantity.unit: {const: mmHg}
      valueQuantity.system: {template: "{sys.ucum}"}
      valueQuantity.code: {const: "mm[Hg]"}
  - type: Observation
    table: vital
    id: {hid: vital_no, suffix: "-DBP"}
    where: [{column: dbp, not_empty: true}, {column: sbp, not_empty: false}]
    elements:
      status: {const: final}
      category[0].coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/observation-category", code: vital-signs}}
      code.coding[0]: {const: {system: "http://loinc.org", code: 8462-4, display: Diastolic blood pressure}}
      subject.reference: {ref: {type: Patient, pid: mrn}}
      effectiveDateTime: {column: measure_datetime, type: datetime}
      valueQuantity.value: {column: dbp, type: decimal}
      valueQuantity.unit: {const: mmHg}
      valueQuantity.system: {template: "{sys.ucum}"}
      valueQuantity.code: {const: "mm[Hg]"}
  - type: MedicationRequest
    table: medication
    id: {hid: rx_no}
    profile: https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/MedicationRequest-twcore
    elements:
      # D-275: a cancelled, mistaken or draft order is that (the lake does not count it); a code the map does not know
      # is `unknown` (the lake cannot place it: unknown, never counted as given); no status at all is `unknown` tagged
      # "not recorded" (the HIS keeps no status: the order counts, as it did)
      status: {column: status, map: {active: active, completed: completed, stopped: stopped, on-hold: on-hold, cancelled: cancelled, entered-in-error: entered-in-error, draft: draft}, default: unknown, unmapped: unknown}
      meta.tag[0]: {const: {system: "urn:trialbox:status-source", code: not-recorded}, when: {column: status, not_empty: false}}
      intent: {const: order}
      medicationCodeableConcept.coding[0]: {builder: coding, column: nhi_drug_code, system: nhi_drug, display_column: drug_name}
      medicationCodeableConcept.coding[1]: {builder: coding, column: atc, system: atc}
      # NEW-STD-5 (D-689): no ATC from the hospital: the one full (level 5) ATC code the NHIA list gives for the NHI
      # code (relation `wider`: the product is in that class), tagged userSelected false. Two answers, a coarser
      # class, no entry, or a hospital ATC: nothing is mapped; a row with no answer is counted
      # (`map:nhi_drug_list->atc`). No reference data: as before. A site that writes its ATC from another column
      # names that column in this `when` too (a load refuses it otherwise)
      medicationCodeableConcept.coding[2]: {builder: mapped_coding, column: nhi_drug_code, from: nhi_drug_list, to: atc, accept: [wider], target: atc5, when: {column: atc, not_empty: false}}
      # TW Core slice nhi-medication-tw (after the codings the lake reads; JP Core puts HOT9 at [2])
      medicationCodeableConcept.coding[3]: {builder: coding, column: nhi_drug_code, system: tw_nhi_drug, when: {fhir_profiles: tw-core}}
      medicationCodeableConcept.text: {column: drug_name}
      subject.reference: {ref: {type: Patient, pid: mrn}}
      encounter.reference: {ref: {type: Encounter, hid: enc_no}}
      authoredOn: {column: order_date, type: date}
      dosageInstruction[0].text: {template: "{daily_dose} {dose_unit}"}
      # T-616 (STD-012) reads the therapy period here first; the validity period stays for the CQL and older readers
      dosageInstruction[0].timing.repeat.boundsPeriod: {builder: period, start: start_date, end: end_date, type: date}
      dispenseRequest.validityPeriod: {builder: period, start: start_date, end: end_date, type: date}
  - type: Procedure
    table: procedure
    id: {hid: proc_no}
    profile: https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Procedure-twcore
    elements:
      status: {const: completed}
      code.coding[0]: {builder: coding, column: order_code, system: nhi_order, display_column: proc_name}
      # TW Core slice medical-service-payment: the NHI 醫療服務給付項目 code (the same code)
      code.coding[1]: {builder: coding, column: order_code, system: tw_service, when: {fhir_profiles: tw-core}}
      subject.reference: {ref: {type: Patient, pid: mrn}}
      performedDateTime: {column: proc_date, type: date}
  - type: DiagnosticReport
    table: report
    id: {hid: rpt_no}
    profile: https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/DiagnosticReport-twcore
    elements:
      status: {const: final}
      category[0].coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/v2-0074", code: RAD}}
      code.coding[0]: {const: {system: "http://loinc.org", code: 36643-5, display: "XR Chest 2 Views"}, when: {column: exam_code, equals: RAD-CXR}}
      code.coding[1]: {builder: coding, column: exam_code, system: exam_local, display_column: exam_name}
      subject.reference: {ref: {type: Patient, pid: mrn}}
      effectiveDateTime: {column: exam_date, type: date}
      # CGRD-A4 (D-816): the report body when the conclusion column is empty; masked as note text is
      conclusion: {column: conclusion, else: report_text, masked: true}
  - type: DocumentReference
    table: note
    id: {hid: note_no}
    profile: https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/DocumentReference-twcore
    elements:
      status: {const: current}
      type.coding[0].system: {template: "{sys.loinc}"}
      type.coding[0].code: {column: note_type, map: {progress: 11506-3, admission: 34117-2, discharge: 18842-5, consult: 11488-4, nursing: 34746-8}, default: 11506-3}
      type.text: {column: note_type}
      subject.reference: {ref: {type: Patient, pid: mrn}}
      date: {column: note_datetime, type: instant}
      context.encounter[0].reference: {ref: {type: Encounter, hid: enc_no}}
      content[0].attachment.contentType: {const: "text/plain; charset=utf-8"}
      content[0].attachment.data: {base64: text}
  - type: Claim
    table: claim
    id: {hid: claim_no}
    elements:
      status: {const: active}
      type.coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/claim-type", code: pharmacy}}
      use: {const: preauthorization}
      patient.reference: {ref: {type: Patient, pid: mrn}}
      created: {column: created_date, type: date}
      provider.reference: {const: Organization/hospital}
      priority.coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/processpriority", code: normal}}
      insurance[0].sequence: {const: 1}
      insurance[0].focal: {const: true}
      insurance[0].coverage.reference: {ref: {type: Coverage, hid: mrn}}
      item[0].sequence: {const: 1}
      item[0].productOrService.coding[0]: {builder: coding, column: product_code, system: nhi_drug}
      subType.coding[0]: {builder: coding, column: apply_type, system: apply_type}
  - type: ClaimResponse
    table: claim
    id: {hid: claim_no}
    elements:
      status: {const: active}
      type.coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/claim-type", code: pharmacy}}
      use: {const: preauthorization}
      patient.reference: {ref: {type: Patient, pid: mrn}}
      created: {column: created_date, type: date}
      insurer.reference: {const: Organization/nhi}
      request.reference: {ref: {type: Claim, hid: claim_no}}
      outcome: {column: outcome, map: {approved: complete, denied: complete, pending: queued}, default: queued}
      disposition: {column: outcome}
      preAuthPeriod: {builder: period, start: approval_start, end: approval_end, type: date}
  - type: Consent
    table: registry
    id: {hid: mrn}
    elements:
      status: {const: active}
      scope.coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/consentscope", code: research}}
      category[0].coding[0]: {const: {system: "http://loinc.org", code: "59284-0"}}
      patient.reference: {ref: {type: Patient, pid: mrn}}
      dateTime: {column: consent_date, type: date}
      policyRule.coding[0]: {const: {system: "http://terminology.hl7.org/CodeSystem/v3-ActCode", code: OPTIN}}
      provision.type: {column: consent_contact, map: {Y: permit, N: deny}, default: deny}
