# Site mapping template — source type `cgrd_sql` (one table or view per logical table; DSN from settings.data_source.dsn_env).
# 1. Copy to deploy/site/mapping/tw_core/<site>.yaml, never into the image (keep `extends`: the shared TW Core
#    mapping comes from the image; the adapter looks in deploy/site/mapping first, T-632).
# 2. For every table: set `source` (table or view name), `rename` local -> canonical columns (CANONICAL.md),
#    `values` local -> canonical codes. `source` may name a view the DBA creates for TrialBox (read-only account).
# 3. Copy lab_local_to_loinc.csv next to it and replace the local lab codes (local_code -> LOINC).
#    The lab table must map the result's own unit column to `unit` (`UNIT: unit` below): every lab row is checked
#    against the lookup's unit (R-31, D-215) and a row in another unit has no value (`unit_mismatch`). When the
#    site reports an analyte in another unit, set the lookup's `source_unit` and `factor` (mapping_check proposes
#    the factor) and, if the lookup's `ucum` changes, the matching `unit_defaults` line (D-149, D-334; inherited
#    from tw_core/demo_his.yaml until this file declares its own).
# 4. First look at the real source (T-731, D-588; the connection string stays in the environment variable):
#      python tools/mapping_check.py --mapping <file> --source cgrd_sql --dsn-env HIS_DSN --columns-only --share columns.json
#      python tools/mapping_check.py --mapping <file> --source cgrd_sql --dsn-env HIS_DSN --day <YYYY-MM-DD> --rows 20000 --share day.json
#    The two share files hold names, shapes and counts, never a row value: only they may leave the site.
# 5. settings.yaml: data_source: {type: cgrd_sql, dsn_env: HIS_DSN, mapping: mapping/tw_core/<site>.yaml}
# `delta: updated_at` is the row's change time (`--since` nights); map the column that changes on every edit.
# Dates (D-589): a column written in the Republic-of-China calendar (1150501, 115/05/01) or a Japanese era is
# declared on its table, e.g. `dates: {sample_datetime: roc}` (words: roc, era; undeclared: western). Nothing is
# detected from the values; a value of another form in a declared column is a refused row. Placeholder dates the
# source writes for "none" are listed once at the top, as written: `empty_dates: ["9999-12-31", "99991231"]`.
# Units (D-590): a spelling of a known unit that the box does not read yet is declared once at the top, e.g.
# `unit_spellings: {"萬/μL": "10*4/uL"}` (spelling as the source writes it -> UCUM code). The night counts results
# that lost their value to a unit (`unit_mismatch`) per lab code; mapping_check lists the pairs.
version: 1
name: SITE_his
extends: ../tw_core/demo_his.yaml
tz: Asia/Taipei
# NEW-STD-1 (D-586): Taiwan's NHI coded diagnoses in ICD-9-CM until 2015-12-31. A diagnosis keyed before this day
# (`recorded_date`; the day of the diagnosis when the row has no keyed day) carries the ICD-9-CM code system, never
# ICD-10-CM. A site whose export has a column that says the edition renames it to `diag_code_system` and translates
# its words to icd9cm / icd10cm under `values:`; the row's own word wins over the dates. The day is written
# YYYY-MM-DD. After setting or changing it, run one full load (a delta night re-reads changed rows only). Remove
# the line only for a site whose every diagnosis is ICD-10-CM.
params: {icd9cm_before: "2016-01-01"}
tables:
  patient:
    source: PATIENT_VIEW
    key: mrn
    rename: {CHART_NO: mrn, PT_NAME: name, ID_NO: id_no, BIRTH_DATE: birth_date, SEX: sex, DEATH_DATE: death_date}
    values: {sex: {"1": M, "2": F}}
    identity: {name: name, national_id: id_no}
  practitioner:
    source: STAFF_VIEW
    key: staff_id
    rename: {DOC_ID: staff_id, DOC_NAME: name, DEPT: dept_code}
  encounter:
    source: VISIT_VIEW
    key: enc_no
    delta: updated_at
    rename: {UPDATE_TIME: updated_at, VISIT_NO: enc_no, CHART_NO: mrn, VISIT_TIME: visit_datetime, DEPT: dept_code, DOC_ID: staff_id, VISIT_TYPE: enc_type}
    values: {enc_type: {O: OPD, I: IPD, E: ER}}
  appointment:
    source: BOOKING_VIEW
    key: appt_no
    rename: {BOOK_NO: appt_no, CHART_NO: mrn, BOOK_TIME: appt_datetime, MINUTES: duration_min, DOC_ID: staff_id, DEPT: dept_code, BOOK_STATUS: status}
  diagnosis:
    source: DIAG_VIEW
    key: diag_no
    delta: updated_at
    rename: {UPDATE_TIME: updated_at, DIAG_ID: diag_no, VISIT_NO: enc_no, CHART_NO: mrn, ICD10_CODE: icd10, DIAG_DATE: diag_date, KEYIN_DATE: recorded_date, DIAG_STATUS: status}
  lab:
    source: LAB_VIEW
    key: lab_no
    delta: updated_at
    rename: {UPDATE_TIME: updated_at, LAB_ID: lab_no, CHART_NO: mrn, ITEM_CODE: local_code, ITEM_NAME: item_name, RESULT: result_value, UNIT: unit, SAMPLE_TIME: sample_datetime}
  vital:
    source: VITAL_VIEW
    key: vital_no
    delta: updated_at
    rename: {UPDATE_TIME: updated_at, VS_ID: vital_no, CHART_NO: mrn, MEASURE_TIME: measure_datetime, HEIGHT: height_cm, WEIGHT: weight_kg, SBP: sbp, DBP: dbp}
  medication:
    source: RX_VIEW
    key: rx_no
    delta: updated_at
    rename: {UPDATE_TIME: updated_at, RX_ID: rx_no, CHART_NO: mrn, NHI_CODE: nhi_drug_code, ATC_CODE: atc, DRUG_NAME: drug_name, ORDER_DATE: order_date, START_DATE: start_date, END_DATE: end_date, DOSE: daily_dose, DOSE_UNIT: dose_unit, RX_STATUS: status, DEPT: dept_code}
  procedure:
    source: PROC_VIEW
    key: proc_no
    delta: updated_at
    rename: {UPDATE_TIME: updated_at, PROC_ID: proc_no, CHART_NO: mrn, ORDER_CODE: order_code, PROC_NAME: proc_name, PROC_DATE: proc_date}
  report:
    source: EXAM_VIEW
    key: rpt_no
    delta: updated_at
    rename: {UPDATE_TIME: updated_at, EXAM_ID: rpt_no, CHART_NO: mrn, EXAM_CODE: exam_code, EXAM_NAME: exam_name, EXAM_DATE: exam_date, IMPRESSION: conclusion}
  note:
    source: NOTE_VIEW
    key: note_no
    delta: updated_at
    rename: {UPDATE_TIME: updated_at, NOTE_ID: note_no, CHART_NO: mrn, VISIT_NO: enc_no, NOTE_TIME: note_datetime, NOTE_TYPE: note_type, NOTE_TEXT: text}
  claim:
    source: NHI_APPLY_VIEW
    key: claim_no
    delta: updated_at
    rename: {UPDATE_TIME: updated_at, APPLY_NO: claim_no, CHART_NO: mrn, APPLY_DATE: created_date, DRUG_CODE: product_code, APPLY_TYPE: apply_type, RESULT: outcome, APPROVE_FROM: approval_start, APPROVE_TO: approval_end}
    values: {outcome: {Y: approved, N: denied, P: pending}}
  registry:
    source: CONSENT_VIEW
    key: mrn
    rename: {CHART_NO: mrn, CONTACT_OK: consent_contact, SIGN_DATE: consent_date}
lookups:
  lab: {file: lab_local_to_loinc.csv, key: local_code}
