# Site mapping template — Japan, source type `ssmix2` (SS-MIX2 standardized and extended storage, D-122, D-137).
# The reader (services/adapter/sources/ssmix2/source.py) turns ADT-00/12/22/52, PPR-01, OMP-01/02/11/12, OML-11 and the
# extended-storage documents into the canonical tables (templates/CANONICAL.md), so no `rename` is needed here;
# extended CSVs (vital, note, ...) use canonical column names too.
# 1. Copy to services/adapter/mapping/jp_core/<site>.yaml (keep `extends`: the resource definitions are shared).
# 2. Replace the sample codes in jlac10_to_loinc.csv (JLAC10 -> LOINC), byomei_to_icd10.csv (標準病名 -> ICD-10, used
#    only when PRB-3 carries no ICD-10 and the site's licensed MEDIS release has no row; WHO ICD-10, not ICD-10-CM)
#    and yj_to_atc.csv (YJ -> ATC, used only when RXE-2 carries no ATC). Every sample row says `verify`: they are synthetic. Load the site's own
#    MEDIS, JLAC10 and YJ releases with `python -m adapter.licensed load` (D-137).
#    T-610: put the hospital's drug master (院内コード, YJ, HOT columns) here as drug_master.csv and its own
#    ingredient-to-ATC table (the columns of libs/tb_common/refdata_src/jp_yj_atc.csv) as ingredient_atc.csv; the
#    reader then resolves HOT and local codes to their ingredient and lists the codes it cannot read in reader.json.
# 3. python tools/mapping_check.py --mapping <file> --source ssmix2 --path <storage root>
# 4. settings.yaml: data_source: {type: ssmix2, path: <storage root>, mapping: mapping/jp_core/<site>.yaml}
# JP Core (D-137): the shared resources carry JP Core 1.1.0 profiles here (`profiles`), with the elements JP Core asks
# for that the base set lacks (`overlay`); a sample is checked against them at every ingest (validate/jpcore.py).
# Japan codes diagnoses in WHO ICD-10 (2013, through MEDIS 標準病名), not ICD-10-CM (D-314): every Condition carries
# the WHO code under `systems.icd10` (http://hl7.org/fhir/sid/icd-10), so E14, I64 or F00 stay the WHO codes they are.
# Where ICD-10-CM has the very same code (E11.9, M10.9) the reader also gives it as ICD-10-CM (`icd10cm`, D-137's
# rule) and that coding comes first, the one the lake reads; a WHO-only code reaches the lake under the WHO URI.
version: 1
name: ssmix2_site
extends: ../tw_core/demo_his.yaml
tz: Asia/Tokyo
fhir_profiles: jp-core   # the ingest checks a sample against JP Core (adapter.validate.jpcore)
systems:
  icd10: http://hl7.org/fhir/sid/icd-10        # WHO ICD-10 (D-314), Japan's diagnosis code system
  nhi_drug: urn:oid:1.2.392.100495.20.1.73   # YJ code (JP Core NamingSystem); the canonical column keeps its name nhi_drug_code
  hot9: urn:oid:1.2.392.200119.4.403.1       # HOT9 (JP Core NamingSystem)
  lab_local: urn:oid:1.2.392.200119.4.504    # JLAC10 (JP Core)
  lab_hospital: urn:trialbox:local:lab-code  # a lab code of the hospital's own (site set-up's local lab codes, D-135)
  claim_product: urn:trialbox:local:drug-code  # a claim's product code: the hospital's own drug code, not YJ
  byomei: urn:oid:1.2.392.200119.4.101.6     # MEDIS 病名交換用コード (verify)
  rp_no: urn:oid:1.2.392.100495.20.3.81      # JP_MedicationRequest identifier:rpNumber
  rp_order: urn:oid:1.2.392.100495.20.3.82   # JP_MedicationRequest identifier:orderInRp
# The row-unit check (R-31, D-215) comes with `extends`: the lab Observation reads the reader's `unit` column, which
# is OBX-6, against the lookup's unit (`source_unit`, else `ucum`); a result in another unit has no value and the
# reason `unit_mismatch`. A JLAC10 row whose site reports another unit says so in `source_unit` and `factor`.
# D-149, D-334: the unit a feed result with a number and no unit is read in, per analyte (LOINC -> UCUM). It is the
# unit the lab lookup writes (its `ucum` column), so a lab row without a unit and a FHIR result without one land in
# the same unit; `tools/mapping_check.py` fails when the two disagree. Change both together.
unit_defaults:
  "3084-1": mg/dL     # urate
  "2160-0": mg/dL     # creatinine
  "4548-4": "%"       # HbA1c (NGSP)
  "1742-6": U/L       # ALT
  "4537-7": mm/h      # ESR
  "1988-5": mg/L      # CRP
  "8302-2": cm        # body height
  "29463-7": kg       # body weight
tables:
  patient: {source: patient, key: mrn, identity: {name: name}}
  practitioner: {source: practitioner, key: staff_id}
  encounter: {source: encounter, key: enc_no, delta: visit_datetime}
  appointment: {source: appointment, key: appt_no}
  diagnosis: {source: diagnosis, key: diag_no, delta: recorded_date}
  lab: {source: lab, key: lab_no, delta: sample_datetime}
  vital: {source: vital, key: vital_no, delta: measure_datetime}
  medication: {source: medication, key: rx_no, delta: order_date}
  procedure: {source: procedure, key: proc_no, delta: proc_date}
  report: {source: report, key: rpt_no, delta: exam_date}
  note: {source: note, key: note_no, delta: note_datetime}
  claim: {source: claim, key: claim_no, delta: created_date}
  registry: {source: registry, key: mrn}
lookups:
  lab: {file: jlac10_to_loinc.csv, key: local_code}
profiles:
  https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Patient-twcore: http://jpfhir.jp/fhir/core/StructureDefinition/JP_Patient
  https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Practitioner-twcore: http://jpfhir.jp/fhir/core/StructureDefinition/JP_Practitioner
  https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Encounter-twcore: http://jpfhir.jp/fhir/core/StructureDefinition/JP_Encounter
  https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Condition-twcore: http://jpfhir.jp/fhir/core/StructureDefinition/JP_Condition
  https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Observation-body-height-twcore: http://jpfhir.jp/fhir/core/StructureDefinition/JP_Observation_BodyMeasurement
  https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Observation-body-weight-twcore: http://jpfhir.jp/fhir/core/StructureDefinition/JP_Observation_BodyMeasurement
  https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Observation-bloodPressure-twcore: http://jpfhir.jp/fhir/core/StructureDefinition/JP_Observation_VitalSigns
  # injections too: JP_MedicationRequest_Injection needs medicationReference, and the lake reads medicationCodeableConcept
  https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/MedicationRequest-twcore: http://jpfhir.jp/fhir/core/StructureDefinition/JP_MedicationRequest
  https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/Procedure-twcore: http://jpfhir.jp/fhir/core/StructureDefinition/JP_Procedure
  https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/DiagnosticReport-twcore: http://jpfhir.jp/fhir/core/StructureDefinition/JP_DiagnosticReport_Common
  https://twcore.mohw.gov.tw/ig/twcore/StructureDefinition/DocumentReference-twcore: ""   # JP Core 1.1.0 has no DocumentReference profile
overlay:
  - type: Encounter
    table: encounter
    elements:
      status: {column: enc_status, default: finished}
      period.end: {column: end_datetime, type: datetime}
      classHistory[0].class.system: {template: "{sys.actcode}", when: {column: prev_enc_type, not_empty: true}}
      classHistory[0].class.code: {column: prev_enc_type, map: {OPD: AMB, IPD: IMP, ER: EMER}, when: {column: prev_enc_type, not_empty: true}}
      classHistory[0].period.start: {column: visit_datetime, type: datetime, when: {column: prev_enc_type, not_empty: true}}
      classHistory[0].period.end: {column: class_changed_at, type: datetime, when: {column: prev_enc_type, not_empty: true}}
      classHistory[1].class.system: {template: "{sys.actcode}", when: {column: prev_enc_type, not_empty: true}}
      classHistory[1].class.code: {column: enc_type, map: {OPD: AMB, IPD: IMP, ER: EMER}, when: {column: prev_enc_type, not_empty: true}}
      classHistory[1].period.start: {column: class_changed_at, type: datetime, when: {column: prev_enc_type, not_empty: true}}
  - type: Condition
    table: diagnosis
    elements:
      # 10B-3: the reader reads PRB-14 転帰 into A active, R resolved, I inactive (the patient died of it), M remission;
      # any other outcome is U, which has no clinical status and is unconfirmed (D-587), never active
      clinicalStatus.coding[0].system: {template: "{sys.condition_clinical}", when: {column: status, known: [A, R, I, M]}}
      clinicalStatus.coding[0].code: {column: status, map: {A: active, R: resolved, I: inactive, M: remission}, default: active, unmapped: ~}
      verificationStatus.coding[1].system: {template: "{sys.condition_verification}", when: {column: status, unknown_to: [A, R, I, M]}}
      verificationStatus.coding[1].code: {const: unconfirmed, when: {column: status, unknown_to: [A, R, I, M]}}
      # PRB-9 終了日 as the abatement, only on an inactive, resolved or remitted condition (FHIR's invariant con-4)
      abatementDateTime: {column: end_date, type: date, when: [{column: end_date, not_empty: true}, {column: status, in: [R, I, M]}]}
      code.coding[0]: {builder: coding, column: icd10cm, system: icd10cm}  # only when ICD-10-CM has the same code
      code.coding[1]: {builder: coding, column: icd10, system: icd10}      # WHO ICD-10, always (D-314)
      code.coding[2]: {builder: coding, column: byomei_code, system: byomei, display_column: byomei_name}
      code.text: {column: byomei_name}
  - type: Observation
    table: lab
    elements:
      code.coding[2]: {builder: coding, column: jlac10_code, system: lab_local, display_column: item_name}
      code.coding[3]: {builder: coding, column: hosp_lab_code, system: lab_hospital, display_column: item_name}
      code.text: {column: item_name}
      specimen.display: {column: specimen, default: 検体}
      referenceRange[0].text: {column: ref_range, when: {column: ref_range, not_empty: true}}  # OBX-7 (T-615a)
  - type: Patient
    table: patient
    elements:  # PID-30 Y without a PID-29 date (STD-013, T-615a); FHIR holds one deceased[x], so a date wins
      deceasedBoolean: {const: true, when: [{column: deceased, equals: "Y"}, {column: death_date, not_empty: false}]}
  - type: Claim
    table: claim
    elements:
      item[0].productOrService.coding[0]: {builder: coding, column: product_code, system: claim_product}
  - type: MedicationRequest
    table: medication
    elements:
      identifier[0].system: {template: "{sys.rp_no}"}
      identifier[0].value: {column: rp_no, default: "1"}
      identifier[1].system: {template: "{sys.rp_order}"}
      identifier[1].value: {const: "1"}
      medicationCodeableConcept.coding[2]: {builder: coding, column: hot_code, system: hot9}
  - type: DocumentReference
    table: note
    elements:
      type.coding[0].code: {column: note_type, map: {progress: 11506-3, admission: 34117-2, discharge: 18842-5, consult: 11488-4, nursing: 34746-8, report: 47045-0, document: 34133-9}, default: 11506-3}
