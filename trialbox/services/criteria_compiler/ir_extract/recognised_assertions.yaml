patterns:  # regular expressions (Python), matched at a position; each describes a number or a bound, nothing more. A code is
  # recognised only when it is one of the concept's own codes (from its value set), read as the concept itself
  number: '[-−+]?\d+(?:[.,]\d+)?(?:\s*(?:-|–|〜|~|to|至|到|から)\s*[-−+]?\d+(?:[.,]\d+)?)?'
