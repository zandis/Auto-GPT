    words: [hbs, hbe, hbc, hbs-ag, hba1c, a1c, fev1, fvc, lvef, egfr, bmi, inr, psa, cd4, ldl, ldl-c, alt, ast, bnp,
      nt-probnp, crp, esr, hbsag, hbeag, hbv dna, hcv rna, hiv rna, hiv-1 rna, das28, cdai, sdai, sledai, pasi,
      easi, edss, mmse, nihss, t-score, z-score, nyha, gold, gina, ecog, kps, ckd, uln, x uln, mmhg, mg/dl, mmol/l,
