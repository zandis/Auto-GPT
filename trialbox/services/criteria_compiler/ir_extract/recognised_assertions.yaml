# Card 10A-1d (D-1248): what a plain assertion looks like, the only shape of inclusion line that runs as "the
# patient has the coded concept". Read by criteria_compiler.ir_extract.recognition.
#
# A structured inclusion asks the presence of a concept. Its line runs only when every clause of it is made of the
# concept's name (or a listed synonym), other named concepts, and the words below, and nothing else. One word not listed here
# (a new verb, a person, a symbol, a plan, a prefix) and the line is held for a person: an unknown word is a reason to
# hold, never a reason to run. The cue rules of cards 10A-1 to 10A-1c still run as a second net: a line recognised
# here and cued there is held.
#
# How a word is matched. English and other Latin words: case does not matter, a space or hyphen between the words of
# an entry matches any run of spaces and hyphens, and an entry matches whole words only ("on" never matches inside
# "ongoing"). Japanese and Chinese: the entry as written, after NFKC (full-width letters and digits become ASCII,
# Ⅱ becomes II). A clause may be cut into entries in any way that uses them all; numbers, Roman numerals, TNM codes
# and the marks listed under `marks` need no entry.
#
# Each class lists the domains it applies to (`any`, or some of condition, medication, procedure, observation …):
# "refractory" qualifies a disease ("refractory epilepsy") but says a drug failed ("refractory to rituximab"), so it
# is listed for conditions only.
#
# Special classes:
# * `history`: says the patient has had the concept. Allowed unless the criterion's logic asks it active only
#   (clinical_status active, recurrence or relapse).
# * `links`: may join another concept the extractor named in the same clause to this one ("surgery for colorectal
#   cancer"). Another named concept with no link word before or after it holds the line.
# * `{X}` and `{O}` inside a word stand for this concept and for another named one: "requiring {O}" lets "heart
#   failure requiring dialysis" run (dialysis named) but never "patients requiring chemotherapy" (chemotherapy coded).
# * `ended`: words that say the concept ended or lies in the past ("last dose", "ago", 最終投与, 停用). A clause
#   with one (any clause; a word inside the coded name never counts) holds the line, unless the criterion's own
#   logic asks a past occurrence: its atom has a window that ends before the index day. Without one, it cannot be
#   told from the atom, so the line is held.
# * every clause of the line must be recognised, not only those that name the concept: what follows a full stop,
#   "but" or 但 may say the line is not a fact ("Pending central review.", "Father, aged 52."). In a clause that does
#   not name the concept, another named concept may stand alone.
# * `alternatives`: "or", 又は, 或 joining another named concept make it one arm of a choice. The clause is held,
#   unless the criterion's logic itself carries that arm: a concept the logic joins to this one by "or" is read as
#   one of this concept's names.
# * an abbreviation in brackets right after the name is recognised when its letters follow the name's in order
#   ("Type 2 diabetes mellitus (T2DM)"), never otherwise ("Colorectal cancer (FH)").
# * a line of kanji alone is read once, as Chinese when it has a character written only in Chinese, else as
#   Japanese; a word inside the coded name never counts.
# * exceptions: what "except", "other than", を除く, 以外, 除…外 name is cut out of the clause before it is read
#   ("any malignancy except basal cell carcinoma"); a line whose concept is the excepted one is held.
# * a class with `needs` counts only in a clause that also holds one of those words: "criteria" is an assertion in
#   "meeting the 2010 ACR/EULAR criteria", a definition in "criteria for hypertension".
#
# Adding a frame or a qualifier: add the words to the right class and language, then add to
# tests/fixtures/negated_inclusion/card_10a1d_development.tsv the line it lets run AND its nearest lines that must
# still hold (the same words with a plan, a person, a stop, a symbol), and run
#   python -m tools.negated_inclusion_score tests/fixtures/negated_inclusion/card_10a1d_development.tsv --rows
# A word that would let one must-hold line run does not go in. Never add a word that says the concept is absent,
# doubtful, planned, stopped, someone else's, or only a heading, a definition or an instruction.

marks: ",(){}/-–~〜:'\"%≥≤<>=+・、，（）「」『』×"  # no empty box "[ ]", blank 【　】, dash "—" or "±": those hold

holds:  # regular expressions over a clause as read ({X} this concept, {O} another named one): listed words that
  # together say otherwise. An entry may be {pattern, domains} to apply to some domains only.
  form_value: '{X}\s*[:=]\s*[-+]?\d+(?:[.,]\d+)?\s*$'  # a form's field and its coded value ("Asthma: 0", "高血圧：2")
  blank_field: '[:：]\s*[-−–—]\s*$|^\s*[-−–—]\s*$'  # a blank or dashed field ("Hypertension: —")
  zero: '(?<![A-Za-z\d.,\-−])0+(?:[.,]0+)?(?![\d.,])(?!\s*(?:-|–|to\b|〜|~|至|到|から))'  # a count or a value of zero
  schedule_day: '(?i)\b(?:days?|cycles?|weeks?|visits?)\s*[-−]?\d'  # a schedule ("on day 1", "cycle 1 day 1")
  schedule_cjk: '第\s*\d+\s*(?:天|日|週|周|次|個?療程|週期|周期|サイクル|コース|回)|\d+\s*日目'
  numbered_heading: '^\s*\d+(?:[.．]\d+)+[.)]?\s*\x00\s*[.。]?\s*$'  # a section number and a bare name ("5.2 Hepatitis B")
  count_upper_bound: '(?i)(?:\bup\s+to|\bat\s+most|\bno\s+more\s+than|\bnot\s+more\s+than|\bfewer\s+than|\bless\s+than|\bmaximum(?:\s+of)?|≤|<|至多|最多|不超過|不超过|少於|少于|未滿|未满|最大)\s*(?:\d+|one|two|three|four|five|[一二兩两三四五])\s*(?:prior\s+|previous\s+)?(?:lines?\b|regimens?\b|cycles?\b|courses?\b|doses?\b|times\b|ライン|レジメン|コース|サイクル|回|線|线|次|個?療程|个?疗程|週期|周期)|\d+\s*(?:lines?|regimens?|cycles?|courses?|doses?|ライン|レジメン|コース|サイクル|回|線|线|次|個?療程|週期)\s*(?:or\s+(?:less|fewer)|at\s+most|以下|未満|まで|以内|以內)'  # "up to 2 prior lines of X" includes none
  count_from_zero: '(?i)(?<![\d.])0\s*(?:-|–|to|〜|~|至|到|から)\s*\d+\s*(?:prior\s+|previous\s+)?(?:lines?|regimens?|cycles?|courses?|doses?|times|ライン|レジメン|コース|サイクル|回|線|线|次)'
  # an upper bound on a count or a dose of the concept itself, which zero meets ("<=2 hospitalizations for heart
  # failure", "Prednisone up to 10 mg/day", "プレドニゾロン10 mg/日以下", "低血糖發作每週不大於2次")
  count_bound_concept: '(?i)(?:<=|=<|≤|<|\bat\s+most|\bup\s+to|\bfewer\s+than|\bless\s+than|\bno\s+more\s+than|\bnot\s+more\s+than|\bnot\s+exceeding|\bmaximum(?:\s+of)?|\bmax\b\.?)\s*(?:\d+|one|two|three|four|five)\s*(?:[a-zµμ/]+\s+){0,2}?(?:of\s+)?\x00'
  count_bound_concept_after: '(?i)\x00(?:\s*(?:episodes?|attacks?|admissions?|hospitali[sz]ations?|events?|exacerbations?|flares?|relapses?|cycles?|lines?|doses?|dosage|courses?|times|number))?\s*[:=]?\s*(?:<=|=<|≤|<|less\s+than|fewer\s+than|up\s+to|at\s+most|no\s+more\s+than|not\s+more\s+than|not\s+exceeding|not\s+to\s+exceed|maximum(?:\s+of)?|max\b\.?)\s*\d|\x00[^;。]{0,12}?\d+\s*or\s+(?:fewer|less)\b'
  count_bound_concept_cjk: '\x00[^。；;，,]{0,10}?\d+(?:\.\d+)?\s*[^\d。；;，,]{0,6}?(?:以下|未満|まで|以內|以内|を超えない|超えない)|\x00[^。；;，,]{0,10}?(?:不超過|不超过|不大於|不大于|不多於|不多于|不高於|不高于|至多|最多|少於|少于|未滿|未满|≤|<)\s*\d|(?:至多|最多|不超過|不超过|最大)\s*\d+\s*\S{0,3}\x00'
  criteria_for: '(?i)^(?:(?!\b(?:meet|meets|meeting|fulfil\w*|satisf\w*|according|based)\b).)*\b(?:diagnostic\s+|classification\s+)?(?:criteria|classification|definition)\s+(?:for|of)\s+(?:the\s+)?(?:diagnosis\s+of\s+)?\x00'  # a definition, not the patient (unless the patient meets it)
  definition_after: '(?i)^(?:(?!\b(?:meet|meets|meeting|fulfil\w*|satisf\w*|according)\b).)*\x00\s*(?:diagnostic\s+)?(?:definition|criteria|classification)\b'  # "Sepsis definition per the 2016 criteria"
  below_detection: '(?i)(?:below|under|less\s+than|<)\s*(?:the\s+)?(?:lower\s+)?(?:limit\s+of\s+)?(?:detect\w*|quantif\w*|lloq|lod)\b|\bundetect\w*|\bnot\s+detect\w*|検出(?:限界)?(?:未満|以下|せず)|檢測(?:下限|不到)|检测不到|测不到|檢測不出'
  test_of_for: '(?i)\b(?:vaccin\w*|immuni[sz]\w*|prophylaxis|screen\w*|surveillance|tests?|testing|serology|cultures?|monitoring)\s+(?:for|against|of)\s+(?:the\s+)?\x00'  # "Vaccination for hepatitis B"
  non_fact_after:  # a word after a disease name that makes it something else ("malaria medication", "breast cancer gene")
    domains: [condition]
    pattern: '(?i)\x00[\s\-]*(?:medications?|medicines?|drugs?|therap(?:y|ies)|treatments?|agents?|regimens?|vaccin\w*|immuni[sz]ation|prophylaxis|prevention|screening|surveillance|tests?|testing|serology|cultures?|antibod(?:y|ies)|carriers?|genes?|risk|education|clinic|programmes?|programs?|guidelines?)\b|\x00(?:に対する|の)?(?:ワクチン|予防接種|治療薬|スクリーニング|検査|抗体|血清|培養)|\x00[之的]?(?:疫苗|藥物|药物|篩檢|筛检|檢查|检查|檢測|检测|抗體|抗体|血清學|血清学|培養|培养|影像)'

ended:  # regular expressions over a clause as read: the concept ended or lies in the past (see the head). An entry
  # may be {pattern, unless}: "ago" after a diagnosis date is not an ending
  en:
    - '(?i)\blast\s+(?:dose|administration|infusion|injection|cycle|course|treatment|use)\b|\bstopped\b|\bdiscontinu\w*|\bcompleted\b|\bended\b|\bceased\b|\bfinished\b|\bwash-?\s?out\b|\bno\s+longer\b|\bwithdrawn\b|\btapered\s+off\b|\bdeprescribed\b'
    - {pattern: '(?i)\bago\b', unless: '(?i)\b(?:diagnos\w*|onset|first\s+(?:noted|seen|documented))\b'}
  ja:
    - '最終投与|最終使用|最終|中止|終了|休薬|完了|離脱|前に(?:投与|使用|服用|施行)'
  zh:
    - '停用|停藥|停药|停止|結束|结束|最後一次|最后一次|末次|已完成|完成|已停'

exceptions:  # regular expressions: an exception and what it names, cut out of a clause (D-1248)
  en_after: '(?i)\b(?:except(?:\s+for)?|other\s+than|excluding|apart\s+from|aside\s+from|but\s+not)\b[^;.\n]*'
  cjk_before: '[^,，、。；;（(\n]*(?:を除く|を除き|を除いた|以外の|以外之|以外的|以外)'
  zh_around: '除(?:了)?[^,，。；;\n]{1,20}?(?:以外|之外|外)[之的]?'

patterns:  # regular expressions (Python), matched at a position; each describes a number, nothing more. A code is
  # recognised only when it is one of the concept's own codes (from its value set), read as the concept itself
  number: '[-−+]?\d+(?:[.,]\d+)?(?:\s*(?:-|–|〜|~|to|至|到|から)\s*[-−+]?\d+(?:[.,]\d+)?)?'
  roman: '(?<![A-Za-z])(?:i{1,3}|iv|vi{0,3}|ix)[abc]?(?![A-Za-z])'
  tnm: '(?<![A-Za-z])[ytpc]?[tnm](?:[0-4]|x|is)[a-d]?(?![A-Za-z])'
  cjk_number: '[一二兩两三四五六七八九十百]+'

after_concept:  # measures recognised by their shape, only after the concept's own mention: a name ending in a
  # measure's head word, then a number ("left ventricular ejection fraction ≤ 40%", "PANSS total score ≥ 70", "Hoehn
  # and Yahr stage 2-3", 骨密度, 總分). A name about risk, prediction, screening or family is never one
  en_head: '(?i)(?:(?!(?:risk|probab\w*|likelihood|predict\w*|screen\w*|family|dose|dosage|use|exposure|duration|is|are|was|were|be|been|being|as|defined|define|definition|if|when|unless|not|no|to|at|by|for|with|in|on|or)\b)[a-z][a-z0-9''\-]*\s+){0,5}(?:total\s+)?(?:score|scale|stage|grade|class|index|fraction|level|count|ratio|volume|rate|density|pressure|clearance|saturation|concentration|percentile)\s*(?:of\s+)?(?:<=|>=|=<|=>|[<>≤≥=])?\s*[-−]?\d+(?:[.,]\d+)?(?:\s*(?:-|–|to)\s*[-−]?\d+(?:[.,]\d+)?)?\s*(?:%|[a-zµμ/²]+(?:/[a-z0-9.²]+)*)?'
  en_compare: '(?i)(?:(?!(?:risk|probab\w*|likelihood|predict\w*|screen\w*|family|dose|dosage|use|exposure|duration|of|and|the|is|are|was|were|be|been|being|as|defined|define|definition|if|when|unless|not|no|to|at|by|for|with|in|on|or)\b)[a-z][a-z0-9''\-]*\s+){1,5}(?:<=|>=|=<|=>|[<>≤≥])\s*[-−]?\d+(?:[.,]\d+)?\s*(?:%|[a-zµμ/²]+(?:/[a-z0-9.²]+)*)?'
  cjk_head: '[^\s、。，,；;：:()（）]{0,10}?(?:値|率|量|スコア|点|濃度|密度|指数|指數|总分|總分|評分|评分|分數|分数|分類|分期)\s*[:：はが]?\s*(?:[<>≤≥=]\s*)?[-−]?\d+(?:\.\d+)?\s*(?:%|[a-zA-Zµμ/²]+(?:/[a-zA-Z0-9.²]+)*|点|分)?\s*(?:以上|以下|未満|超)?'

