# ---------------------------------------------------------------------------------------------------------------
# Unlisted words (D-1248, the rule as adopted). A closed list of every word a criterion may use holds most ordinary
# lines (88 of 100 realistic plain lines at the experiment's last head). So an unlisted word may be read, but only as
# a content word (a noun or an adjective) and only where a content word cannot change whether the concept is present:
#
# * never a closed-class word (`closed_class`): an article, a pronoun, an auxiliary, a modal, a conjunction or a
#   preposition is read only as part of a listed word or shape. "if", "when", "whose", "his", "will", "may", "to be"
#   carry what makes a line something other than a fact;
# * never a word shaped like a verb form ("-ed", "-ing", "n't"), and in Japanese never hiragana: what is said OF the
#   concept is a verb, and verbs are listed (diagnosed, confirmed, 診断された, 確診);
# * never what is attached to the concept and governs it: the word right after the name ("<X> screening"), in
#   Japanese and Chinese everything after the name up to the next mark and the owner before の / 之 / 的, in English
#   the phrase whose preposition governs the name (`governors`: "diagnosis of", "history of"; "vaccination for" is
#   not one);
# * never a word of a class that says the concept is not a present fact of this patient (`unlisted_never`: doubt, a
#   plan, a wish, a risk, another person, an ending, a refusal, an alternative);
# * right before the name only an adjective (not a plural or a verb's "-s", not a possessive), and in Chinese only a
#   run that ends as a modifier does (性, 型, 期, 度, 的, 之);
# * at most 12 in an English clause, 8 runs in a Japanese or Chinese one; none in a clause that names no coded
#   concept ("Pending central review." must be listed words throughout).
