# Where the acting PERSON of each changing route of the orchestrator comes from (T-715, D-483).
#
# route_callers.yaml (D-464) says which SERVICE may call a route. This table says how the route learns the person,
# per route group of that file, for the group's changing routes (every method but GET, HEAD and OPTIONS). Every
# group with a changing route is in exactly one stage; tests/unit/test_actor_routes.py walks the app and fails on a
# changing route whose group is in no stage, whose dependency is not its stage's, or (stage `refuse`) whose request
# model has a field that names a person.
#
#   refuse     the route has `require_actor(<action>)`: a verified v3 assertion for this action, this study, this
#              request and this body, and the matrix asked again. No field of the body names a person.
#   report     the route has `report_actor`: a call without a valid v3 assertion is counted and logged
#              (orchestrator.actor.UNSIGNED) and let through; the person is still the body's `by`. This list only
#              shrinks: a router leaves it for `refuse` when the console signs its calls.
#   v2         the handler verifies the older signed assertion itself (a name, a session, a role, a study list;
#              D-143, D-146, D-273); to be moved to v3 with their own cards' checks (T-716: the grant).
#   no_person  no person acts; each with its reason.
schema: tb-orchestrator-actors/1

refuse:
  - lifecycle
  - sponsor
  - job_reveal            # a chart number: the grant and the delegation log are read by the orchestrator (T-716, D-484)
  - registry              # T-715b (D-550): a status change and a promotion, by the verified requester
  - study                 # T-715d (D-554): the study's set-up, its REDCap link and the box's connections
  - dataops               # NEW-SEC-4 (D-760): the steward's accept of a held night (dataops.decide)
  - datacore              # T-715f (D-799): the study's set-up, data entry and an SAE report's day sent

report:
  - setup

v2:
  - jobs_start            # the signed role authorises a console job; a mailed job has no person (D-146, D-464)
  - job_cancel
  - job_retry_scheduled
  - notices
  - edc

no_person:
  models_canary: the pair canary of the box; it changes no record and names nobody
  patients: a read sent as POST (pseudonyms in the body); nothing changes

# service principals: a console timer has no session. Each may take only the actions listed, on routes that say so.
principals:
  service:console-notify:   # the morning notices bring the participants up to date before they count them
    - study.setup
    - phi.view    # NEW-SEC-1 (D-717): the morning mail reads the day's visits, subjects and serious AEs (D-134, D-277)
  service:console-optout-check:   # T-719: is a running case's subject on the opt-out register? (POST /setup/pseudonym)
    - optout.keep
  service:console-nightly:  # the nightly REDCap read: the steps it derives name the timer, not a typed name
    - request.prepare

# NEW-SEC-1 (D-717): every GET route of the app that returns no patient's row, with why. The routes that return one
# are in libs/tb_common/patient_reads.py and take a verified claim for phi.view on their study. A GET route in
# neither list stops the orchestrator at import (orchestrator.actor.route_problems).
reads_without_patient:
  GET /healthz: "the service's health, without sign-in"
  GET /openapi.json: "FastAPI's own schema of the routes"
  GET /docs: "FastAPI's own schema page"
  GET /docs/oauth2-redirect: "FastAPI's own schema page"
  GET /redoc: "FastAPI's own schema page"
  GET /models: "the model registry's state and the box's status lines; counts, no patient"
  GET /metrics: "counters of the service"
  GET /rulesets/{ruleset}: "a study's criteria, approved versions and drafts"
  GET /jobs: "job records (type, state, who asked, the names of their files); the rows are in the files, which the console reads from the object store"
  GET /jobs/waiting-studies: "study ids only (D-545)"
  GET /jobs/{job_id}: "one job record (type, state, options, the names and keys of its files, counts); no row of a patient"
  GET /studies/{rs}/settings: "a study's settings"
  GET /studies/{rs}/screen-scope: "which doctors' patients a study screens (practitioner ids)"
  GET /redcap/connections: "the box's REDCap connections, without their tokens"
  GET /redcap/connections/{ref}/dictionary: "a REDCap project's data dictionary (fields, not records)"
  GET /studies/{rs}/forms: "a study's forms (fields and choices)"
  GET /studies/{rs}/sources: "a study's sources and which source owns each field, without any record value"
  GET /studies/{rs}/schedule: "a study's visit schedule and its versions"
  GET /studies/{rs}/sae-rule: "a study's SAE reporting rule"
  GET /studies/{rs}/contact-rule: "a study's contact limits"
  GET /studies/{rs}/sponsor/layout: "the sponsor's screening-log layout (column names)"
  GET /setup/templates/{name}: "a blank template file (the hospital-code sheet lists the site's local codes, no patient)"
  GET /setup/{ws}/readiness: "the readiness answer: counts and what is missing"
  GET /setup/{ws}/codes: "the site's local codes with how often each came, no patient"
  GET /setup/{ws}/feasibility: "counts per criterion"
  GET /setup/terminology: "which licensed code lists are loaded"
  GET /setup/remote: "whether remote help is on"
  GET /studies/{rs}/edc/map/suggest: "suggested field mappings"
  GET /registry: "per study, counts of the registry's states"
  GET /registry/{ruleset}/export.xlsx: "every chart number of a study; the handler verifies the signed person, role and studies itself (v2, D-273, S-09) and audits it"
  # NEW-ARCH-3 (D-761): the night's data operations, read by the console's /data-ops page (D-443): a night's row
  # (source, snapshot, attempt, state, who changed it and when; its gate detail is counts and table names) and its
  # steps (old and new state, who, when, the reason typed); never a patient's row or identifier
  GET /dataops/can-publish: "whether this service can publish an accepted night (a yes or no)"
  GET /dataops/sources: "the newest night of each source: its batch row (states, counts, table names), no patient"
  GET /dataops/held: "the held nights: their batch rows (states, counts, table names), no patient"
  GET /dataops/counts: "how many nights in each state"
  GET /dataops/history: "nights' batch rows, newest first (states, counts, table names), no patient"
  GET /dataops/batches/{bid}: "one night's batch row (states, counts, table names), no patient"
  GET /dataops/batches/{bid}/steps: "one night's steps: old and new state, who, when, the reason typed; no patient"
