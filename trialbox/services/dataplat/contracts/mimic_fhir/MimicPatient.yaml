# Data contract (spec v4 §5.8.1, §6.14) for the MIMIC-IV FHIR demo v2.1.0 file MimicPatient (field names only).
# validation_max_pct 100: MIMIC is not TW Core, so the L2 structural error rate is reported, not gated (as v1).
contract_id: mimic_fhir/MimicPatient
version: 1.0.0
source: mimic_fhir
table: MimicPatient
kind: fhir_bulk
format: ndjson
owner: PhysioNet (open data, ODbL)
steward: steward-open-data@trialbox-dev.example
change_channel: open-data@trialbox-dev.example
latency_class: static
data_class: D4
keys:
  primary:
  - id
  patient: id
columns:
- name: birthDate
  type: string
  nullable: false
- name: communication
  type: array
  nullable: true
- name: deceasedDateTime
  type: string
  nullable: true
- name: extension
  type: array
  nullable: false
- name: gender
  type: string
  nullable: false
- name: id
  type: string
  nullable: false
  unique: true
- name: identifier
  type: array
  nullable: false
  privacy: direct_identifier
- name: managingOrganization
  type: object
  nullable: false
- name: maritalStatus
  type: object
  nullable: false
- name: meta
  type: object
  nullable: false
- name: name
  type: array
  nullable: false
  privacy: direct_identifier
- name: resourceType
  type: string
  nullable: false
  enum:
  - Patient
volume:
  min_rows: 1
  max_quarantine_share: 0.005
control_totals:
- count
- count_distinct_patient
required_for_publish: true
validation_max_pct: 100.0
