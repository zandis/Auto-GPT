# Data contract (spec v4 §5.8.1, §6.14) for the synthetic demo HIS export, table patient.
contract_id: demo_his/patient
version: 1.0.0
source: demo_his
table: patient
kind: file_drop
format: csv
owner: Hospital (controller)
steward: steward-research-informatics@site-a.example
change_channel: his-dba@site-a.example
latency_class: daily
data_class: D4
keys:
  primary:
  - mrn
  patient: mrn
columns:
- name: mrn
  type: string
  nullable: false
  unique: true
  privacy: direct_identifier
- name: name
  type: string
  nullable: false
  privacy: direct_identifier
- name: id_no
  type: string
  nullable: false
  privacy: direct_identifier
- name: birth_date
  type: date
  nullable: false
  privacy: quasi_identifier
  not_future: true
- name: sex
  type: string
  nullable: false
  privacy: quasi_identifier
  enum:
  - F
  - M
- name: death_date
  type: date
  nullable: true
  privacy: quasi_identifier
  not_future: true
- name: phone
  type: string
  nullable: false
  privacy: direct_identifier
volume:
  min_rows: 1
  max_quarantine_share: 0.005
control_totals:
- count
- count_distinct_patient
required_for_publish: true
