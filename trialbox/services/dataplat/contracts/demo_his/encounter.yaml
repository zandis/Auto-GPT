# Data contract (spec v4 §5.8.1, §6.14) for the synthetic demo HIS export, table encounter.
contract_id: demo_his/encounter
version: 1.0.0
source: demo_his
table: encounter
kind: file_drop
format: csv
owner: Hospital (controller)
steward: steward-research-informatics@site-a.example
change_channel: his-dba@site-a.example
latency_class: daily
data_class: D4
keys:
  primary:
  - enc_no
  patient: mrn
  watermark: visit_datetime
columns:
- name: enc_no
  type: string
  nullable: false
  unique: true
- name: mrn
  type: string
  nullable: false
  privacy: direct_identifier
- name: visit_datetime
  type: timestamp
  nullable: false
- name: dept_code
  type: string
  nullable: false
- name: staff_id
  type: string
  nullable: false
- name: enc_type
  type: string
  nullable: false
  enum:
  - ER
  - IPD
  - OPD
volume:
  min_rows: 1
  max_quarantine_share: 0.005
control_totals:
- count
- count_distinct_patient
- max_watermark
required_for_publish: true
