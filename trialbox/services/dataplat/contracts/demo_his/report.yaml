# Data contract (spec v4 §5.8.1, §6.14) for the synthetic demo HIS export, table report.
contract_id: demo_his/report
version: 1.0.0
source: demo_his
table: report
kind: file_drop
format: csv
owner: Hospital (controller)
steward: steward-research-informatics@site-a.example
change_channel: his-dba@site-a.example
latency_class: daily
data_class: D4
keys:
  primary:
  - rpt_no
  patient: mrn
  watermark: exam_date
columns:
- name: rpt_no
  type: string
  nullable: false
  unique: true
- name: mrn
  type: string
  nullable: false
  privacy: direct_identifier
- name: exam_code
  type: string
  nullable: false
- name: exam_name
  type: string
  nullable: false
- name: exam_date
  type: date
  nullable: false
- name: conclusion
  type: string
  nullable: false
  privacy: free_text
volume:
  min_rows: 1
  max_quarantine_share: 0.005
control_totals:
- count
- count_distinct_patient
- max_watermark
required_for_publish: true
