# Data contract (spec v4 §5.8.1, §6.14) for the synthetic demo HIS export, table claim.
contract_id: demo_his/claim
version: 1.0.0
source: demo_his
table: claim
kind: file_drop
format: csv
owner: Hospital (controller)
steward: steward-research-informatics@site-a.example
change_channel: his-dba@site-a.example
latency_class: daily
data_class: D4
keys:
  primary:
  - claim_no
  patient: mrn
  watermark: created_date
columns:
- name: claim_no
  type: string
  nullable: false
  unique: true
- name: mrn
  type: string
  nullable: false
  privacy: direct_identifier
- name: created_date
  type: date
  nullable: false
- name: product_code
  type: string
  nullable: false
- name: apply_type
  type: string
  nullable: false
- name: outcome
  type: string
  nullable: false
- name: approval_start
  type: date
  nullable: true
- name: approval_end
  type: date
  nullable: true
volume:
  min_rows: 1
  max_quarantine_share: 0.005
control_totals:
- count
- count_distinct_patient
- max_watermark
required_for_publish: true
