# Data contract (spec v4 §5.8.1, §6.14) for the synthetic demo HIS export, table medication.
contract_id: demo_his/medication
version: 1.0.0
source: demo_his
table: medication
kind: file_drop
format: csv
owner: Hospital (controller)
steward: steward-research-informatics@site-a.example
change_channel: his-dba@site-a.example
latency_class: daily
data_class: D4
keys:
  primary:
  - rx_no
  patient: mrn
  watermark: order_date
columns:
- name: rx_no
  type: string
  nullable: false
  unique: true
- name: mrn
  type: string
  nullable: false
  privacy: direct_identifier
- name: nhi_drug_code
  type: string
  nullable: false
- name: atc
  type: string
  nullable: false
- name: drug_name
  type: string
  nullable: false
- name: order_date
  type: date
  nullable: false
- name: start_date
  type: date
  nullable: false
- name: end_date
  type: date
  nullable: false
- name: daily_dose
  type: decimal
  nullable: false
- name: dose_unit
  type: string
  nullable: false
- name: status
  type: string
  nullable: false
- name: dept_code
  type: string
  nullable: false
volume:
  min_rows: 1
  max_quarantine_share: 0.005
control_totals:
- count
- count_distinct_patient
- max_watermark
required_for_publish: true
