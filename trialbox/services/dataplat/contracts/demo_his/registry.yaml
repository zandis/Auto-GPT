# Data contract (spec v4 §5.8.1, §6.14) for the synthetic demo HIS export, table registry.
contract_id: demo_his/registry
version: 1.0.0
source: demo_his
table: registry
kind: file_drop
format: csv
owner: Hospital (controller)
steward: steward-research-informatics@site-a.example
change_channel: his-dba@site-a.example
latency_class: daily
data_class: D4
keys:
  primary:
  - mrn
  patient: mrn
columns:
- name: mrn
  type: string
  nullable: false
  unique: true
  privacy: direct_identifier
- name: consent_contact
  type: string
  nullable: false
  enum:
  - N
  - Y
- name: consent_date
  type: date
  nullable: false
volume:
  min_rows: 1
  max_quarantine_share: 0.005
control_totals:
- count
- count_distinct_patient
required_for_publish: true
