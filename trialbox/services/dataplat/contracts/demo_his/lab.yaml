# Data contract (spec v4 §5.8.1, §6.14) for the synthetic demo HIS export, table lab.
contract_id: demo_his/lab
version: 1.0.0
source: demo_his
table: lab
kind: file_drop
format: csv
owner: Hospital (controller)
steward: steward-research-informatics@site-a.example
change_channel: his-dba@site-a.example
latency_class: daily
data_class: D4
keys:
  primary:
  - lab_no
  patient: mrn
  watermark: sample_datetime
columns:
- name: lab_no
  type: string
  nullable: false
  unique: true
- name: mrn
  type: string
  nullable: false
  privacy: direct_identifier
- name: local_code
  type: string
  nullable: false
- name: item_name
  type: string
  nullable: false
- name: result_value
  type: string
  nullable: false
- name: unit
  type: string
  nullable: true
- name: sample_datetime
  type: timestamp
  nullable: false
  not_future: true
volume:
  min_rows: 1
  max_quarantine_share: 0.005
control_totals:
- count
- count_distinct_patient
- max_watermark
required_for_publish: true
