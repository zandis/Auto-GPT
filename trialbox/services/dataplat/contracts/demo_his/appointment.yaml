# Data contract (spec v4 §5.8.1, §6.14) for the synthetic demo HIS export, table appointment.
contract_id: demo_his/appointment
version: 1.0.0
source: demo_his
table: appointment
kind: file_drop
format: csv
owner: Hospital (controller)
steward: steward-research-informatics@site-a.example
change_channel: his-dba@site-a.example
latency_class: daily
data_class: D4
keys:
  primary:
  - appt_no
  patient: mrn
columns:
- name: appt_no
  type: string
  nullable: false
  unique: true
- name: mrn
  type: string
  nullable: false
  privacy: direct_identifier
- name: appt_datetime
  type: timestamp
  nullable: false
- name: duration_min
  type: integer
  nullable: false
- name: staff_id
  type: string
  nullable: false
- name: dept_code
  type: string
  nullable: false
- name: status
  type: string
  nullable: false
  enum:
  - A
  - B
  - C
  - N
volume:
  min_rows: 1
  max_quarantine_share: 0.005
control_totals:
- count
- count_distinct_patient
required_for_publish: true
