# Data contract (spec v4 §5.8.1, §6.14) for the synthetic demo HIS export, table practitioner.
contract_id: demo_his/practitioner
version: 1.0.0
source: demo_his
table: practitioner
kind: file_drop
format: csv
owner: Hospital (controller)
steward: steward-research-informatics@site-a.example
change_channel: his-dba@site-a.example
latency_class: daily
data_class: D4
keys:
  primary:
  - staff_id
columns:
- name: staff_id
  type: string
  nullable: false
  unique: true
- name: name
  type: string
  nullable: false
  privacy: direct_identifier
- name: dept_code
  type: string
  nullable: false
volume:
  min_rows: 1
  max_quarantine_share: 0.005
control_totals:
- count
required_for_publish: true
