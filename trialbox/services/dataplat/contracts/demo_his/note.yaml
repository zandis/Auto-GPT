# Data contract (spec v4 §5.8.1, §6.14) for the synthetic demo HIS export, table note.
contract_id: demo_his/note
version: 1.0.0
source: demo_his
table: note
kind: file_drop
format: csv
owner: Hospital (controller)
steward: steward-research-informatics@site-a.example
change_channel: his-dba@site-a.example
latency_class: daily
data_class: D4
keys:
  primary:
  - note_no
  patient: mrn
  watermark: note_datetime
columns:
- name: note_no
  type: string
  nullable: false
  unique: true
- name: mrn
  type: string
  nullable: false
  privacy: direct_identifier
- name: enc_no
  type: string
  nullable: false
- name: note_datetime
  type: timestamp
  nullable: false
- name: note_type
  type: string
  nullable: false
- name: text
  type: string
  nullable: false
  privacy: free_text
volume:
  min_rows: 1
  max_quarantine_share: 0.005
control_totals:
- count
- count_distinct_patient
- max_watermark
required_for_publish: true
