  # ---------------------------------------------------------------- hosted bake-off builds (S1-14, DEV / D0 only)
  # A hosted build is one dated provider version of a model served by a third party (OpenRouter). It has no weights
  # to hash: a site pins it with tools/pin_provider.py, which writes a provider_pin descriptor (model id, dated
  # canonical slug, provider, quantisation, pin date) and its sha256 into the site override. The gateway then asks for
  # that provider only and refuses a response from any other model or provider. These builds exist to compare model
  # families before buying or loading weights; promotion to the box needs the local build above, pinned by weights.
