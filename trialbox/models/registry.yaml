  # ---------------------------------------------------------------- the embedder (T-607, D-429; LLM-013, LLM-014)
  # One build for the e-embed alias, served by embed-service (routing endpoint `embed`, route `vectors`). The
  # embedder is pinned like a model: tools/pin_model.py --build e-embed-1 --endpoint embed writes its manifest digest
  # into the site override, and embed-service in PRODUCTION loads only the weights that match it
  # (services/embed_service/embedder.py). D-429's criterion: safetensors weights from the publisher, so the
  # pickle-only incumbent is out and is never converted here. Which candidate wins is measured in G1 (T-004); until
  # that record names it, repository, revision, expected and the licence are null and the build can only be pinned
  # with --trust-first-use (an evaluation candidate, never promoted). The values to fill are listed in D-429.
  - build_id: e-embed-1
    alias: e-embed
    status: candidate
    serving: local
    served: {embed: null}
    sha256: null
    revision: 7b44caba5c06fd6f1ef1d2786261e636c38e4295
    repository: BAAI/bge-m3
    # ENG-003 (D-563; the owner's answers Q3 of D-494 and of 2026-11-12): the embedder is BGE-M3 at the last revision
    # of the publisher's own repository that carries model.safetensors (2,271,064,456 bytes). The publisher removed
    # that file one commit later (c400e3d6, "Delete model.safetensors", no reason given) and has shipped pickle
    # weights only since (main, 5617a9f6); D-429 refuses pickle weights. The other files of the two revisions are
    # the same. The folder a box holds is this revision without its three pickle files (pytorch_model.bin,
    # colbert_linear.pt, sparse_linear.pt: the dense vectors need none of them). The manifest of that folder is
    # written from its first hash on real files (lane G); until then `pin_model --install` reports the build as not
    # pinned and a PRODUCTION embed service refuses to start. Nothing is trusted on first use.
    expected: {manifest_sha256: null, revision: 7b44caba5c06fd6f1ef1d2786261e636c38e4295}
    provenance:  # D-392
      copy: publisher-subset
      source: BAAI/bge-m3
      revision: 7b44caba5c06fd6f1ef1d2786261e636c38e4295
      left_out: [pytorch_model.bin, colbert_linear.pt, sparse_linear.pt]  # pickle files, refused (D-429)
      note: the publisher removed model.safetensors after this revision; lane G compares its tensors with the
        current pytorch_model.bin once, before the manifest is written
    quantisation: none
    context_length: 8192
    family: embedder
    model_name: BGE-M3 (dense vectors, 1024 dimensions)
    licence: {name: MIT, spdx: MIT, verified: true, register: model-bge-m3}
    origin: {developer: Beijing Academy of Artificial Intelligence (BAAI), country: CN, non_prc: false}

