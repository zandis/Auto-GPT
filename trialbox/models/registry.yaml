# Model registry (spec v4 §8.4, S1-07): alias -> pinned build. The gateway resolves aliases only through this file
# (services/registry). Builds are immutable (MOD-7): a new revision is a new build_id.
#
# sha256 is the digest of the build's weight manifest (per-file SHA-256 list); for a `serving: hosted` build it is the
# digest of its provider_pin descriptor (registry.provider_pin_sha). A null sha256 means "not yet pinned": the registry
# refuses to route to such a build, except the stub in DEV/TEST. Hashes are filled in only from a
# verified download at qualification (MOD-2, MOD-8); none is guessed here.
#
# Licence rows (T-617b, LLM-012): `verified: true` only with `register: <id>`, a row of docs/licences/register.csv
# (kind model) that holds the check: the source repository, its revision, the licence URL, the date read and the
# licence text's sha256. The row's spdx and status must agree with this file. A build without a verified licence
# never moves past `candidate`, and `qualify` refuses a weight folder with no licence file. CI holds both files
# together: python -m tools.licence_register --check.
#
# Status rules for routing (MOD-7): production roles resolve to `champion`, `shadow:<role>` to `shadow`, evaluation
# roles to `qualified` or better; in DEV/TEST any status except `retired` and `suspended` may be used.
#
# T-012b (LLM-007, LLM-029): every local build names its `expected` weights: the manifest sha256 (the digest
# tools/pin_model.py computes over the visible files) and the upstream revision of the release, here taken from the
# measured serving record. `pin_model` refuses a folder whose manifest differs (the 16-byte folder of the review) and
# refuses to trust weights on first use when nothing is expected; the gateway refuses a pin that differs
# (weights_unexpected). Install pins `candidate`; only `pin_model --promote` with a passing `trialbox eval qualify`
# record makes a `champion`, and a PRODUCTION gateway refuses a champion without that record (champion_unqualified).
#
# T-674 (D-392; DEP-007, DEP-008, DEP-009, RSK-60): every local build has `provenance`: how the weights were got
# (`copy`: publisher-quantisation, own-copy or own-quantisation), the source repository and revision, the base model,
# the recipe and the licence file with their sha256. A deployed build (a GPU profile's pair, tools/pin_model.py
# PROFILE_PAIRS, and the front desk on the judge's server) has no null revision; a test holds this. A judge build
# names `chat_template`: the developer's template at a pinned revision, a file under the models root that compose
# passes to vLLM with --chat-template and that pin_model records in the pin. `bakeoff` marks a build that exists for
# a bake-off: its run's row in docs/plan/gpu-ledger.md and its state. No revision or sha256 here is guessed: a value
# not read from the source is null and is listed as remaining in D-392.
version: registry-2026-11-11.3

aliases:
  trialbox-stub: {class: J, description: "deterministic OpenAI-compatible stub (services/llm_stub), DEV/TEST only"}
  stub-verifier: {class: V, description: "the stub under a second served name, DEV/TEST only: a stub box's verifier"}
  j-workhorse: {class: J, description: "judge / workhorse (judging, extraction, intake, drafting)"}
  v-verifier: {class: V, description: "verifier (second opinion, second extraction)"}
  f-frontdesk: {class: F, description: "front desk (frontdesk_converse, tools, at least 64k context)"}
  g-guard: {class: G, description: policy and injection classifiers}
  e-embed: {class: E, description: "embeddings and reranking"}
  x-external: {class: X, description: "topology C external build (D0-D2), per contract"}

builds:
