  # (v-verifier, endpoint `verifier`, thinking off); a note criterion excludes only when both agree
  # (matching.cascade.judge.AgreementJudge). The same weights serve all three profiles; each profile pins its own
  # build because the context differs. The site pins the weights with tools/pin_model.py.
