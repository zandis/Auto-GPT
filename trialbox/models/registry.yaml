  # ---------------------------------------------------------------- DGX Spark (P-GB10) default pair
  # Recommended by the 2026-10-25 bake-off (eval/bakeoff/results/2026-10-25) and an independent comparison: gpt-oss-120b
  # as the judge, Gemma 4 26B-A4B-it as the verifier, a criterion blocking only when both agree
  # (matching.cascade.judge.AgreementJudge). Seed builds: the site pins the weights with tools/pin_model.py
  # (j-workhorse on endpoint `serving`, v-verifier on endpoint `verifier`; deploy/docker-compose.gb10.yml serves both).
  # The front desk on P-GB10 is the J build at 64k context (§8.4 table, NFR-B20), the same weights pinned again.
  - build_id: gpt-oss-120b-spark
    alias: j-workhorse
    status: candidate
    serving: vllm
    served: {serving: null}
    sha256: null
    revision: null
    repository: openai/gpt-oss-120b
    quantisation: MXFP4 (native release weights)
    context_length: 65536
    family: gpt-oss
    model_name: gpt-oss-120b
    licence: {name: Apache-2.0 (to confirm), spdx: Apache-2.0, verified: false}
    origin: {developer: OpenAI, country: US, non_prc: true}

