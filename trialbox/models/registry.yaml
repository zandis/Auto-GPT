# Model registry (spec v4 §8.4, S1-07): alias -> pinned build. The gateway resolves aliases only through this file
# (services/registry). Builds are immutable (MOD-7): a new revision is a new build_id.
#
# sha256 is the digest of the build's weight manifest (per-file SHA-256 list); for a `serving: hosted` build it is the
# digest of its provider_pin descriptor (registry.provider_pin_sha). A null sha256 means "not yet pinned": the registry
# refuses to route to such a build, except the stub in DEV/TEST. Hashes are filled in only from a
# verified download at qualification (MOD-2, MOD-8); none is guessed here. Licence facts marked verified: false
# must be confirmed by legal review before the build moves past `candidate`.
#
# Status rules for routing (MOD-7): production roles resolve to `champion`, `shadow:<role>` to `shadow`, evaluation
# roles to `qualified` or better; in DEV/TEST any status except `retired` and `suspended` may be used.
version: registry-2026-10-25.3

aliases:
  trialbox-stub: {class: J, description: "deterministic OpenAI-compatible stub (services/llm_stub), DEV/TEST only"}
  j-workhorse: {class: J, description: "judge / workhorse (judging, extraction, intake, drafting)"}
  v-verifier: {class: V, description: "verifier (second opinion, second extraction)"}
  f-frontdesk: {class: F, description: "front desk (frontdesk_converse, tools, at least 64k context)"}
  g-guard: {class: G, description: policy and injection classifiers}
  e-embed: {class: E, description: "embeddings and reranking"}
  x-external: {class: X, description: "topology C external build (D0-D2), per contract"}

builds:
  - build_id: trialbox-stub-1
    alias: trialbox-stub
    status: champion
    serving: stub
    served: {stub: trialbox-stub}
    sha256: null
    revision: null
    repository: services/llm_stub (this repository)
    quantisation: none
    context_length: null
    family: trialbox-stub
    licence: {name: Proprietary (TrialBox), spdx: null, verified: true}
    origin: {developer: TrialBox, country: TW, non_prc: true}

  # The same stub behind the front-desk and guard aliases, so Hermes profiles keep their committed aliases in DEV/TEST
  # (route dev-stub); unpinned, so never routable in VALIDATION or PRODUCTION.
  - build_id: f-frontdesk-stub-1
    alias: f-frontdesk
    status: champion
    serving: stub
    served: {stub: trialbox-stub}
    sha256: null
    revision: null
    repository: services/llm_stub (this repository)
    quantisation: none
    context_length: null
    family: trialbox-stub
    licence: {name: Proprietary (TrialBox), spdx: null, verified: true}
    origin: {developer: TrialBox, country: TW, non_prc: true}

  - build_id: g-guard-stub-1
    alias: g-guard
    status: champion
    serving: stub
    served: {stub: trialbox-stub}
    sha256: null
    revision: null
    repository: services/llm_stub (this repository)
    quantisation: none
    context_length: null
    family: trialbox-stub
    licence: {name: Proprietary (TrialBox), spdx: null, verified: true}
