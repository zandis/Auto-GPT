[project]
name = "trialbox"
version = "1.0.0"
description = "TrialBox: on-prem, email-driven eligibility compiler and patient-finding appliance"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "jinja2>=3.1",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "duckdb==1.5.5",
  "duckdb-extension-fts==1.5.5",
  "pyarrow>=17",
  "sqlglot>=25",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",  # durable steps, outbox and recall ledger on Postgres (S1-05, S1-12)
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "matplotlib>=3.9",
  "docxtpl>=0.18",
  "python-docx>=1.1",
  "pypdf>=6.21.4",  # layer-2 review R-19: advisories below 6.21.4 on the mailed-protocol path (D-185)
  "py7zr>=0.22",
  "cryptography>=43",
  "apscheduler>=3.10,<4",
  "numpy>=1.26",
  "fhir.resources>=8.0,<9",
  "python-dateutil>=2.9",
  "tzdata>=2024.1",
  "markdown>=3.7",
  "dulwich>=0.22",
  "zstandard>=0.23",  # .tbbak compression, zstd -3 multi-threaded (dataflow review P0-3, D-149)
]

[project.optional-dependencies]
# Heavy, image-specific extras. Installed only in the doc-parser / embed-service images.
docling = ["docling>=2.10"]
embed = ["sentence-transformers>=3.0"]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "datamodel-code-generator>=0.26",
  "types-PyYAML",
  "types-openpyxl",
  "types-reportlab",
  "types-python-dateutil",
  "types-jsonschema",
  "types-Markdown",
]

# The test plugin set (D-201, T-003): exactly these, pinned, and locked in uv.lock with everything else. `make venv`
# builds .venv with `uv sync --frozen --group test --extra dev`, which also removes anything installed by hand.
[dependency-groups]
test = [
  "pytest==9.2.0",
  "pytest-timeout==2.4.0",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
]

[project.scripts]
adapter = "adapter.cli:main"
trialbox-settings = "tools.settings_wizard:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# D-185: uv.lock is the one hashed lock; deploy/requirements.lock is its export (`make lock`, checked by `make
# lock-check`). Floors for transitive packages with advisories below them (layer-2 review R-19).
constraint-dependencies = ["pillow>=13"]
# the editable install of this project is rebuilt only when its metadata changes, so `make venv-check` (uv sync
# --check) does not report every edited source file as drift
cache-keys = [{ file = "pyproject.toml" }]

[tool.setuptools.packages.find]
where = ["libs", "services", "."]
include = [
  "tb_contracts*", "tb_common*", "mail_gateway*", "doc_parser*", "criteria_compiler*",
  "adapter*", "lake*", "orchestrator*", "llm_stub*", "embed_service*", "tools*",
  "tb_testkit*", "tb_llm*", "dataplat*", "gateway*", "registry*", "guard*", "tracestore*", "matching*", "channels*", "deliverables*", "console*",
]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.md", "*.cql", "*.sql", "*.j2", "*.html", "*.docx", "*.csv", "*.parquet", "*.ttf"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["libs/tb_contracts/generated", "docs/plan/design/tools"]  # design-set helpers, as delivered

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "S"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLC0415",
  "S101", "S603", "S607", "S608", "S311", "RUF001", "RUF002", "RUF003",
  "N815", "SIM108", "PLW2901", "S104", "S324", "S105", "S106", "PLR0917", "PLW0603", "N818", "N812", "RUF043",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802", "B018", "E501"]
"tests/console/test_role_pages.py" = ["F811"]  # pytest fixture imported from test_console_app and taken by name
"tests/console/test_entry_pages.py" = ["F811"]  # the same, for the data-core fixture of test_data_pages
"tests/console/test_team_pages.py" = ["F811"]  # the same fixture as test_role_pages (D-147)
"services/criteria_compiler/compile_*/generator.py" = ["E501"]
"services/criteria_compiler/review.py" = ["E501"]
"services/console/i18n.py" = ["E501"]
"services/console/i18n_home.py" = ["E501"]
"services/console/i18n_step2.py" = ["E501"]
"services/console/i18n_step3.py" = ["E501"]
"services/console/i18n_step4.py" = ["E501"]
"services/criteria_compiler/compile_cql/generator.py" = ["E501", "S701"]
"tools/**" = ["PLR", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["libs", "services", "."]
explicit_package_bases = true
namespace_packages = true
exclude = ["build/", "\\.venv/"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "docxtpl.*", "docx.*", "py7zr.*", "apscheduler.*", "sqlglot.*", "duckdb.*",
  "pyarrow.*", "matplotlib.*", "fhir.*", "docling.*", "sentence_transformers.*", "pypdf.*",
  "uvicorn.*", "numpy.*", "duckdb_extension_fts.*", "paddleocr.*", "fontTools.*", "markdown.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "libs", "services"]
# -p no:randomly: random order is a nightly job, not a default (D-201, §5.2); no:cacheprovider: no .pytest_cache
# shared between parallel runs. The basetemp keeps one run, and of it only the failed tests' directories.
addopts = "-ra --strict-markers -p no:randomly -p no:cacheprovider"
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
  "integration: needs docker compose services (fhir-store, mail)",
  "e2e: end-to-end through email against the compose test profile",
  "llm: requires a real LLM endpoint (GPU or cloud)",
  "perf: performance benchmarks",
  "egress: host nftables egress test (root, nft, iproute2, running compose stack; TB_EGRESS_TEST=1)",
  "slow: slow tests",
]
timeout = 900
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
