[project]
name = "trialgpt-local"
version = "0.1.0"
description = "NCBI TrialGPT on a local LLM (Ollama): interface, benchmark, trialgpt.app head-to-head, CGRD validation"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "python-multipart>=0.0.9",
  "rank-bm25>=0.2.2", "nltk>=3.8", "numpy>=1.26", "torch>=2.2", "transformers>=4.39", "openpyxl>=3.1",
  "pypdf>=4", "pyyaml>=6", "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]
cgrd-sql = ["sqlalchemy>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trialgpt_local*"]

[tool.setuptools.package-data]
trialgpt_local = ["static/*"]
"trialgpt_local.cgrd" = ["*.yaml", "*.csv"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor", "trialgpt_local/prompts.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["vendor/", "trialgpt_local/prompts.py"]

[[tool.mypy.overrides]]
module = ["trialgpt_local.prompts"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet (ClinicalTrials.gov / trialgpt.app)", "llm: needs a running local LLM"]
addopts = "-m 'not network and not llm'"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"trialgpt_local/app.py" = ["B008"]  # FastAPI's File() default is the documented idiom
