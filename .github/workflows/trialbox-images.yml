# TrialBox image gates (trialbox/docs/SECURITY.md §8; DECISIONS D-186). What ships is scanned, on both platforms:
#   images:     on each of amd64 and arm64, build trialbox-py, trialbox-jvm and trialbox-demo as `make images` and
#               demo/Dockerfile build them, then `make release-gates`: each image pinned by image id, the
#               third-party compose images pinned by registry digest for that platform; Trivy (DB loaded first, the
#               scan offline), Syft SBOMs, the licence gate, one record (gates.json) and dist/sbom/index.json.
#   multiarch:  for a release tag or a manual run, `make images-multiarch` into a registry on the runner, then the
#               gates on each platform of the pushed manifests, by digest: the images a site pulls.
# Runs on pull requests that change what goes into an image, on release tags, weekly (new advisories arrive without a
# code change) and by hand. A release is made only from a passing record: `make release-bundle` runs the gates and
# tools/make_bundle.sh --gates refuses an image that is not in it.
# REPORT MODE (owner decision 2026-11-10, until the follow-up): fixable CRITICAL/HIGH findings in trialbox-jvm,
# trialbox-demo and the third-party images are listed in the job summary and do not fail the job; trialbox-py's
# vulnerability gate, the licence gate and every scan or report error still fail it. A bundle never carries an image
# that passed only in report mode. Open findings: trialbox/deploy/security/known-image-findings.md.
# Every action is pinned to a commit (tag in the comment); Syft and Trivy come with pinned sha256.
name: TrialBox image gates

on:
  pull_request:
    paths:
      - "trialbox/uv.lock"
      - "trialbox/pyproject.toml"
      - "trialbox/deploy/**"
      - "trialbox/demo/**"
      - "trialbox/Makefile"
      - "trialbox/tools/supply_chain/**"
      - "trialbox/tools/make_bundle.sh"
      - ".github/workflows/trialbox-images.yml"
  push:
    tags: ["trialbox-v*"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trialbox-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: trialbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml

      - name: Python environment and pinned scanners
        run: make venv scanners

      - name: Images (installed from the hashed lock, pinned base)
        run: |
          make images
          docker build -f demo/Dockerfile -t trialbox-demo:step5 .

      # the only online Trivy step: fill the cache as `oras pull` fills it on the offline media
      - name: Trivy DB into the cache
        run: make trivy-db

      # --vuln-mode report (owner decision 2026-11-10, D-186): fixable CRITICAL/HIGH findings in the images of
      # tools/supply_chain/release.py VULN_REPORT_ONLY are listed in the job summary instead of failing, until the
      # follow-up (deploy/security/known-image-findings.md). Everything else still fails this step: trialbox-py's
      # findings, the licence gate, a build or scan error, a missing or empty report, an image not named by its scan.
      - name: Release gates (Trivy offline, SBOMs, licences, record)
        run: make release-gates SC_PLATFORM=${{ matrix.platform }} RELEASE_GATES_ARGS="--vuln-mode report"

      - name: Findings in the job summary
        if: always()
        run: |
          if [ -f build/supply-chain/summary.md ]; then cat build/supply-chain/summary.md >> "$GITHUB_STEP_SUMMARY"
          else echo "No gate record was written: the gates did not run to the end." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the record, SBOMs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-gates-${{ strategy.job-index }}
          path: |
            trialbox/build/supply-chain
            trialbox/dist/sbom
          if-no-files-found: warn
          retention-days: 90

  multiarch:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5000:5000"]
    defaults:
      run:
        working-directory: trialbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: network=host

      - name: Python environment and pinned scanners
        run: make venv scanners

      - name: images-multiarch into the runner's registry
        run: make images-multiarch REGISTRY=localhost:5000

      - name: Trivy DB into the cache
        run: make trivy-db

      - name: Release gates on both platforms of the pushed images
        run: >-
          make release-gates SC_DIR=build/supply-chain-multiarch RELEASE_GATES_ARGS="--insecure --vuln-mode report"
          SC_IMAGES="registry:localhost:5000/trialbox-py:1.0.0=linux/amd64 registry:localhost:5000/trialbox-py:1.0.0=linux/arm64
          registry:localhost:5000/trialbox-jvm:1.0.0=linux/amd64 registry:localhost:5000/trialbox-jvm:1.0.0=linux/arm64"

      - name: Findings in the job summary
        if: always()
        run: |
          if [ -f build/supply-chain-multiarch/summary.md ]; then cat build/supply-chain-multiarch/summary.md >> "$GITHUB_STEP_SUMMARY"
          else echo "No gate record was written: the gates did not run to the end." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the record, SBOMs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-gates-multiarch
          path: |
            trialbox/build/supply-chain-multiarch
            trialbox/dist/sbom
          if-no-files-found: warn
          retention-days: 90
