# TrialBox image gates (trialbox/docs/SECURITY.md §8; DECISIONS D-186). What ships is scanned, on both platforms:
#   images:     on each of amd64 and arm64, build trialbox-py, trialbox-jvm, trialbox-postgres and trialbox-demo as
#               `make images` and demo/Dockerfile build them, then `make release-gates`: each image pinned by image id, the
#               third-party compose images pinned by registry digest for that platform; Trivy (DB loaded first, the
#               scan offline), Syft SBOMs, the licence gate, one record (gates.json) and dist/sbom/index.json.
#               Then `make two-device-check` (T-214): the GB10 two-device compose split and the link selftest in the
#               image of that platform.
#   multiarch:  for a release tag or a manual run, `make images-multiarch` into a registry on the runner, then the
#               gates on each platform of the pushed manifests, by digest: the images a site pulls.
# Runs for a merge train and on master when what goes into an image changed, on release tags, weekly (new advisories
# arrive without a code change) and by hand; not on a card's pull request (D-578). A release is made only from a passing record: `make release-bundle` runs the gates and
# tools/make_bundle.sh --gates refuses an image that is not in it.
# The vulnerability gate blocks for every image a bundle can carry (T-110b, D-340, ENG-007): ours and the third-party
# HAPI FHIR and vLLM images, whose open findings are dated per-image entries of the allow-list. `--vuln-mode report`
# is left for the test-only mail servers (Mailpit, GreenMail), which no bundle carries; tools/make_bundle.sh refuses
# any image with a report-mode finding. Open findings: trialbox/deploy/security/known-image-findings.md.
# D-1343 (10G-41): the images job then runs `make image-scan`: hadolint, Trivy secret+misconfig and Dockle per image,
# report-only until 2026-12-17.
# Every action is pinned to a commit (tag in the comment); Syft, Trivy and Dockle come with pinned sha256.
name: TrialBox image gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]  # D-564: marking ready starts the full tier
    paths:
      - "trialbox/uv.lock"
      - "trialbox/pyproject.toml"
      - "trialbox/deploy/**"
      - "trialbox/demo/**"
      - "trialbox/Makefile"
      - "trialbox/tools/supply_chain/**"
      - "trialbox/tools/make_bundle.sh"
      # ENG-003 (D-563): what the PRODUCTION start of the embed service reads
      - "trialbox/services/embed_service/**"
      - "trialbox/tools/pin_model.py"
      - "trialbox/tools/tiny_embedder.py"
      - "trialbox/models/registry.yaml"
      - "trialbox/tests/integration/test_embed_production_start.py"
      - ".github/workflows/trialbox-images.yml"
  push:
    branches: [master]
    tags: ["trialbox-v*"]
    paths:  # the same list: master is scanned when what goes into an image changed (a tag is scanned always)
      - "trialbox/uv.lock"
      - "trialbox/pyproject.toml"
      - "trialbox/deploy/**"
      - "trialbox/demo/**"
      - "trialbox/Makefile"
      - "trialbox/tools/supply_chain/**"
      - "trialbox/tools/make_bundle.sh"
      - "trialbox/services/embed_service/**"
      - "trialbox/tools/pin_model.py"
      - "trialbox/tools/tiny_embedder.py"
      - "trialbox/models/registry.yaml"
      - "trialbox/tests/integration/test_embed_production_start.py"
      - ".github/workflows/trialbox-images.yml"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # the event is in the group (D-578): the weekly run or a run by hand does not cancel a master push's scan
  group: trialbox-images-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  images:
    # D-578: for a merge train, on master, for a release tag, weekly and by hand; not for a card's pull request (129
    # runs and about 2,900 billed minutes on 2026-11-12). A card that changes an image says so and goes on a train.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'train/')
    strategy:
      fail-fast: false
      matrix:
        # the arm64 leg for a train, master and a release tag; the weekly run and a run by hand scan amd64
        include: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push') && '[{"runner":"ubuntu-24.04","platform":"linux/amd64"},{"runner":"ubuntu-24.04-arm","platform":"linux/arm64"}]' || '[{"runner":"ubuntu-24.04","platform":"linux/amd64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: trialbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml

      # the registry scan of the largest third-party image unpacks it on the runner's disk; a hosted runner is left
      # with too little after the builds (the scan then dies with no message). Toolchains this job never uses go.
      - name: Free runner disk
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/node
          df -h /

      - name: Python environment and pinned scanners
        run: make venv scanners

      - name: Images (installed from the hashed lock, pinned base)
        run: |
          make images
          docker build -f demo/Dockerfile -t trialbox-demo:step5 .

      # ENG-003 (D-563): the box's compose file starts the embed service from trialbox-embed with
      # TB_ENV=PRODUCTION and weights pinned by the installer's own call (a tiny model made here, no download)
      - name: A PRODUCTION box starts its embed service
        run: make embed-start

      # T-214, D-373: the GB10 two-device form on this platform: both devices' rendered compose against
      # deploy/gb10-profile.yaml, and the link selftest (mutual TLS 1.3) inside the image just built. On the arm64 leg
      # this is the arm64 image, the one the Spark runs.
      - name: Two-device form (compose split, profile, link selftest in the image)
        run: make two-device-check

      # the only online Trivy step: fill the cache as `oras pull` fills it on the offline media
      - name: Trivy DB into the cache
        run: make trivy-db

      # --vuln-mode report touches only the test-only mail servers of tools/supply_chain/release.py VULN_REPORT_ONLY
      # (T-110b): their fixable CRITICAL/HIGH findings are listed in the job summary. Everything else fails this step:
      # a finding in any image a bundle carries that no dated allow-list entry accepts, the licence gate, a build or
      # scan error, a missing or empty report, an image not named by its scan.
      # the layers the builds cached are not what is scanned (the images are): they go before the largest scan
      - name: Drop the build cache
        run: |
          docker builder prune -af > /dev/null
          df -h /

      - name: Release gates (Trivy offline, SBOMs, licences, record)
        run: make release-gates SC_PLATFORM=${{ matrix.platform }} RELEASE_GATES_ARGS="--vuln-mode report"

      # D-1343 (10G-41, review 21 OT-3): three tools per image of SC_OWN_IMAGES: hadolint on its Dockerfile, Trivy
      # --scanners secret,misconfig (the image and its config) and Dockle; `trivy config` over deploy/docker and demo.
      # REPORT-ONLY until 2026-12-17 (D-1343): the command exits 0 and the step may not fail the job; from that date
      # IMAGE_SCAN_ARGS="--fail-at HIGH" and continue-on-error goes. The reports are kept with the gate record.
      - name: Image configuration scans (hadolint, Trivy secret and misconfig, Dockle; report-only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: make image-scan

      # Release hygiene item 5: the standing release gates over the tree (the code-pattern scanner at a pinned rule
      # commit, two secret scanners with no verification, the platform-manifest scanner on deploy/platform, the
      # Dockerfile linter on every Dockerfile), each image by version and digest. REPORT-ONLY until 2026-12-17, a
      # placeholder (date: by ruling): from that date STANDING_GATES_ARGS="--fail-at any" and continue-on-error goes.
      # Once per run: the tree is the same on both platforms.
      - name: Standing release gates (report-only)
        if: ${{ !cancelled() && matrix.platform == 'linux/amd64' }}
        continue-on-error: true
        run: |
          make standing-gates
          cat build/standing-gates/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Disk after the gates
        if: always()
        working-directory: /
        run: df -h /

      - name: Findings in the job summary
        if: always()
        run: |
          if [ -f build/supply-chain/summary.md ]; then cat build/supply-chain/summary.md >> "$GITHUB_STEP_SUMMARY"
          else echo "No gate record was written: the gates did not run to the end." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f build/image-scan/summary.md ]; then cat build/image-scan/summary.md >> "$GITHUB_STEP_SUMMARY"
          else echo "No image configuration scan was written (D-1343, report-only)." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the record, SBOMs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-gates-${{ strategy.job-index }}
          path: |
            trialbox/build/supply-chain
            trialbox/build/image-scan
            trialbox/build/standing-gates
            trialbox/dist/sbom
          if-no-files-found: warn
          retention-days: 90

  multiarch:
    # a release tag or a run by hand; a push to master (D-578) is not a release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5000:5000"]
    defaults:
      run:
        working-directory: trialbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: network=host

      # the registry scan of the largest third-party image unpacks it on the runner's disk; a hosted runner is left
      # with too little after the builds (the scan then dies with no message). Toolchains this job never uses go.
      - name: Free runner disk
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/node
          df -h /

      - name: Python environment and pinned scanners
        run: make venv scanners

      - name: images-multiarch into the runner's registry
        run: make images-multiarch REGISTRY=localhost:5000

      - name: Trivy DB into the cache
        run: make trivy-db

      - name: Release gates on both platforms of the pushed images
        run: >-
          make release-gates SC_DIR=build/supply-chain-multiarch RELEASE_GATES_ARGS="--insecure --vuln-mode report"
          SC_IMAGES="registry:localhost:5000/trialbox-py:1.0.0=linux/amd64 registry:localhost:5000/trialbox-py:1.0.0=linux/arm64
          registry:localhost:5000/trialbox-jvm:1.0.0=linux/amd64 registry:localhost:5000/trialbox-jvm:1.0.0=linux/arm64"

      - name: Disk after the gates
        if: always()
        working-directory: /
        run: df -h /

      - name: Findings in the job summary
        if: always()
        run: |
          if [ -f build/supply-chain-multiarch/summary.md ]; then cat build/supply-chain-multiarch/summary.md >> "$GITHUB_STEP_SUMMARY"
          else echo "No gate record was written: the gates did not run to the end." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the record, SBOMs and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-gates-multiarch
          path: |
            trialbox/build/supply-chain-multiarch
            trialbox/dist/sbom
          if-no-files-found: warn
          retention-days: 90
