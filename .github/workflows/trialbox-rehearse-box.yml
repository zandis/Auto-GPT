# TrialBox box-install rehearsal in CI (trialbox/docs/runbook/16-box-install-rehearsal.md; DECISIONS D-887, I-8).
# `make rehearse-box` makes offline media the way the vendor does (the release gates, a signed bundle, placeholder
# weights), clears the images, and runs the REAL deploy/install.sh in a clean Ubuntu 24.04 container with the strict
# vLLM stand-ins: install, doctor, offline, guard, console, SCREEN, a power loss and the restart.
#   test:        the rehearsal as it is (a TEST rehearsal box).
#   validation:  VALIDATION's settings on the rehearsal box: no TPM and the passphrase KEK, TB_HOST_PROFILE=poc, a
#                root-owned deploy/site, the same bundle installed twice. The box stays TEST: the model stand-ins are
#                honoured on a TEST box only (D-726), so the environment name VALIDATION itself is not rehearsed.
# By hand, and on a pull request that touches the installer path. Never on a schedule (D-511: no nightly). The
# repository is public: the hosted runners cost nothing. Not a required check until it has passed once on master.
# Every action is pinned to a commit (tag in the comment).
name: TrialBox box rehearsal

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "trialbox/deploy/install.sh"
      - "trialbox/deploy/box-install.sh"
      - "trialbox/deploy/hardening/**"
      - "trialbox/deploy/check_host.sh"
      - "trialbox/deploy/docker-compose*.yml"
      - "trialbox/deploy/docker/**"
      - "trialbox/tools/make_bundle.sh"
      - "trialbox/tools/apply_update.sh"
      - "trialbox/tools/verify_update.py"
      - "trialbox/tools/sign_bundle.py"
      - "trialbox/tools/release.py"
      - "trialbox/tools/supply_chain/**"
      - "trialbox/tools/trialbox/**"
      - "trialbox/tools/rehearse_box/**"
      - "trialbox/tools/qualify.py"
      - "trialbox/tools/pin_model.py"
      - "trialbox/Makefile"
      - ".github/workflows/trialbox-rehearse-box.yml"

permissions:
  contents: read

concurrency:
  group: trialbox-rehearse-box-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: test
          - variant: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: trialbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml

      # the images, the media (a bundle of them) and the images loaded back: a hosted runner needs the room
      - name: Free runner disk
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/node
          df -h /

      # a site's host has swap off (deploy/check_host.sh FAILs it); a hosted runner has a swap file
      - name: Swap off, as on a site host
        working-directory: /
        run: sudo swapoff -a && free -h

      # the rehearsal's media step runs the release gates: the venv, the pinned scanners and a fresh Trivy DB (D-883)
      - name: Python environment, scanners, Trivy DB
        run: make venv scanners trivy-db

      - name: Box rehearsal (${{ matrix.variant }})
        env:
          TB_REHEARSE_VARIANT: ${{ matrix.variant }}
        run: TB_REHEARSE_DIR="$RUNNER_TEMP/tb/rehearse-box" make rehearse-box

      - name: Report in the job summary
        if: always()
        run: |
          r="$RUNNER_TEMP/tb/rehearse-box/report.md"
          if [ -f "$r" ]; then cat "$r" >> "$GITHUB_STEP_SUMMARY"
          else echo "No report was written: the rehearsal stopped before its end." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rehearse-box-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/tb/rehearse-box/report.md
            ${{ runner.temp }}/tb/rehearse-box/report.json
            ${{ runner.temp }}/tb/rehearse-box/logs
          if-no-files-found: warn
          retention-days: 30
