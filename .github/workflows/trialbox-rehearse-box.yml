# TrialBox box-install rehearsal in CI (trialbox/docs/runbook/16-box-install-rehearsal.md; DECISIONS D-887, I-8).
# `make rehearse-box` makes offline media the way the vendor does (the release gates, a signed bundle, placeholder
# weights), clears the images, and runs the REAL deploy/install.sh in a clean Ubuntu 24.04 container with the strict
# vLLM stand-ins: install, doctor, offline, guard, console, SCREEN, a power loss and the restart.
#   test:        a rehearsal box, first install (VALIDATION since D-514; the passphrase KEK, TB_HOST_PROFILE=poc).
#   validation:  the same, plus a root-owned deploy/site and the same bundle installed twice.
# By hand, and on every pull request: the `changes` job says whether it touches the installer path, the legs run only
# then, and `rehearse-result` is the one check a branch rule requires (D-891): it passes when the legs passed or were
# skipped (no installer change), and fails otherwise. Never on a schedule (D-511: no nightly). The repository is
# public: the hosted runners cost nothing. Every action is pinned to a commit (tag in the comment).
name: TrialBox box rehearsal

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read  # the changes job lists the pull request's files

concurrency:
  group: trialbox-rehearse-box-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # D-891: whether the pull request touches the installer path (by hand: always). The path list lives here only
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      installer: ${{ steps.files.outputs.installer }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          INSTALLER_PATHS: |
            trialbox/deploy/install.sh
            trialbox/deploy/box-install.sh
            trialbox/deploy/hardening/**
            trialbox/deploy/check_host.sh
            trialbox/deploy/docker-compose*.yml
            trialbox/deploy/docker/**
            trialbox/tools/make_bundle.sh
            trialbox/tools/apply_update.sh
            trialbox/tools/verify_update.py
            trialbox/tools/sign_bundle.py
            trialbox/tools/release.py
            trialbox/tools/supply_chain/**
            trialbox/tools/trialbox/**
            trialbox/tools/rehearse_box/**
            trialbox/tools/qualify.py
            trialbox/tools/pin_model.py
            trialbox/tools/fetch_jvm_deps.sh
            trialbox/Makefile
            .github/workflows/trialbox-rehearse-box.yml
        run: |
          if [ "$EVENT" != pull_request ]; then echo "installer=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          hit=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            while IFS= read -r pat; do
              [ -n "$pat" ] || continue
              # shellcheck disable=SC2254  # the pattern is meant to glob (`*` and `**` cross folders here)
              case "$f" in ${pat//\*\*/*}) hit=true; echo "installer path: $f ($pat)" ;; esac
            done <<< "$INSTALLER_PATHS"
          done <<< "$files"
          echo "installer=$hit" >> "$GITHUB_OUTPUT"

  rehearse:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: test
          - variant: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # D-995: measured about 20 min a variant
    defaults:
      run:
        working-directory: trialbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml

      # the images, the media (a bundle of them) and the images loaded back: a hosted runner needs the room
      - name: Free runner disk
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/node
          df -h /

      # a site's host has swap off (deploy/check_host.sh FAILs it); a hosted runner has a swap file
      - name: Swap off, as on a site host
        working-directory: /
        run: sudo swapoff -a && free -h

      # the rehearsal's media step runs the release gates: the venv, the pinned scanners and a fresh Trivy DB (D-883)
      - name: Python environment, scanners, Trivy DB
        run: make venv scanners trivy-db

      - name: Box rehearsal (${{ matrix.variant }})
        env:
          TB_REHEARSE_VARIANT: ${{ matrix.variant }}
        run: TB_REHEARSE_DIR="$RUNNER_TEMP/tb/rehearse-box" make rehearse-box

      - name: Report in the job summary
        if: always()
        run: |
          r="$RUNNER_TEMP/tb/rehearse-box/report.md"
          if [ -f "$r" ]; then cat "$r" >> "$GITHUB_STEP_SUMMARY"
          else echo "No report was written: the rehearsal stopped before its end." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rehearse-box-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/tb/rehearse-box/report.md
            ${{ runner.temp }}/tb/rehearse-box/report.json
            ${{ runner.temp }}/tb/rehearse-box/logs
          if-no-files-found: warn
          retention-days: 30

  # D-891: the one check a branch rule requires. A pull request without an installer change skips the legs and passes
  # here; a failed, cancelled or timed-out leg (or a changes job that could not say) fails here
  rehearse-result:
    needs: [changes, rehearse]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          LEGS: ${{ needs.rehearse.result }}
          INSTALLER: ${{ needs.changes.outputs.installer }}
        run: |
          echo "changes: $CHANGES (installer path: ${INSTALLER:-?}); rehearsal legs: $LEGS"
          [ "$CHANGES" = success ] || { echo "the changes job did not finish: nothing can be said" >&2; exit 1; }
          case "$INSTALLER:$LEGS" in
            true:success|false:skipped) echo "rehearse-result: pass" ;;
            *) echo "rehearse-result: FAIL (installer path $INSTALLER, legs $LEGS)" >&2; exit 1 ;;
          esac
