# TrialBox nightly (D-206, T-007): the longer runs that are not on every pull request. The per-pull-request gate,
# e2e_simple (SRS FR-OPS-11, D-111) included, is trialbox-ci.yml. Here, each on its own runner, every night and on
# demand: public_e2e on the public-data site, the backup and restore drill (TB-PLAN-04 step 2, D-126) and the update
# drill (TB-PLAN-04 step 8, D-138: signed bundles, a failed migration and an unhealthy release roll back), the
# unit suite in random order with the network off, in the gate's shards (D-201, review §5.2 (3), T-658, T-653,
# ENG-002: an order dependence or a network call shows here, not on a pull request), the performance gate on the
# stub at 5,000 patients (ENG-030,
# T-653: a phase more than 20 % slower than tools/bench_baseline.json fails), and the compose job (ENG-017, T-653):
# the images built, `make up-test`, every integration and e2e test (HAPI CQL, the equivalence gate against HAPI, mail
# through GreenMail and Mailpit, the role walk), the browser walk of the public console, then `make poc` and the
# console POC test. The compose job allows no skip (TB_STRICT_SKIPS=1) and keeps its junit files and walk result.
# The scale gate (T-687, D-471; plan v6.1 §5 item 4): the night of a 50,000-patient synthetic hospital, each part under
# the memory cap of its compose service (a cgroup made with systemd-run), with the slow model stand-in; today's
# failures are strict expected failures by card (EXPECTED in tools/scale_gate.py; empty since T-689).
# workflow_dispatch runs the same jobs by hand; the first scheduled run after a change to this file is its proof.
name: TrialBox nightly

on:
  schedule:
    - cron: "17 19 * * *"  # 03:17 in Taipei and 04:17 in Tokyo, outside both sites' working day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trialbox-nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: trialbox

env:
  TB_SCRATCH: ${{ github.workspace }}/../tb-scratch

jobs:
  nightly:
    runs-on: ubuntu-24.04  # carries PostgreSQL 16: tools/ci_postgres.sh installs nothing (ubuntu-latest lost it and cost 7 min of apt)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        run: [public-e2e, backup-drill, update-drill, perf-5k, pure]
    name: ${{ matrix.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - name: Python environment
        run: make venv
      # CQL translator jars, FHIR packages and fonts: fetched once, then cached on the script/pom hash
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            trialbox/.cache/jvm
            trialbox/.cache/fonts
          key: tb-deps-${{ hashFiles('trialbox/tools/fetch_jvm_deps.sh', 'trialbox/tools/fetch_fhir_packages.py', 'trialbox/tools/fetch_fonts.py', 'trialbox/tools/jvm-deps.sha256', 'trialbox/tools/fhir-packages.sha256', 'trialbox/services/criteria_compiler/compile_cql/translator/pom.xml') }}
      - name: JVM dependencies and fonts
        run: make jvm-deps fonts
      # D-126: tools/pglocal.py starts a throwaway cluster from the server binaries (installed here only if missing)
      - name: PostgreSQL server binaries
        run: tools/ci_postgres.sh  # the one major of deploy/images.lock, pg_config --version checked (D-371)
      # ENG-002 (D-560): the public-data site reads the MedTxt corpus (public, CC BY 4.0), which git does not carry
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: matrix.run == 'public-e2e'
        with:
          path: trialbox/.cache/medtxt
          key: tb-medtxt-${{ hashFiles('trialbox/tools/medtxt_eval.py') }}
      - name: The public corpus (MedTxt), fetched once
        if: matrix.run == 'public-e2e'
        run: make public-data
      - name: public_e2e (stub model, the public-data site)
        if: matrix.run == 'public-e2e'
        run: TB_ENV=DEV PYTHONPATH=libs:services:. .venv/bin/python -m tools.public_e2e --dir "$RUNNER_TEMP/public" --lang en
      - name: Backup and restore drill
        if: matrix.run == 'backup-drill'
        run: make backup-drill DRILL_DIR="$RUNNER_TEMP/drill"
      - name: Update drill
        if: matrix.run == 'update-drill'
        run: TB_ENV=DEV PYTHONPATH=libs:services:. .venv/bin/python -m tools.update_drill --dir "$RUNNER_TEMP/update"
      # T-653 (ENG-028): the pure tests with the server binaries pointing nowhere and no TB_TEST_DB_URL: a pure test that
      # reaches for the database fails here (the runner's PostgreSQL is never started for them)
      - name: Pure tests with no PostgreSQL
        if: matrix.run == 'pure'
        run: make test-pure PYTEST_N=auto
      - name: Performance gate (the stub at 5,000 patients against tools/bench_baseline.json)
        if: matrix.run == 'perf-5k'
        run: |
          rc=0
          make bench-gate BENCH_OUT="$RUNNER_TEMP/bench-gate" || rc=$?
          cat "$RUNNER_TEMP/bench-gate/bench_gate.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"
      # D-1245 (10E-13): the console's ten pages, p95 of the console's own time (Server-Timing) under 300 ms; held here
      # nightly, not on each pull request (a pull request runs the walk's rules and the planted slow page only)
      - name: Console page time (the ten-page walk, p95 under 300 ms)
        if: ${{ !cancelled() && matrix.run == 'perf-5k' }}
        run: |
          rc=0
          make console-timing CONSOLE_TIMING_OUT="$RUNNER_TEMP/console-timing" || rc=$?
          cat "$RUNNER_TEMP/console-timing/console_timing.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"
      - name: Keep the performance numbers
        if: always() && matrix.run == 'perf-5k'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-gate
          path: |
            ${{ runner.temp }}/bench-gate
            ${{ runner.temp }}/console-timing
          if-no-files-found: ignore

  # ENG-002 (D-560): the unit suite in random order with the network off (D-201, T-653), in the shards of the
  # pull-request gate's `unit-shard` (D-475: each test file in exactly one shard; tests/unit/test_nightly_green.py
  # holds the two lists and limits equal). On one runner the run was cancelled at 87 % by its limit on 2026-11-11 and
  # never named its one failure; a shard ends inside the limit the gate's shards have, with the test's name.
  random-order:
    name: random-order (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40  # = unit-shard of trialbox-ci.yml (D-564: 1.5 times its slowest shard's median)
    strategy:
      fail-fast: false  # every shard reports: one night shows every order dependence
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - name: Python environment
        run: make venv
      # CQL translator jars, FHIR packages and fonts: fetched once, then cached on the script/pom hash
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            trialbox/.cache/jvm
            trialbox/.cache/fonts
          key: tb-deps-${{ hashFiles('trialbox/tools/fetch_jvm_deps.sh', 'trialbox/tools/fetch_fhir_packages.py', 'trialbox/tools/fetch_fonts.py', 'trialbox/tools/jvm-deps.sha256', 'trialbox/tools/fhir-packages.sha256', 'trialbox/services/criteria_compiler/compile_cql/translator/pom.xml') }}
      - name: JVM dependencies and fonts
        run: make jvm-deps fonts
      # D-126: tools/pglocal.py starts a throwaway cluster from the server binaries (installed here only if missing)
      - name: PostgreSQL server binaries
        run: tools/ci_postgres.sh  # the one major of deploy/images.lock, pg_config --version checked (D-371)
      # the seed is in the log's header ("Using --randomly-seed=..."): `make test-random RANDOM_SEED=<n>` repeats it.
      # No network: a connect to anything but the loopback or a Unix socket fails the test (pytest-socket).
      - name: The unit suite in random order, network off
        env:
          TB_DATA_DIR: ${{ runner.temp }}/tb-data  # the services' default /data is not writable for the runner user
        run: make test-random PYTEST_N=auto SHARD=${{ matrix.shard }}/${{ strategy.job-total }}

  # T-687 (D-471): the scale gate. Never on a pull request (no 50,000-patient run there; the gate's own logic is tested
  # at 200 patients in the unit job, tests/unit/test_scale_gate_logic.py). The caps are read from deploy/docker-compose.yml
  # and enforced by a cgroup per part (`sudo systemd-run --scope -p MemoryMax=<cap> -p MemorySwapMax=0`, what Docker's
  # mem_limit is); the gate refuses to run without one (TB_SCALE_ENFORCE=cgroup). The stand-in: 2 s per call, 502 for
  # 40 s from call 300, one restart (30 s down) after call 900 (the cascade made 1,362 calls at 50,000 in
  # eval/hospital_sim/results/scale.json). The report is the job summary and an artifact.
  scale-50k:
    runs-on: ubuntu-24.04  # 4 cores, 16 GB, systemd and cgroup v2, password-less sudo; PostgreSQL 16 for pglocal
    timeout-minutes: 340  # under GitHub's 360-minute job limit: the night is measured, not budgeted; a hang ends here
    env:
      TB_SCALE_PATIENTS: "50000"
      TB_SCALE_ENFORCE: cgroup
      TB_SCALE_LATENCY_S: "2"
      TB_SCALE_OUTAGE_AFTER: "300"
      TB_SCALE_OUTAGE_S: "40"
      TB_SCALE_RESTART_AFTER: "900"
      TB_SCALE_RESTART_GAP_S: "30"
      TB_HL7_VALIDATOR_JAR: ${{ github.workspace }}/trialbox/.cache/jvm/validator_cli.jar  # as `make jvm-deps` leaves it
      TB_FHIR_PACKAGE_HOME: ${{ github.workspace }}/trialbox/.cache/jvm/fhir-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - name: Python environment
        run: make venv
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            trialbox/.cache/jvm
            trialbox/.cache/fonts
          key: tb-deps-${{ hashFiles('trialbox/tools/fetch_jvm_deps.sh', 'trialbox/tools/fetch_fhir_packages.py', 'trialbox/tools/fetch_fonts.py', 'trialbox/tools/jvm-deps.sha256', 'trialbox/tools/fhir-packages.sha256', 'trialbox/services/criteria_compiler/compile_cql/translator/pom.xml') }}
      - name: JVM dependencies (the HL7 validator of the night runs inside the adapter's cap)
        run: make jvm-deps
      - name: PostgreSQL server binaries
        run: tools/ci_postgres.sh  # the one major of deploy/images.lock, pg_config --version checked (D-371)
      - name: Disk for a 50,000-patient site, its snapshot and its lake
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h "$RUNNER_TEMP"
      - name: The scale gate at 50,000 patients (known failures are XFAIL with their card; a pass of one is red)
        env:
          TB_SCALE_OUT: ${{ runner.temp }}/scale
          TB_DATA_DIR: ${{ runner.temp }}/tb-data
        run: |
          rc=0
          TB_ENV=DEV PYTHONPATH=libs:services:. .venv/bin/python -m pytest -q -n 0 -m perf -rxXs \
            tests/perf/test_scale_gate.py || rc=$?
          cat "$TB_SCALE_OUT/scale_gate.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"
      - name: Keep the report and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scale-gate
          path: |
            ${{ runner.temp }}/scale/scale_gate.md
            ${{ runner.temp }}/scale/scale_gate.json
            ${{ runner.temp }}/scale/logs
          if-no-files-found: ignore

  # ENG-017 (T-653): the tests that need the compose stack, a browser or both. One runner with Docker: the images are
  # built here (as trialbox-images.yml builds them), the stack started with the stub model, and nothing may skip.
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90  # D-995 = D-537's ceiling; measured 37.5 min, about 48 with the new-study walk
    env:
      PLAYWRIGHT_VERSION: "1.63.0"  # = trialbox/tools/package.json and deploy/gcp/complete-run-vm.sh (test_browser_lock)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - name: Python environment
        run: make venv
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            trialbox/.cache/jvm
            trialbox/.cache/fonts
          key: tb-deps-${{ hashFiles('trialbox/tools/fetch_jvm_deps.sh', 'trialbox/tools/fetch_fhir_packages.py', 'trialbox/tools/fetch_fonts.py', 'trialbox/tools/jvm-deps.sha256', 'trialbox/tools/fhir-packages.sha256', 'trialbox/services/criteria_compiler/compile_cql/translator/pom.xml') }}
      - name: JVM dependencies and fonts
        run: make jvm-deps fonts
      - name: PostgreSQL server binaries and gpg
        run: |
          tools/ci_postgres.sh  # the one major of deploy/images.lock (D-371)
          command -v gpg >/dev/null || sudo apt-get install -y gnupg
      - name: Node Playwright with Chromium (outside the repository; NODE_PATH points at it)
        run: |
          mkdir -p "$RUNNER_TEMP/node-tools"
          cp tools/package.json tools/package-lock.json "$RUNNER_TEMP/node-tools/"  # the hashed lock (DEP-025, D-393)
          npm ci --prefix "$RUNNER_TEMP/node-tools" --no-fund --no-audit
          (cd "$RUNNER_TEMP/node-tools" && npx playwright install --with-deps chromium)
          echo "NODE_PATH=$RUNNER_TEMP/node-tools/node_modules" >> "$GITHUB_ENV"
      # D-639: the browser walk below reads the MedTxt corpus (public, CC BY 4.0), which git does not carry; the same
      # cache as the public-e2e run. Fetched before the images and the stack: a fetch that fails stops the job early
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: trialbox/.cache/medtxt
          key: tb-medtxt-${{ hashFiles('trialbox/tools/medtxt_eval.py') }}
      - name: The public corpus (MedTxt), fetched once
        run: make public-data
      - name: Images (as `make images`)
        run: make images
      - name: The compose test stack (stub model)
        run: make up-test
      - name: Integration and e2e tests on the stack (HAPI CQL, mail, the role walk); no skip allowed
        env:
          TB_DATA_DIR: ${{ runner.temp }}/tb-data
          TB_WALK_SHOTS: ${{ runner.temp }}/compose/role-walk
        run: make test-compose COMPOSE_JUNIT="$RUNNER_TEMP/compose/junit-compose.xml"
      - name: The browser walk of the public console (5 roles x 3 languages x desktop and phone)
        if: always()
        run: make walk WALK_DIR="$RUNNER_TEMP/compose/walk"
      - name: The stack's log
        if: failure()
        run: make logs || true
      - name: Stop the test stack
        if: always()
        run: make down || true
      - name: The POC stack (box, mail, console) and the console POC test; no skip allowed
        env:
          TB_CONSOLE_SCREENSHOTS: ${{ runner.temp }}/compose/console-poc
        run: |
          make poc
          TB_INTEGRATION=1 TB_STRICT_SKIPS=1 TB_ENV=TEST PYTHONPATH=libs:services:. .venv/bin/python -m pytest -q \
            -m e2e tests/e2e/test_console_poc.py --junitxml "$RUNNER_TEMP/compose/junit-console-poc.xml"
      - name: Stop the POC stack
        if: always()
        run: make poc-down || true
      - name: Keep the junit files, the walk result and the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: compose
          path: ${{ runner.temp }}/compose
          if-no-files-found: ignore
