# TrialBox nightly (D-206, T-007): the longer runs that are not on every pull request. The per-pull-request gate,
# e2e_simple (SRS FR-OPS-11, D-111) included, is trialbox-ci.yml. Here, each on its own runner, every night and on
# demand: public_e2e on the public-data site, the backup and restore drill (TB-PLAN-04 step 2, D-126) and the update
# drill (TB-PLAN-04 step 8, D-138: signed bundles, a failed migration and an unhealthy release roll back), and the
# unit suite in random order (D-201, review §5.2 (3), T-658: an order dependence shows here, not on a pull request).
name: TrialBox nightly

on:
  schedule:
    - cron: "17 19 * * *"  # 03:17 in Taipei and 04:17 in Tokyo, outside both sites' working day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trialbox-nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: trialbox

env:
  TB_SCRATCH: ${{ github.workspace }}/../tb-scratch

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        run: [public-e2e, backup-drill, update-drill, random-order]
    name: ${{ matrix.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - name: Python environment
        run: make venv
      # CQL translator jars, FHIR packages and fonts: fetched once, then cached on the script/pom hash
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            trialbox/.cache/jvm
            trialbox/.cache/fonts
          key: tb-deps-${{ hashFiles('trialbox/tools/fetch_jvm_deps.sh', 'trialbox/tools/fetch_fhir_packages.py', 'trialbox/tools/fetch_fonts.py', 'trialbox/tools/jvm-deps.sha256', 'trialbox/tools/fhir-packages.sha256', 'trialbox/services/criteria_compiler/compile_cql/translator/pom.xml') }}
      - name: JVM dependencies and fonts
        run: make jvm-deps fonts
      # D-126: tools/pglocal.py starts a throwaway cluster from the server binaries (installed here only if missing)
      - name: PostgreSQL server binaries
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql)
      - name: public_e2e (stub model, the public-data site)
        if: matrix.run == 'public-e2e'
        run: TB_ENV=DEV PYTHONPATH=libs:services:. .venv/bin/python -m tools.public_e2e --dir "$RUNNER_TEMP/public" --lang en
      - name: Backup and restore drill
        if: matrix.run == 'backup-drill'
        run: make backup-drill DRILL_DIR="$RUNNER_TEMP/drill"
      - name: Update drill
        if: matrix.run == 'update-drill'
        run: TB_ENV=DEV PYTHONPATH=libs:services:. .venv/bin/python -m tools.update_drill --dir "$RUNNER_TEMP/update"
      # the seed is in the log's header ("Using --randomly-seed=..."): `make test-random RANDOM_SEED=<n>` repeats it
      - name: The unit suite in random order
        if: matrix.run == 'random-order'
        env:
          TB_DATA_DIR: ${{ runner.temp }}/tb-data  # the services' default /data is not writable for the runner user
        run: make test-random PYTEST_N=auto
