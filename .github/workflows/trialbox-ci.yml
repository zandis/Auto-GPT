# TrialBox CI gate v1 (D-206, T-007, WS-01.4, WS-12.2, WS-13.8): every pull request that touches trialbox/ and every
# push to master runs these jobs; `make ci` runs the same list locally. Job names are stable: branch protection on
# master requires unit, lint, contracts, goldens, data-scan and e2e-simple (the owner sets the list; RUNBOOK §3).
# The nightly drills are in trialbox-e2e.yml; the supply-chain gates (lock-check, allow-list, pip-audit, licences) are
# trialbox-supply-chain.yml (D-185, D-186) and are not repeated here. A job marked continue-on-error carries the date
# and the reason.
name: TrialBox CI

# No `paths:` filter on the triggers: a required check whose workflow never starts blocks a pull request for ever.
# The `changes` job decides instead; a job it skips reports "skipped", which satisfies a required check.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trialbox-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # every push to master keeps its run

defaults:
  run:
    shell: bash
    working-directory: trialbox

env:
  TB_SCRATCH: ${{ github.workspace }}/../tb-scratch

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trialbox: ${{ steps.diff.outputs.trialbox }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "trialbox=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
              | grep -qE '^(trialbox/|\.github/workflows/trialbox-)'; then
            echo "trialbox=true" >> "$GITHUB_OUTPUT"
          else
            echo "trialbox=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.trialbox == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.11.32"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - name: Python environment (uv.lock, exactly)
        run: make venv
      - name: ruff
        run: .venv/bin/python -m ruff check . && .venv/bin/python -m ruff format --check .
      - name: actionlint (the workflows themselves)
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/trialbox-*.yml

  types:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.trialbox == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.11.32"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - run: make venv
      - name: mypy (strict)
        run: .venv/bin/python -m mypy libs services tools tests

  docs:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.trialbox == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.11.32"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - run: make venv
      - name: doclint (the eight documents, links, paths)
        run: .venv/bin/python tools/doclint.py

  contracts:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.trialbox == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.11.32"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - run: make venv
      - name: generated contracts are what the schemas generate (no hand edit)
        run: make contracts-check

  trace:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.trialbox == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.11.32"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - run: make venv
      - name: the traceability CSV is the plan's (tools/gen_traceability.py --check)
        run: .venv/bin/python tools/gen_traceability.py --check

  unit:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.trialbox == 'true'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea  # deploy/docker-compose.yml's
        env:
          POSTGRES_USER: trialbox
          POSTGRES_PASSWORD: trialbox
          POSTGRES_DB: trialbox_wf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trialbox" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # one server for every xdist worker; each test has its own schemas (tb_prefix). The tests connect as a role
      # with LOGIN CREATEDB only, as tools/pglocal.py's clusters do, not as the image's superuser.
      TB_TEST_DB_URL: postgresql://trialbox_app:trialbox_app@localhost:5432/trialbox_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.11.32"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - run: make venv
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            trialbox/.cache/jvm
            trialbox/.cache/fonts
          key: tb-deps-${{ hashFiles('trialbox/tools/fetch_jvm_deps.sh', 'trialbox/tools/fetch_fhir_packages.py', 'trialbox/tools/fetch_fonts.py', 'trialbox/services/criteria_compiler/compile_cql/translator/pom.xml') }}
      - name: JVM dependencies and fonts
        run: make jvm-deps fonts
      # a few tests start their own throwaway cluster (tools/pglocal.py: reconnects, the gc)
      - name: PostgreSQL server binaries
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql)
      # as tools/pglocal.py runs its throwaway clusters: room for every worker's pools, no fsync
      - name: Tune the test server
        run: |
          id="${{ job.services.postgres.id }}"
          docker exec "$id" psql -U trialbox -d trialbox_wf -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET max_connections = 300" -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "CREATE ROLE trialbox_app LOGIN CREATEDB PASSWORD 'trialbox_app'" \
            -c "CREATE DATABASE trialbox_app OWNER trialbox_app"
          docker restart "$id"
          for _ in $(seq 1 60); do docker exec "$id" pg_isready -U trialbox -q && exit 0; sleep 1; done
          echo "the test server did not come back after the restart" >&2; exit 1
      - name: pytest -n auto
        run: make test PYTEST_N=auto 2>&1 | tee "$RUNNER_TEMP/unit.log"
      # D-203: the test log carries no identifier either
      - name: Data-handling scan of the test log
        run: make data-scan SCAN="--log $RUNNER_TEMP/unit.log"

  e2e-simple:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.trialbox == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.11.32"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - run: make venv
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            trialbox/.cache/jvm
            trialbox/.cache/fonts
          key: tb-deps-${{ hashFiles('trialbox/tools/fetch_jvm_deps.sh', 'trialbox/tools/fetch_fhir_packages.py', 'trialbox/tools/fetch_fonts.py', 'trialbox/services/criteria_compiler/compile_cql/translator/pom.xml') }}
      - name: JVM dependencies and fonts
        run: make jvm-deps fonts
      - name: PostgreSQL server binaries
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql)
      - name: e2e_simple (the build gate of D-111)
        run: make e2e-simple E2E_DIR="$RUNNER_TEMP/e2e"
      - name: Keep the check list
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: e2e-simple
          path: ${{ runner.temp }}/e2e.json
          if-no-files-found: ignore

  goldens:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.trialbox == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.11.32"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - run: make venv
      # both lake sources write to PostgreSQL; tools/pglocal.py starts a throwaway cluster from the server binaries
      - name: PostgreSQL server binaries
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql)
      # T-006 (D-205): the committed goldens must not move unless the same pull request rewrites them with
      # `make goldens REASON="D-nnn: ..."`
      - name: Goldens identical, or regenerated in the same commit
        run: make goldens-check

  data-scan:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.trialbox == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.11.32"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - run: make venv
      - name: Data-handling scan (D-203, WS-13.10, TB-SITE-03)
        run: make data-scan

  shell:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.trialbox == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # gates on errors; the warnings are listed. 2026-11-09 (D-206): ten warnings in deploy/*.sh are open findings
      - name: shellcheck
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning --format=gcc || true

  images:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.trialbox == 'true'
    timeout-minutes: 15
    # 2026-11-09 (D-206): hadolint has not run on these Dockerfiles before; listed, not gating, until its first
    # findings are triaged
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: hadolint
        run: |
          rc=0
          for f in deploy/docker/python.Dockerfile deploy/docker/jvm.Dockerfile demo/Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold warning - < "$f" || rc=1
          done
          exit "$rc"
