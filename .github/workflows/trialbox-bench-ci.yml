# TrialBox CI on the bench host (card H-105; trialbox/docs/runbook/13-bench-ci-runner.md, RUNBOOK §13 part).
# The owner's ruling: the bench host runs the slow jobs beside the hosted runners, to make CI faster. This is a separate
# workflow that no branch rule requires: the hosted runners keep the gate (trialbox-ci.yml is unchanged and does not
# depend on this file), so an outage of the bench blocks nothing; a red job here is shown red, because its time and
# result are the measure. Nothing moves off the hosted runners in this card.
# The repository is public. A self-hosted runner runs whatever code reaches it, and a fork's pull request brings its
# own workflow files: this file and its test schedule the bench's jobs, they are no boundary. The boundary is on the
# host: the runner's job-started hook (trialbox/tools/bench_ci/gate.py) runs a job only for a push to this
# repository's train and lane branches (train/*, agent/*, claude/*, lane-*) or the owner's run by hand, of this
# workflow file exactly as it is on master (the review of #1448, F1). The repository variable TB_BENCH_CI ('on', set
# by an admin) and the guard in each job's `if` are scheduling only: unset, every job is skipped, so nothing waits
# for a runner that is not there; a pushed branch could drop both, and the gate would refuse its jobs (F3).
# Weight: a lane push gets the unit shards and the integration run (the CPU profile, the hardest); the GPU suites,
# `make full-set` and the box rehearsal (the engine and GPU profiles, which keep the set-id pair for a nested engine)
# run only for a train and the owner's run by hand.
# trialbox/tests/unit/test_bench_ci_workflow_h105.py reads every workflow and holds the schedule.
# Each bench job runs in a fresh single-use container on the bench host (tools/bench_ci/launcher.py): its own non-root
# user, one scratch folder, no engine socket, an allow-listed way out. Nothing here passes a secret to a job; the
# checkout keeps no credential. Every action is pinned to a commit (tag in the comment).
# Each job writes its wall time to the summary; `bench-times` puts them in one table, to read against the hosted
# runners' times of the same train.
name: TrialBox bench CI

on:
  push:
    branches: ["train/*", "agent/*", "claude/*", "lane-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a lane branch: one run per branch, a new push cancels the older run; a train: a group of its own per run, so a
  # train's run is never cancelled or replaced
  group: trialbox-bench-ci-${{ github.ref }}-${{ startsWith(github.ref, 'refs/heads/train/') && github.run_id || 'latest' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/train/') }}

defaults:
  run:
    shell: bash
    working-directory: trialbox

env:
  TB_SCRATCH: ${{ github.workspace }}/../tb-scratch

jobs:
  # the unit suite in the hosted run's eight shards (trialbox-ci.yml unit-shard), on the bench's CPU slots
  unit-shard:
    name: bench unit-shard (${{ matrix.shard }}/${{ strategy.job-total }})
    if: vars.TB_BENCH_CI == 'on' && ((github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/heads/agent/') || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/lane-'))) || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/heads/agent/') || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/lane-'))))
    runs-on: [self-hosted, tb-bench, tb-bench-cpu]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Start the clock
        working-directory: .
        run: echo "TB_BENCH_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - run: make venv
      - name: JVM dependencies and fonts
        run: make jvm-deps fonts
      - name: PostgreSQL server binaries
        run: tools/ci_postgres.sh
      - name: pytest -n auto, one shard
        env:
          TB_DATA_DIR: ${{ runner.temp }}/tb-data
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/shard"
          make test PYTEST_N=auto SHARD=${{ matrix.shard }}/${{ strategy.job-total }} SHARD_RECORD="$RUNNER_TEMP/shard/shard.json" 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: Data-handling scan of the test log
        if: ${{ !cancelled() }}
        run: make data-scan SCAN="--log $RUNNER_TEMP/unit.log"
      - name: Wall time
        if: always()
        working-directory: .
        env:
          JOB: unit-shard-${{ matrix.shard }}
          RESULT: ${{ job.status }}
        run: |
          s=$(( $(date +%s) - ${TB_BENCH_T0:-$(date +%s)} ))  # cancelled before the clock: 0, not 56 years
          echo "| $JOB | $((s / 60)) min $((s % 60)) s | $RESULT |" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/bench-time"
          printf '{"job": "%s", "seconds": %d, "result": "%s"}\n' "$JOB" "$s" "$RESULT" > "$RUNNER_TEMP/bench-time/$JOB.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-time-unit-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bench-time/
          retention-days: 30

  # the integration run (CPU)
  integration:
    name: bench integration
    if: vars.TB_BENCH_CI == 'on' && ((github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/heads/agent/') || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/lane-'))) || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/heads/agent/') || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/lane-'))))
    runs-on: [self-hosted, tb-bench, tb-bench-cpu]
    timeout-minutes: 60
    steps:
      - name: Start the clock
        working-directory: .
        run: echo "TB_BENCH_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - run: make venv
      - run: make jvm-deps fonts
      - run: tools/ci_postgres.sh
      - name: The integration run
        env:
          TB_DATA_DIR: ${{ runner.temp }}/tb-data
        run: make test-integration
      - name: Wall time
        if: always()
        working-directory: .
        env:
          JOB: integration
          RESULT: ${{ job.status }}
        run: |
          s=$(( $(date +%s) - ${TB_BENCH_T0:-$(date +%s)} ))  # cancelled before the clock: 0, not 56 years
          echo "| $JOB | $((s / 60)) min $((s % 60)) s | $RESULT |" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/bench-time"
          printf '{"job": "%s", "seconds": %d, "result": "%s"}\n' "$JOB" "$s" "$RESULT" > "$RUNNER_TEMP/bench-time/$JOB.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-time-integration
          path: ${{ runner.temp }}/bench-time/
          retention-days: 30

  # the GPU suites (tools/full_set.py stage gpu), on the CI cards; the runner's job-started hook refuses busy cards.
  # A train and the owner's run by hand only: the GPU profile keeps the set-id pair for a nested engine
  gpu-suites:
    name: bench gpu-suites
    if: vars.TB_BENCH_CI == 'on' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/train/')) || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/heads/agent/') || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/lane-'))))
    runs-on: [self-hosted, tb-bench, tb-bench-gpu]
    timeout-minutes: 90  # D-537; no bench measurement yet
    steps:
      - name: Start the clock
        working-directory: .
        run: echo "TB_BENCH_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - run: make venv
      - name: The GPU suites
        run: make full-set FULL_SET_ARGS="--only gpu --out $RUNNER_TEMP/full-set-gpu"
      - name: Wall time
        if: always()
        working-directory: .
        env:
          JOB: gpu-suites
          RESULT: ${{ job.status }}
        run: |
          s=$(( $(date +%s) - ${TB_BENCH_T0:-$(date +%s)} ))  # cancelled before the clock: 0, not 56 years
          echo "| $JOB | $((s / 60)) min $((s % 60)) s | $RESULT |" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/bench-time"
          printf '{"job": "%s", "seconds": %d, "result": "%s"}\n' "$JOB" "$s" "$RESULT" > "$RUNNER_TEMP/bench-time/$JOB.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-time-gpu-suites
          path: ${{ runner.temp }}/bench-time/
          retention-days: 30

  # `make full-set`: the whole set three runs in a row (tools/full_set.py), on a GPU slot (its gpu stage) with the
  # job's own nested engine (its compose, POC and walk stages). A train and the owner's run by hand only: not a lane
  full-set:
    name: bench full-set
    needs: gpu-suites
    # !cancelled(), not always(): always() would also start this ten-hour job after the run was cancelled
    if: ${{ !cancelled() && (vars.TB_BENCH_CI == 'on' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/train/')) || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/heads/agent/') || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/lane-'))))) }}
    runs-on: [self-hosted, tb-bench, tb-bench-gpu]
    timeout-minutes: 600  # named under D-537 (ruling 7119929149): tests/unit/test_ci_jobs_inside_ninety.py
    steps:
      - name: Start the clock
        working-directory: .
        run: echo "TB_BENCH_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - run: make venv
      - run: make jvm-deps fonts
      - run: tools/ci_postgres.sh
      - name: make full-set
        env:
          TB_DATA_DIR: ${{ runner.temp }}/tb-data
        run: make full-set FULL_SET_ARGS="--out $RUNNER_TEMP/full-set"
      - name: Wall time
        if: always()
        working-directory: .
        env:
          JOB: full-set
          RESULT: ${{ job.status }}
        run: |
          s=$(( $(date +%s) - ${TB_BENCH_T0:-$(date +%s)} ))  # cancelled before the clock: 0, not 56 years
          echo "| $JOB | $((s / 60)) min $((s % 60)) s | $RESULT |" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/bench-time"
          printf '{"job": "%s", "seconds": %d, "result": "%s"}\n' "$JOB" "$s" "$RESULT" > "$RUNNER_TEMP/bench-time/$JOB.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-time-full-set
          path: ${{ runner.temp }}/bench-time/
          retention-days: 30

  # the box rehearsal (tools/rehearse_box/rehearse.sh) with the job's own nested engine. A train and the owner's run
  # by hand only: the engine profile keeps the set-id pair
  rehearse-box:
    name: bench rehearse-box
    if: vars.TB_BENCH_CI == 'on' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/train/')) || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/heads/agent/') || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/lane-'))))
    runs-on: [self-hosted, tb-bench, tb-bench-engine]
    timeout-minutes: 60  # D-537; the hosted rehearse job's limit (about 20 min measured, D-995)
    steps:
      - name: Start the clock
        working-directory: .
        run: echo "TB_BENCH_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - name: Python environment, scanners, scanner database
        run: make venv scanners trivy-db
      - name: Box rehearsal (test)
        env:
          TB_REHEARSE_VARIANT: test
        run: TB_REHEARSE_DIR="$RUNNER_TEMP/tb/rehearse-box" make rehearse-box
      - name: Wall time
        if: always()
        working-directory: .
        env:
          JOB: rehearse-box
          RESULT: ${{ job.status }}
        run: |
          s=$(( $(date +%s) - ${TB_BENCH_T0:-$(date +%s)} ))  # cancelled before the clock: 0, not 56 years
          echo "| $JOB | $((s / 60)) min $((s % 60)) s | $RESULT |" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/bench-time"
          printf '{"job": "%s", "seconds": %d, "result": "%s"}\n' "$JOB" "$s" "$RESULT" > "$RUNNER_TEMP/bench-time/$JOB.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-time-rehearse-box
          path: ${{ runner.temp }}/bench-time/
          retention-days: 30

  # H-105b: the GPU box rehearsal (tools/bench_ci/gpu_box.sh) on a GPU slot: the TPM fact, the GPU record, the weights
  # folder and the job's own engine; the install under a real init, the first-run step, the unit start and the real
  # servers say NOT RUN until they are ruled and built. A train and the owner's run by hand only: not a lane
  rehearse-gpu-box:
    name: bench rehearse-gpu-box
    if: vars.TB_BENCH_CI == 'on' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/train/')) || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/heads/agent/') || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/lane-'))))
    runs-on: [self-hosted, tb-bench, tb-bench-gpu]
    timeout-minutes: 60  # D-537; no bench measurement yet
    steps:
      - name: Start the clock
        working-directory: .
        run: echo "TB_BENCH_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: GPU box rehearsal
        run: tools/bench_ci/gpu_box.sh "$RUNNER_TEMP/gpu-box"
      - name: Report in the job summary
        if: always()
        run: |
          r="$RUNNER_TEMP/gpu-box/report.md"
          if [ -f "$r" ]; then cat "$r" >> "$GITHUB_STEP_SUMMARY"
          else echo "No report was written: the GPU box rehearsal stopped before its end." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Wall time
        if: always()
        working-directory: .
        env:
          JOB: rehearse-gpu-box
          RESULT: ${{ job.status }}
        run: |
          s=$(( $(date +%s) - ${TB_BENCH_T0:-$(date +%s)} ))  # cancelled before the clock: 0, not 56 years
          echo "| $JOB | $((s / 60)) min $((s % 60)) s | $RESULT |" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/bench-time"
          printf '{"job": "%s", "seconds": %d, "result": "%s"}\n' "$JOB" "$s" "$RESULT" > "$RUNNER_TEMP/bench-time/$JOB.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-time-rehearse-gpu-box
          path: ${{ runner.temp }}/bench-time/
          retention-days: 30

  # one table of every bench job's wall time and result, on a hosted runner (it needs no bench)
  bench-times:
    name: bench times
    needs: [unit-shard, integration, gpu-suites, full-set, rehearse-box, rehearse-gpu-box]
    if: always() && (vars.TB_BENCH_CI == 'on' && ((github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/heads/agent/') || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/lane-'))) || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/train/') || startsWith(github.ref, 'refs/heads/agent/') || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/lane-')))))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: bench-time-*
          path: ${{ runner.temp }}/bench-time
          merge-multiple: true
      - name: Wall times
        working-directory: .
        run: |
          {
            echo "### Bench host: wall time of each job (${GITHUB_REF_NAME}, ${GITHUB_SHA:0:12})"
            echo
            echo "| job | wall time | result |"
            echo "| --- | --- | --- |"
            python3 - "$RUNNER_TEMP/bench-time" <<'EOF'
          import json, pathlib, sys
          rows = [json.loads(p.read_text()) for p in sorted(pathlib.Path(sys.argv[1]).glob("*.json"))]
          for r in sorted(rows, key=lambda r: r["job"]):
              s = int(r["seconds"])
              print(f"| {r['job']} | {s // 60} min {s % 60} s | {r['result']} |")
          if not rows:
              print("| (no bench job reported a time: no bench runner took a job) | | |")
          EOF
          } >> "$GITHUB_STEP_SUMMARY"
