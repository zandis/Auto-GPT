# TrialBox nightly quality (T-651, ENG-029; TB-DR-04 §3.2, §3.3): mutation testing of the safety core and the branch
# coverage of the unit suite. Never on a pull request: the mutation run takes hours, and the pull-request
# unit job already checks line coverage (trialbox-ci.yml, step "Coverage ratchet"). Every night and on demand.
#
# mutation: tools/mutation.py over the targets of tools/mutation.toml, in three shards; the `mutation-score` job adds
#   them up and fails under the floor of the config (the target is 90 %). The JSON of every mutant is an artifact.
# branch-coverage: the unit suite with branches measured (the classic tracer: slower, so not on a pull request), then
#   tools/coverage_ratchet.py with the branch figures: a package more than 0.5 point under its baseline, or a
#   safety-core file under its floor, fails.
name: TrialBox nightly quality

on:
  schedule:
    - cron: "47 16 * * *"  # 00:47 in Taipei, before the other nightly (03:17), outside both sites' working day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trialbox-nightly-quality
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: trialbox

env:
  TB_SCRATCH: ${{ github.workspace }}/../tb-scratch

jobs:
  mutation:
    runs-on: ubuntu-24.04  # carries PostgreSQL 16: tools/ci_postgres.sh installs nothing (ubuntu-latest lost it and cost 7 min of apt)
    timeout-minutes: 300  # the runner starts no mutant after 200 minutes (--budget-minutes); the rest are listed
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: engine
            targets: --target services/matching/cascade/engine.py
          - shard: evaluate
            targets: --target services/orchestrator/scenarios/evaluate.py
          - shard: rules
            targets: >-
              --target libs/tb_common/pair.py --target libs/tb_common/quotes.py --target services/matching/coverage.py
              --target services/matching/proposed.py --target services/matching/cascade/judge.py
    name: mutation (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - run: make venv
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            trialbox/.cache/jvm
            trialbox/.cache/fonts
          key: tb-deps-${{ hashFiles('trialbox/tools/fetch_jvm_deps.sh', 'trialbox/tools/fetch_fhir_packages.py', 'trialbox/tools/fetch_fonts.py', 'trialbox/tools/jvm-deps.sha256', 'trialbox/tools/fhir-packages.sha256', 'trialbox/services/criteria_compiler/compile_cql/translator/pom.xml') }}
      - name: JVM dependencies and fonts
        run: make jvm-deps fonts
      - name: PostgreSQL server binaries
        run: tools/ci_postgres.sh  # the one major of deploy/images.lock, pg_config --version checked (D-371)
      - name: Mutants of the shard
        env:
          TB_DATA_DIR: ${{ runner.temp }}/tb-data
          TARGETS: ${{ matrix.targets }}
        # the score is judged over all shards in mutation-score; a shard under the threshold alone does not fail
        run: |
          # shellcheck disable=SC2086  # TARGETS is a list of flags
          .venv/bin/python -m tools.mutation $TARGETS --workers "$(nproc)" --budget-minutes 200 \
            --report "$RUNNER_TEMP/mutation-${{ matrix.shard }}.json" 2>&1 | tee "$RUNNER_TEMP/mutation.log" || true
          test -s "$RUNNER_TEMP/mutation-${{ matrix.shard }}.json"
      - name: Data-handling scan of the log
        run: make data-scan SCAN="--log $RUNNER_TEMP/mutation.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: mutation-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutation-${{ matrix.shard }}.json
          if-no-files-found: ignore

  mutation-score:
    runs-on: ubuntu-latest
    needs: mutation
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: mutation-*
          path: ${{ runner.temp }}/mutation
          merge-multiple: true
      - name: Mutation score of the safety core (floor and target in tools/mutation.toml)
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP"/mutation/mutation-*.json)
          test "${#reports[@]}" -eq 3 || { echo "expected 3 shard reports, found ${#reports[@]}"; exit 1; }
          python3 -m tools.mutation --merge "${reports[@]}" --report "$RUNNER_TEMP/mutation.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: mutation
          path: ${{ runner.temp }}/mutation.json
          if-no-files-found: ignore

  # The unit suite with branches measured, in the shards of the pull-request gate's `unit-shard` (D-475: each test
  # file in exactly one shard). On one runner it was cancelled at its 60-minute limit on both scheduled runs
  # (2026-11-11 and 2026-11-12) and never reached the ratchet: the suite takes 35 to 55 minutes on one runner with the
  # cheap line tracer, and the classic tracer that measures branches took 2.2 times as long on the safety-property
  # tests (40.6 s against 17.8 s, 2026-11-13; deep review `architecture`). Limit: the gate shard's limit (1.5 times its
  # slowest shard's median) times that 2.2, rounded up to the next ten. `branch-coverage-ratchet` combines the shards.
  # tests/unit/test_nightly_quality_shards.py holds the shards, the limit and the combine step to these rules.
  branch-coverage:
    name: branch-coverage (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04  # carries PostgreSQL 16: tools/ci_postgres.sh installs nothing (ubuntu-latest lost it and cost 7 min of apt)
    timeout-minutes: 90  # 40 (unit-shard) x 2.2 (classic tracer with branches), rounded up to the next ten
    strategy:
      fail-fast: false  # every shard reports
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version-file: trialbox/.java-version
          cache: maven
          cache-dependency-path: trialbox/services/criteria_compiler/compile_cql/translator/pom.xml
      - run: make venv
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            trialbox/.cache/jvm
            trialbox/.cache/fonts
          key: tb-deps-${{ hashFiles('trialbox/tools/fetch_jvm_deps.sh', 'trialbox/tools/fetch_fhir_packages.py', 'trialbox/tools/fetch_fonts.py', 'trialbox/tools/jvm-deps.sha256', 'trialbox/tools/fhir-packages.sha256', 'trialbox/services/criteria_compiler/compile_cql/translator/pom.xml') }}
      - name: JVM dependencies and fonts
        run: make jvm-deps fonts
      - name: PostgreSQL server binaries
        run: tools/ci_postgres.sh  # the one major of deploy/images.lock, pg_config --version checked (D-371)
      - name: pytest -n auto with branch coverage, one shard
        env:
          TB_DATA_DIR: ${{ runner.temp }}/tb-data
          PYTEST_ADDOPTS: --cov --cov-branch --cov-report=
        run: |
          mkdir -p "$RUNNER_TEMP/shard"
          make test PYTEST_N=auto SHARD=${{ matrix.shard }}/${{ strategy.job-total }} 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: Data-handling scan of the test log
        run: make data-scan SCAN="--log $RUNNER_TEMP/unit.log"
      - name: Keep the shard's coverage data
        if: always()
        run: if [ -f .coverage ]; then mv .coverage "$RUNNER_TEMP/shard/coverage.db"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-branch-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/
          if-no-files-found: ignore
          retention-days: 3

  # The ratchet on the combined branch coverage of every shard; red when a shard did not pass, so a cancelled shard
  # cannot leave the night green on part of the suite.
  branch-coverage-ratchet:
    runs-on: ubuntu-latest
    needs: branch-coverage
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    steps:
      - name: Every shard passed
        working-directory: .
        run: |
          echo "branch-coverage: ${{ needs.branch-coverage.result }}"
          if [ "${{ needs.branch-coverage.result }}" != "success" ]; then
            echo "::error::a branch-coverage shard did not pass (${{ needs.branch-coverage.result }})"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"  # the uv of trialbox/uv.lock (tools/supply_chain/lock.py UV_VERSION)
          enable-cache: true
          cache-dependency-glob: trialbox/uv.lock
      - run: make venv
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-branch-shard-*
          path: ${{ runner.temp }}/shards
      - name: Combined branch coverage of all shards
        run: |
          .venv/bin/python -m coverage combine --data-file="$RUNNER_TEMP/coverage.db" "$RUNNER_TEMP"/shards/coverage-branch-shard-*/coverage.db
          .venv/bin/python -m coverage json --data-file="$RUNNER_TEMP/coverage.db" -o "$RUNNER_TEMP/coverage.json"
      - name: Coverage ratchet with branches
        run: .venv/bin/python -m tools.coverage_ratchet "$RUNNER_TEMP/coverage.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-branch
          path: ${{ runner.temp }}/coverage.json
          if-no-files-found: ignore
